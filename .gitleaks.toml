# gitleaks configuration. The default rules stay on; this file only adds
# allowlists, and each one says why it is safe.
title = "utilake"

[extend]
useDefault = true

[[allowlists]]
description = "Lockfile integrity hashes"
paths = ['''(^|/)Cargo\.lock$''']

[[allowlists]]
description = "Fixtures are public AEMO data and scraped documentation; hashes in sidecars are not keys"
paths = ['''^testdata/''']
