    { id = 2, name = "DUID", type = "string", nullable = false },
    { id = 3, name = "ORIGIN", type = "string", nullable = true },
    { id = 4, name = "FORECAST_PRIORITY", type = "double", nullable = true },
    { id = 5, name = "OFFERDATETIME", type = "timestamp_ns", nullable = true },
]

