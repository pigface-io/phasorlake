# Our schema of REGIONAPCINTERVALS. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "REGIONAPCINTERVALS"
description = "REGIONAPCINTERVALS contains Administered Price profiles (Energy and FCAS) applicable to each interval for a region."
report_pairs = [["AP", "REGIONAPCINTERVALS"]]
load_mode = "snapshot"
primary_key = ["REGIONID", "EFFECTIVEDATE", "VERSIONNO", "PERIODID"]
next_column_id = 10

column = [
    { id = 1, name = "REGIONID", type = "string", nullable = false },
    { id = 2, name = "EFFECTIVEDATE", type = "timestamp_ns", nullable = false },
    { id = 3, name = "VERSIONNO", type = "double", nullable = false },
    { id = 4, name = "PERIODID", type = "double", nullable = false },
    { id = 5, name = "APCVALUE", type = "double", nullable = true },
    { id = 6, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
    { id = 7, name = "APCTYPE", type = "double", nullable = true },
    { id = 8, name = "FCASAPCVALUE", type = "double", nullable = true },
    { id = 9, name = "APFVALUE", type = "double", nullable = true },
]

[temporal]
origin = "derived"
entity = ["REGIONID", "PERIODID"]
valid = { kind = "from", column = "EFFECTIVEDATE" }
order = ["VERSIONNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"

[[increment]]
n = 1
from = "2015-01"
ctl = "001.ctl"
ctl_sha256 = "553c6732811b68c503d4657baeff9f4b93cf837ef98ca99ad09602541ca15c50"
aemo_ctl = "PUBLIC_DVD_REGIONAPCINTERVALS_201501.ctl"
aemo_versions = [1]
columns = [
    "REGIONID",
    "EFFECTIVEDATE",
    "VERSIONNO",
    "PERIODID",
    "APCVALUE",
    "LASTCHANGED",
    "APCTYPE",
    "FCASAPCVALUE",
    "APFVALUE",
]
