    { id = 8, name = "MWLOSSES", type = "double", nullable = true },
    { id = 9, name = "MARGINALVALUE", type = "double", nullable = true },
    { id = 10, name = "VIOLATIONDEGREE", type = "double", nullable = true },
    { id = 11, name = "LASTCHANGED", type = "timestamp", nullable = true },
    { id = 12, name = "EXPORTLIMIT", type = "double", nullable = true },
    { id = 13, name = "IMPORTLIMIT", type = "double", nullable = true },
    { id = 14, name = "MARGINALLOSS", type = "double", nullable = true },
    { id = 15, name = "EXPORTGENCONID", type = "string", nullable = true },
    { id = 16, name = "IMPORTGENCONID", type = "string", nullable = true },
    { id = 17, name = "FCASEXPORTLIMIT", type = "double", nullable = true },
    { id = 18, name = "FCASIMPORTLIMIT", type = "double", nullable = true },
    { id = 19, name = "LOCAL_PRICE_ADJUSTMENT_EXPORT", type = "double", nullable = true },
