# Our schema of DISPATCHINTERCONNECTORRES. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "DISPATCHINTERCONNECTORRES"
description = "DISPATCHINTERCONNECTORRES sets out MW flow and losses on each interconnector for each dispatch period, including fields for the Frequency Controlled Ancillary Services export and import limits and extra reporting of the generic constraints set the energy import and export limits."
report_pairs = [["DISPATCH", "INTERCONNECTORRES"]]
load_mode = "append"
primary_key = ["SETTLEMENTDATE", "RUNNO", "INTERCONNECTORID", "DISPATCHINTERVAL", "INTERVENTION"]
time_column = "SETTLEMENTDATE"
next_column_id = 23

column = [
    { id = 1, name = "SETTLEMENTDATE", type = "timestamp", nullable = false },
    { id = 2, name = "RUNNO", type = "double", nullable = false },
    { id = 3, name = "INTERCONNECTORID", type = "string", nullable = false },
    { id = 4, name = "DISPATCHINTERVAL", type = "double", nullable = false },
    { id = 5, name = "INTERVENTION", type = "double", nullable = false },
    { id = 6, name = "METEREDMWFLOW", type = "double", nullable = true },
