# Our schema of P5MIN_BLOCKEDCONSTRAINT. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 2
name = "P5MIN_BLOCKEDCONSTRAINT"
description = "P5MIN Blocked Constraints lists any constraints that were blocked in a P5MIN run. If no constraints are blocked, there will be no rows for that 5 minute predispatch run."
report_pairs = [["P5MIN", "BLOCKED_CONSTRAINTS"]]
load_mode = "append"
dedupe = "pk"
primary_key = ["RUN_DATETIME", "CONSTRAINTID"]
time_column = "RUN_DATETIME"
next_column_id = 3

column = [
    { id = 1, name = "RUN_DATETIME", type = "timestamp_ns", nullable = false },
    { id = 2, name = "CONSTRAINTID", type = "string", nullable = false },
]

[[increment]]
n = 1
from = "2026-08"
ctl = "001.ctl"
ctl_sha256 = "0634589a6ed83f24a3a8f55c1651b24501e6722343a56781d18815deda43907a"
aemo_ctl = "PUBLIC_ARCHIVE#P5MIN_BLOCKEDCONSTRAINT#FILE01#202608.ctl"
aemo_versions = [1]
