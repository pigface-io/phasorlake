    { id = 4, name = "ENDDATE", type = "timestamp_ns", nullable = true },
    { id = 5, name = "ENDPERIOD", type = "double", nullable = true },
    { id = 6, name = "REASON", type = "string", nullable = true },
    { id = 7, name = "STARTAUTHORISEDBY", type = "string", nullable = true },
    { id = 8, name = "ENDAUTHORISEDBY", type = "string", nullable = true },
    { id = 9, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
]

