# Our schema of DISPATCHCONSTRAINT. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "DISPATCHCONSTRAINT"
description = "DISPATCHCONSTRAINT sets out details of all binding and interregion constraints in each dispatch run. Note: invoked constraints can be established from GENCONSETINVOKE. Binding constraints show as marginal value >$0. Interconnector constraints are listed so RHS (SCADA calculated limits) can be reported."
report_pairs = [["DISPATCH", "CONSTRAINT"]]
load_mode = "append"
primary_key = ["SETTLEMENTDATE", "RUNNO", "CONSTRAINTID", "DISPATCHINTERVAL", "INTERVENTION"]
time_column = "SETTLEMENTDATE"
next_column_id = 15

column = [
    { id = 1, name = "SETTLEMENTDATE", type = "timestamp", nullable = false },
    { id = 2, name = "RUNNO", type = "double", nullable = false },
    { id = 3, name = "CONSTRAINTID", type = "string", nullable = false },
    { id = 4, name = "DISPATCHINTERVAL", type = "double", nullable = false },
    { id = 5, name = "INTERVENTION", type = "double", nullable = false },
    { id = 6, name = "RHS", type = "double", nullable = true },
    { id = 7, name = "MARGINALVALUE", type = "double", nullable = true },
    { id = 8, name = "VIOLATIONDEGREE", type = "double", nullable = true },
    { id = 9, name = "LASTCHANGED", type = "timestamp", nullable = true },
    { id = 10, name = "DUID", type = "string", nullable = true },
    { id = 11, name = "GENCONID_EFFECTIVEDATE", type = "timestamp", nullable = true },
    { id = 12, name = "GENCONID_VERSIONNO", type = "double", nullable = true },
    { id = 13, name = "LHS", type = "double", nullable = true },
    { id = 14, name = "CONFIDENTIAL_TO", type = "string", nullable = true },
]

[temporal]
origin = "derived"
entity = ["CONSTRAINTID", "DISPATCHINTERVAL", "INTERVENTION"]
valid = { kind = "interval_end", column = "SETTLEMENTDATE" }
order = ["RUNNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"

