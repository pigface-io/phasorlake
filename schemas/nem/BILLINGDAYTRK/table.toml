# Our schema of BILLINGDAYTRK. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "BILLINGDAYTRK"
description = "BILLINGDAYTRK is key for matching settlement versions with billing runs. BILLINGDAYTRK displays the billrunnos per billing week, and the settlement version numbers per settlement day comprising the billrunno."
report_pairs = [["BILLING", "DAYTRK"]]
load_mode = "append"
primary_key = ["CONTRACTYEAR", "WEEKNO", "BILLRUNNO", "SETTLEMENTDATE"]
time_column = "SETTLEMENTDATE"
next_column_id = 7

column = [
    { id = 1, name = "CONTRACTYEAR", type = "double", nullable = false },
    { id = 2, name = "WEEKNO", type = "double", nullable = false },
    { id = 3, name = "BILLRUNNO", type = "double", nullable = false },
    { id = 4, name = "SETTLEMENTDATE", type = "timestamp", nullable = false },
    { id = 5, name = "RUNNO", type = "double", nullable = true },
    { id = 6, name = "LASTCHANGED", type = "timestamp", nullable = true },
]

[temporal]
origin = "derived"
entity = ["CONTRACTYEAR", "WEEKNO"]
valid = { kind = "interval_end", column = "SETTLEMENTDATE" }
order = ["BILLRUNNO", "RUNNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"

[[increment]]
n = 1
from = "2015-01"
ctl = "001.ctl"
ctl_sha256 = "b0227fcc62c788bdc321d4f7751990b3a36c1c6893202b33dcf250d3e69c3cfd"
aemo_ctl = "PUBLIC_DVD_BILLINGDAYTRK_201501.ctl"
aemo_versions = [5]
columns = [
    "CONTRACTYEAR",
    "WEEKNO",
    "BILLRUNNO",
    "SETTLEMENTDATE",
    "RUNNO",
    "LASTCHANGED",
]
