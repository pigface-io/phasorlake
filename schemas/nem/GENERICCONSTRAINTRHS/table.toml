    { id = 1, name = "GENCONID", type = "string", nullable = false },
    { id = 2, name = "EFFECTIVEDATE", type = "timestamp_ns", nullable = false },
    { id = 3, name = "VERSIONNO", type = "double", nullable = false },
    { id = 4, name = "SCOPE", type = "string", nullable = false },
    { id = 5, name = "TERMID", type = "double", nullable = false },
