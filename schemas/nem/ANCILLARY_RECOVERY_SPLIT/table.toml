# Our schema of ANCILLARY_RECOVERY_SPLIT. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "ANCILLARY_RECOVERY_SPLIT"
description = "ANCILLARY_RECOVERY_SPLIT holds the actual customer portion for each service and payment type. A single EFFECTIVEDATE/VERSIONNO combination applies to all services (i.e. the latest EFFECTIVEDATE/VERSIONNO is not retrieved for a single service, but applies to a data set)."
report_pairs = [["SETTLEMENT_CONFIG", "ANCILLARY_RECOVERY_SPLIT"]]
load_mode = "snapshot"
primary_key = ["EFFECTIVEDATE", "VERSIONNO", "SERVICE", "PAYMENTTYPE"]
next_column_id = 8

column = [
    { id = 1, name = "EFFECTIVEDATE", type = "timestamp", nullable = false },
    { id = 2, name = "VERSIONNO", type = "double", nullable = false },
    { id = 3, name = "SERVICE", type = "string", nullable = false },
    { id = 4, name = "PAYMENTTYPE", type = "string", nullable = false },
    { id = 5, name = "CUSTOMER_PORTION", type = "double", nullable = true },
    { id = 6, name = "LASTCHANGED", type = "timestamp", nullable = true },
    { id = 7, name = "ACE_PORTION", type = "double", nullable = true },
]

[temporal]
origin = "derived"
entity = ["SERVICE", "PAYMENTTYPE"]
valid = { kind = "from", column = "EFFECTIVEDATE" }
order = ["VERSIONNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"

[[increment]]
n = 1
from = "2015-01"
ctl = "001.ctl"
ctl_sha256 = "a10331f9671587998ce47d574ff6bf7b29d2c82cd495135fc0b422d3e48241f3"
aemo_ctl = "PUBLIC_DVD_ANCILLARY_RECOVERY_SPLIT_201501.ctl"
aemo_versions = []
columns = [
    "EFFECTIVEDATE",
    "VERSIONNO",
    "SERVICE",
    "PAYMENTTYPE",
    "CUSTOMER_PORTION",
    "LASTCHANGED",
]

[[increment]]
n = 2
from = "2024-05"
ctl = "002.ctl"
ctl_sha256 = "6ae64a6b132c9a44e67cf19ab84a55f6b27947bff68082d62a7774c286d52587"
aemo_ctl = "PUBLIC_DVD_ANCILLARY_RECOVERY_SPLIT_202405.ctl"
aemo_versions = [2]
columns = [
    "EFFECTIVEDATE",
    "VERSIONNO",
    "SERVICE",
    "PAYMENTTYPE",
    "CUSTOMER_PORTION",
    "LASTCHANGED",
    "ACE_PORTION",
]
