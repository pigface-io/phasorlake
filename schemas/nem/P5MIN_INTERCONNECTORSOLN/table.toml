# Our schema of P5MIN_INTERCONNECTORSOLN. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "P5MIN_INTERCONNECTORSOLN"
description = """
The five-minute predispatch (P5Min) is a MMS system providing projected dispatch for 12 Dispatch cycles (one hour). The 5-minute Predispatch cycle runs every 5-minutes to produce a dispatch and pricing schedule to a 5-minute resolution covering the next hour, a total of twelve periods.
P5MIN_INTERCONNECTORSOLN sets out the results of the capacity evaluation for Interconnectors, including the calculated limits for the interval."""
report_pairs = [["P5MIN", "INTERCONNECTORSOLN"]]
load_mode = "append"
primary_key = ["RUN_DATETIME", "INTERCONNECTORID", "INTERVAL_DATETIME"]
time_column = "INTERVAL_DATETIME"
next_column_id = 23

column = [
    { id = 1, name = "RUN_DATETIME", type = "timestamp_ns", nullable = false },
    { id = 3, name = "INTERCONNECTORID", type = "string", nullable = false },
    { id = 4, name = "INTERVAL_DATETIME", type = "timestamp_ns", nullable = false },
    { id = 5, name = "METEREDMWFLOW", type = "double", nullable = true },
    { id = 6, name = "MWFLOW", type = "double", nullable = true },
    { id = 7, name = "MWLOSSES", type = "double", nullable = true },
    { id = 8, name = "MARGINALVALUE", type = "double", nullable = true },
    { id = 9, name = "VIOLATIONDEGREE", type = "double", nullable = true },
    { id = 10, name = "MNSP", type = "double", nullable = true },
    { id = 11, name = "EXPORTLIMIT", type = "double", nullable = true },
    { id = 12, name = "IMPORTLIMIT", type = "double", nullable = true },
    { id = 13, name = "MARGINALLOSS", type = "double", nullable = true },
    { id = 14, name = "EXPORTGENCONID", type = "string", nullable = true },
    { id = 15, name = "IMPORTGENCONID", type = "string", nullable = true },
    { id = 16, name = "FCASEXPORTLIMIT", type = "double", nullable = true },
    { id = 17, name = "FCASIMPORTLIMIT", type = "double", nullable = true },
    { id = 18, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
    { id = 19, name = "LOCAL_PRICE_ADJUSTMENT_EXPORT", type = "double", nullable = true },
    { id = 20, name = "LOCALLY_CONSTRAINED_EXPORT", type = "double", nullable = true },
    { id = 21, name = "LOCAL_PRICE_ADJUSTMENT_IMPORT", type = "double", nullable = true },
    { id = 22, name = "LOCALLY_CONSTRAINED_IMPORT", type = "double", nullable = true },
    { id = 2, name = "INTERVENTION", type = "double", nullable = true },
]

