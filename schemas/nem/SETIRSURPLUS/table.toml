# Our schema of SETIRSURPLUS. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "SETIRSURPLUS"
description = "SETIRSURPLUS records the interregional residue calculation for each interconnector and each side of the interconnector."
report_pairs = [["SETTLEMENTS", "IRSURPLUS"]]
load_mode = "append"
primary_key = ["SETTLEMENTDATE", "SETTLEMENTRUNNO", "PERIODID", "INTERCONNECTORID", "REGIONID"]
time_column = "SETTLEMENTDATE"
next_column_id = 12

column = [
    { id = 1, name = "SETTLEMENTDATE", type = "timestamp", nullable = false },
    { id = 2, name = "SETTLEMENTRUNNO", type = "double", nullable = false },
    { id = 3, name = "PERIODID", type = "double", nullable = false },
    { id = 4, name = "INTERCONNECTORID", type = "string", nullable = false },
    { id = 5, name = "REGIONID", type = "string", nullable = false },
    { id = 6, name = "MWFLOW", type = "double", nullable = true },
    { id = 7, name = "LOSSFACTOR", type = "double", nullable = true },
    { id = 8, name = "SURPLUSVALUE", type = "double", nullable = true },
    { id = 9, name = "LASTCHANGED", type = "timestamp", nullable = true },
    { id = 11, name = "CSP_DEROGATION_AMOUNT", type = "double", nullable = true },
    { id = 10, name = "UNADJUSTED_IRSR", type = "double", nullable = true },
]

[temporal]
origin = "derived"
entity = ["SETTLEMENTRUNNO", "PERIODID", "INTERCONNECTORID", "REGIONID"]
valid = { kind = "interval_end", column = "SETTLEMENTDATE" }
order = ["LASTCHANGED"]
cutoff = "LASTCHANGED"

