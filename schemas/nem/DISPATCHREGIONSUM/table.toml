# Our schema of DISPATCHREGIONSUM. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 2
name = "DISPATCHREGIONSUM"
description = "DISPATCHREGIONSUM sets out the 5-minute solution for each dispatch run for each region, including the Frequency Control Ancillary Services (FCAS) services provided. Additional fields are for the Raise Regulation and Lower Regulation Ancillary Services plus improvements to demand calculations."
