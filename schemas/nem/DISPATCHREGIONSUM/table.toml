load_mode = "append"
dedupe = "pk_lastchanged"
primary_key = ["SETTLEMENTDATE", "RUNNO", "REGIONID", "DISPATCHINTERVAL", "INTERVENTION"]
time_column = "SETTLEMENTDATE"
next_column_id = 128

