# Our schema of TRADINGPRICE. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "TRADINGPRICE"
description = "TRADINGPRICE sets out half-hourly spot market price, including fields to handle the Ancillary Services functionality. If prices are adjusted, the final price is recorded in the regional reference price (RRP) field with price before adjustment recorded in the regional original price (ROP) field."
report_pairs = [["TRADING", "PRICE"]]
load_mode = "append"
primary_key = ["SETTLEMENTDATE", "RUNNO", "REGIONID", "PERIODID"]
time_column = "SETTLEMENTDATE"
next_column_id = 31

column = [
    { id = 1, name = "SETTLEMENTDATE", type = "timestamp", nullable = false },
    { id = 2, name = "RUNNO", type = "double", nullable = false },
    { id = 3, name = "REGIONID", type = "string", nullable = false },
    { id = 4, name = "PERIODID", type = "double", nullable = false },
    { id = 5, name = "RRP", type = "double", nullable = true },
    { id = 6, name = "EEP", type = "double", nullable = true },
    { id = 7, name = "INVALIDFLAG", type = "string", nullable = true },
    { id = 8, name = "LASTCHANGED", type = "timestamp", nullable = true },
    { id = 9, name = "ROP", type = "double", nullable = true },
    { id = 10, name = "RAISE1SECRRP", type = "double", nullable = true },
