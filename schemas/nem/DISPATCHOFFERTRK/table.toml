# Our schema of DISPATCHOFFERTRK. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 2
name = "DISPATCHOFFERTRK"
description = "DISPATCHOFFERTRK is the energy and ancillary service bid tracking table for the Dispatch process. The table identifies which bids from BIDDAYOFFER and BIDPEROFFER were applied for a given unit and bid type for each dispatch interval."
report_pairs = [["DISPATCH", "OFFERTRK"]]
load_mode = "append"
dedupe = "pk_lastchanged"
primary_key = ["SETTLEMENTDATE", "DUID", "BIDTYPE"]
time_column = "SETTLEMENTDATE"
next_column_id = 7

column = [
    { id = 1, name = "SETTLEMENTDATE", type = "timestamp_ns", nullable = false },
    { id = 2, name = "DUID", type = "string", nullable = false },
    { id = 3, name = "BIDTYPE", type = "string", nullable = false },
    { id = 4, name = "BIDSETTLEMENTDATE", type = "timestamp_ns", nullable = true },
    { id = 5, name = "BIDOFFERDATE", type = "timestamp_ns", nullable = true },
    { id = 6, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
]

[[increment]]
n = 1
from = "2024-01"
ctl = "001.ctl"
ctl_sha256 = "bce0498e4f4c7109cd9602be44f01153ff701800029d8706ed011a235d4ddfa4"
aemo_ctl = "PUBLIC_DVD_DISPATCHOFFERTRK_202401.ctl"
aemo_versions = [1]
columns = [
    "SETTLEMENTDATE",
    "DUID",
    "BIDTYPE",
    "BIDSETTLEMENTDATE",
    "BIDOFFERDATE",
    "LASTCHANGED",
]
