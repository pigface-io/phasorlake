# Our schema of DISPATCH_LOCAL_PRICE. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 2
name = "DISPATCH_LOCAL_PRICE"
description = "Sets out local pricing offsets associated with each DUID connection point for each dispatch period. Note that from 2014 Mid year release only records with non-zero Local_Price_Adjustment values are issued"
report_pairs = [["DISPATCH", "LOCAL_PRICE"]]
load_mode = "append"
dedupe = "pk"
primary_key = ["SETTLEMENTDATE", "DUID"]
time_column = "SETTLEMENTDATE"
next_column_id = 5

column = [
    { id = 1, name = "SETTLEMENTDATE", type = "timestamp_ns", nullable = false },
    { id = 2, name = "DUID", type = "string", nullable = false },
    { id = 3, name = "LOCAL_PRICE_ADJUSTMENT", type = "double", nullable = true },
    { id = 4, name = "LOCALLY_CONSTRAINED", type = "double", nullable = true },
]

[[increment]]
n = 1
from = "2026-08"
ctl = "001.ctl"
ctl_sha256 = "13f27e43966daca2134e37978ad4653fe0b680357c044b21faca34b5c1b982bb"
aemo_ctl = "PUBLIC_ARCHIVE#DISPATCH_LOCAL_PRICE#FILE01#202608.ctl"
aemo_versions = [1]
columns = [
    "SETTLEMENTDATE",
    "DUID",
    "LOCAL_PRICE_ADJUSTMENT",
    "LOCALLY_CONSTRAINED",
]
