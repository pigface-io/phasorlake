# Our schema of GENERICEQUATIONRHS. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 2
name = "GENERICEQUATIONRHS"
description = "GENERICEQUATIONRHS stores the formulation of commonly used Generic Constraint Right Hand Side Equations referenced from Generic Constraint Right Hand Side definitions stored in GENERICCONSTRAINTRHS. The Generic Equation definitions are versioned and the latest effective version is applied to the dispatch process."
report_pairs = [["GEQRHS", ""], ["GEQRHS", "NULL"]]
load_mode = "append"
dedupe = "pk_lastchanged"
primary_key = ["EQUATIONID", "EFFECTIVEDATE", "VERSIONNO", "TERMID"]
time_column = "EFFECTIVEDATE"
next_column_id = 15

column = [
    { id = 1, name = "EQUATIONID", type = "string", nullable = false },
    { id = 2, name = "EFFECTIVEDATE", type = "timestamp_ns", nullable = false },
    { id = 3, name = "VERSIONNO", type = "double", nullable = false },
    { id = 4, name = "TERMID", type = "double", nullable = false },
    { id = 5, name = "GROUPID", type = "double", nullable = true },
    { id = 6, name = "SPD_ID", type = "string", nullable = true },
    { id = 7, name = "SPD_TYPE", type = "string", nullable = true },
    { id = 8, name = "FACTOR", type = "double", nullable = true },
    { id = 9, name = "OPERATION", type = "string", nullable = true },
    { id = 10, name = "DEFAULTVALUE", type = "double", nullable = true },
    { id = 11, name = "PARAMETERTERM1", type = "string", nullable = true },
    { id = 12, name = "PARAMETERTERM2", type = "string", nullable = true },
    { id = 13, name = "PARAMETERTERM3", type = "string", nullable = true },
    { id = 14, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
]

[[increment]]
