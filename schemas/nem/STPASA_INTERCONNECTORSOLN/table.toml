# Our schema of STPASA_INTERCONNECTORSOLN. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "STPASA_INTERCONNECTORSOLN"
description = "STPASA_INTERCONNECTORSOLN shows the results of the capacity evaluation for Interconnectors, including the calculated limits for the interval."
report_pairs = [["STPASA", "INTERCONNECTORSOLN"]]
load_mode = "append"
primary_key = ["RUN_DATETIME", "INTERVAL_DATETIME", "INTERCONNECTORID", "RUNTYPE"]
time_column = "INTERVAL_DATETIME"
next_column_id = 14

column = [
    { id = 1, name = "RUN_DATETIME", type = "timestamp", nullable = false },
    { id = 2, name = "INTERVAL_DATETIME", type = "timestamp", nullable = false },
    { id = 3, name = "INTERCONNECTORID", type = "string", nullable = false },
    { id = 4, name = "CAPACITYMWFLOW", type = "double", nullable = true },
    { id = 5, name = "CAPACITYMARGINALVALUE", type = "double", nullable = true },
    { id = 6, name = "CAPACITYVIOLATIONDEGREE", type = "double", nullable = true },
    { id = 7, name = "CALCULATEDEXPORTLIMIT", type = "double", nullable = true },
    { id = 8, name = "CALCULATEDIMPORTLIMIT", type = "double", nullable = true },
    { id = 9, name = "LASTCHANGED", type = "timestamp", nullable = true },
    { id = 10, name = "RUNTYPE", type = "string", nullable = false },
    { id = 11, name = "EXPORTLIMITCONSTRAINTID", type = "string", nullable = true },
    { id = 12, name = "IMPORTLIMITCONSTRAINTID", type = "string", nullable = true },
    { id = 13, name = "STUDYREGIONID", type = "string", nullable = true },
]

