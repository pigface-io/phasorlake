# Our schema of APEVENT. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 2
name = "APEVENT"
description = "APEVENT is the driving data defining the existence and timeframes of an administered pricing event."
report_pairs = [["AP", "APEVENT"]]
load_mode = "append"
dedupe = "pk_lastchanged"
primary_key = ["APEVENTID"]
time_column = "LASTCHANGED"
next_column_id = 10

column = [
    { id = 1, name = "APEVENTID", type = "double", nullable = false },
    { id = 2, name = "EFFECTIVEFROMINTERVAL", type = "timestamp_ns", nullable = true },
    { id = 3, name = "EFFECTIVETOINTERVAL", type = "timestamp_ns", nullable = true },
    { id = 4, name = "REASON", type = "string", nullable = true },
    { id = 5, name = "STARTAUTHORISEDBY", type = "string", nullable = true },
    { id = 6, name = "STARTAUTHORISEDDATE", type = "timestamp_ns", nullable = true },
    { id = 7, name = "ENDAUTHORISEDBY", type = "string", nullable = true },
    { id = 8, name = "ENDAUTHORISEDDATE", type = "timestamp_ns", nullable = true },
    { id = 9, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
]

[[increment]]
n = 1
from = "2015-10"
ctl = "001.ctl"
ctl_sha256 = "c1fd15b9fb41cb3e7c9d1c17e85e67430c2bb8d04bab5c4ecfd311ef46ba1de3"
aemo_ctl = "PUBLIC_DVD_APEVENT_201510.ctl"
aemo_versions = [1]
columns = [
    "APEVENTID",
    "EFFECTIVEFROMINTERVAL",
    "EFFECTIVETOINTERVAL",
    "REASON",
    "STARTAUTHORISEDBY",
    "STARTAUTHORISEDDATE",
    "ENDAUTHORISEDBY",
    "ENDAUTHORISEDDATE",
    "LASTCHANGED",
]
