# Our schema of PREDISPATCHINTERCONNECTORRES. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 2
name = "PREDISPATCHINTERCONNECTORRES"
description = """
PREDISPATCHINTERCONNECTORRES records Interconnector flows and losses for the periods calculated in each predispatch run. Only binding and interconnector constraints are reported.
Some fields are for the Frequency Controlled Ancillary Services export and import limits and extra reporting of the generic constraint setting the energy import and export limits."""
report_pairs = [["PREDISPATCH", "INTERCONNECTOR_SOLN"]]
load_mode = "append"
dedupe = "pk_lastchanged"
primary_key = ["INTERCONNECTORID", "DATETIME"]
time_column = "DATETIME"
next_column_id = 24

column = [
    { id = 1, name = "PREDISPATCHSEQNO", type = "string", nullable = true },
    { id = 2, name = "RUNNO", type = "double", nullable = true },
    { id = 3, name = "INTERCONNECTORID", type = "string", nullable = false },
    { id = 4, name = "PERIODID", type = "string", nullable = true },
