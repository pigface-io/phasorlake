# Our schema of STATIONOWNERTRK. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "STATIONOWNERTRK"
description = "STATIONOWNERTRK shows the tracking for the associated object STATIONOWNER. Together, STATIONOWNERTRK and STATIONOWNER sets out the owner details of each station."
report_pairs = [["PARTICIPANT_REGISTRATION", "STATIONOWNERTRK"]]
load_mode = "snapshot"
primary_key = ["EFFECTIVEDATE", "PARTICIPANTID", "VERSIONNO"]
next_column_id = 7

column = [
    { id = 1, name = "EFFECTIVEDATE", type = "timestamp_ns", nullable = false },
    { id = 2, name = "PARTICIPANTID", type = "string", nullable = false },
    { id = 3, name = "VERSIONNO", type = "double", nullable = false },
    { id = 4, name = "AUTHORISEDBY", type = "string", nullable = true },
    { id = 5, name = "AUTHORISEDDATE", type = "timestamp_ns", nullable = true },
    { id = 6, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
]

[temporal]
origin = "derived"
entity = ["PARTICIPANTID"]
valid = { kind = "from", column = "EFFECTIVEDATE" }
order = ["VERSIONNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"

[[increment]]
n = 1
from = "2015-01"
ctl = "001.ctl"
ctl_sha256 = "8e90ccbf6a9e8f3eaeb205fb09171253445110e0228319c5d68ec1b25e0b9985"
aemo_ctl = "PUBLIC_DVD_STATIONOWNERTRK_201501.ctl"
aemo_versions = [1]
columns = [
