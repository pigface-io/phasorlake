# Our schema of REGIONAPC. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "REGIONAPC"
description = "REGIONAPC defines Administered Price profiles (Energy and FCAS) for a region."
report_pairs = [["AP", "REGIONAPC"]]
load_mode = "snapshot"
primary_key = ["REGIONID", "EFFECTIVEDATE", "VERSIONNO"]
next_column_id = 7

column = [
    { id = 1, name = "REGIONID", type = "string", nullable = false },
    { id = 2, name = "EFFECTIVEDATE", type = "timestamp", nullable = false },
    { id = 3, name = "VERSIONNO", type = "double", nullable = false },
    { id = 4, name = "AUTHORISEDDATE", type = "timestamp", nullable = true },
    { id = 5, name = "AUTHORISEDBY", type = "string", nullable = true },
    { id = 6, name = "LASTCHANGED", type = "timestamp", nullable = true },
]

[temporal]
origin = "derived"
entity = ["REGIONID"]
valid = { kind = "from", column = "EFFECTIVEDATE" }
order = ["VERSIONNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"

[[increment]]
n = 1
from = "2015-01"
ctl = "001.ctl"
ctl_sha256 = "cae7d6c524560c6eedde6ecfd330969745cef410559415e1fd4dc2df5f0dd8b3"
aemo_ctl = "PUBLIC_DVD_REGIONAPC_201501.ctl"
aemo_versions = [1]
columns = [
    "REGIONID",
    "EFFECTIVEDATE",
    "VERSIONNO",
    "AUTHORISEDDATE",
    "AUTHORISEDBY",
    "LASTCHANGED",
]
