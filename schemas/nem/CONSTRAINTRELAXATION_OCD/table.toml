    { id = 1, name = "SETTLEMENTDATE", type = "timestamp_ns", nullable = false },
    { id = 2, name = "RUNNO", type = "double", nullable = false },
    { id = 3, name = "CONSTRAINTID", type = "string", nullable = false },
    { id = 4, name = "RHS", type = "double", nullable = true },
    { id = 5, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
    { id = 6, name = "VERSIONNO", type = "double", nullable = false },
]

