# Our schema of BILLINGRUNTRK. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 2
name = "BILLINGRUNTRK"
description = "BILLINGRUNTRK identifies the Statement type (i.e. Status of PRELIM, FINAL, REVISE) and date of the BillRunNo posted, per WeekNo. This provides a further extension of tracking data from the BILLINGDAYTRK table."
report_pairs = [["BILLING", "RUNTRK"]]
load_mode = "append"
dedupe = "pk_lastchanged"
primary_key = ["CONTRACTYEAR", "WEEKNO", "BILLRUNNO"]
time_column = "LASTCHANGED"
next_column_id = 18

column = [
    { id = 1, name = "CONTRACTYEAR", type = "double", nullable = false },
    { id = 2, name = "WEEKNO", type = "double", nullable = false },
    { id = 3, name = "BILLRUNNO", type = "double", nullable = false },
    { id = 4, name = "STATUS", type = "string", nullable = true },
    { id = 5, name = "ADJ_CLEARED", type = "string", nullable = true },
    { id = 6, name = "AUTHORISEDDATE", type = "timestamp_ns", nullable = true },
    { id = 7, name = "AUTHORISEDBY", type = "string", nullable = true },
    { id = 8, name = "POSTDATE", type = "timestamp_ns", nullable = true },
    { id = 9, name = "POSTBY", type = "string", nullable = true },
    { id = 10, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
    { id = 11, name = "RECEIPTPOSTDATE", type = "timestamp_ns", nullable = true },
    { id = 12, name = "RECEIPTPOSTBY", type = "string", nullable = true },
    { id = 13, name = "PAYMENTPOSTDATE", type = "timestamp_ns", nullable = true },
    { id = 14, name = "PAYMENTPOSTBY", type = "string", nullable = true },
    { id = 15, name = "SHORTFALL", type = "double", nullable = true },
    { id = 16, name = "MAKEUP", type = "double", nullable = true },
    { id = 17, name = "REVISIONINDEX", type = "double", nullable = true },
]

