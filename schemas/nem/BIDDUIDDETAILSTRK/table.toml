    { id = 4, name = "AUTHORISEDDATE", type = "timestamp_ns", nullable = true },
    { id = 5, name = "AUTHORISEDBY", type = "string", nullable = true },
    { id = 6, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
]

