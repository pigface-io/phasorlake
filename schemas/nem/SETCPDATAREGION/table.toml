# Our schema of SETCPDATAREGION. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "SETCPDATAREGION"
description = "SETCPDATAREGION sets out summary meter settlement data for each region."
report_pairs = [["SETTLEMENTS", "CPDATAREGION"]]
load_mode = "append"
primary_key = ["SETTLEMENTDATE", "VERSIONNO", "PERIODID", "REGIONID"]
time_column = "SETTLEMENTDATE"
next_column_id = 13

column = [
    { id = 1, name = "SETTLEMENTDATE", type = "timestamp", nullable = false },
    { id = 2, name = "VERSIONNO", type = "double", nullable = false },
    { id = 3, name = "PERIODID", type = "double", nullable = false },
    { id = 4, name = "REGIONID", type = "string", nullable = false },
    { id = 5, name = "SUMIGENERGY", type = "double", nullable = true },
    { id = 6, name = "SUMXGENERGY", type = "double", nullable = true },
    { id = 7, name = "SUMINENERGY", type = "double", nullable = true },
    { id = 8, name = "SUMXNENERGY", type = "double", nullable = true },
    { id = 9, name = "SUMIPOWER", type = "double", nullable = true },
    { id = 10, name = "SUMXPOWER", type = "double", nullable = true },
    { id = 11, name = "LASTCHANGED", type = "timestamp", nullable = true },
    { id = 12, name = "SUMEP", type = "double", nullable = true },
]

[temporal]
origin = "derived"
entity = ["PERIODID", "REGIONID"]
valid = { kind = "interval_end", column = "SETTLEMENTDATE" }
order = ["VERSIONNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"

[[increment]]
