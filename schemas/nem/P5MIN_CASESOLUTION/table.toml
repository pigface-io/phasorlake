# Our schema of P5MIN_CASESOLUTION. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "P5MIN_CASESOLUTION"
description = """
The five-minute predispatch (P5Min) is a MMS system providing projected dispatch for 12 Dispatch cycles (one hour). The 5-minute Predispatch cycle runs every 5-minutes to produce a dispatch and pricing schedule to a 5-minute resolution covering the next hour, a total of twelve periods.
P5MIN_CASESOLUTION shows one record containing results pertaining to the entire solution."""
report_pairs = [["P5MIN", "CASESOLUTION"]]
load_mode = "append"
primary_key = ["RUN_DATETIME"]
time_column = "RUN_DATETIME"
next_column_id = 20

column = [
    { id = 1, name = "RUN_DATETIME", type = "timestamp_ns", nullable = false },
    { id = 3, name = "STARTINTERVAL_DATETIME", type = "string", nullable = true },
    { id = 4, name = "TOTALOBJECTIVE", type = "double", nullable = true },
    { id = 5, name = "NONPHYSICALLOSSES", type = "double", nullable = true },
    { id = 6, name = "TOTALAREAGENVIOLATION", type = "double", nullable = true },
    { id = 7, name = "TOTALINTERCONNECTORVIOLATION", type = "double", nullable = true },
    { id = 8, name = "TOTALGENERICVIOLATION", type = "double", nullable = true },
    { id = 9, name = "TOTALRAMPRATEVIOLATION", type = "double", nullable = true },
    { id = 10, name = "TOTALUNITMWCAPACITYVIOLATION", type = "double", nullable = true },
    { id = 11, name = "TOTAL5MINVIOLATION", type = "double", nullable = true },
    { id = 12, name = "TOTALREGVIOLATION", type = "double", nullable = true },
    { id = 13, name = "TOTAL6SECVIOLATION", type = "double", nullable = true },
    { id = 14, name = "TOTAL60SECVIOLATION", type = "double", nullable = true },
    { id = 15, name = "TOTALENERGYCONSTRVIOLATION", type = "double", nullable = true },
    { id = 16, name = "TOTALENERGYOFFERVIOLATION", type = "double", nullable = true },
    { id = 17, name = "TOTALASPROFILEVIOLATION", type = "double", nullable = true },
    { id = 18, name = "TOTALFASTSTARTVIOLATION", type = "double", nullable = true },
    { id = 19, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
    { id = 2, name = "INTERVENTION", type = "double", nullable = true },
]

[temporal]
origin = "derived"
entity = ["INTERVENTION"]
valid = { kind = "instant", column = "RUN_DATETIME" }
order = ["LASTCHANGED"]
cutoff = "LASTCHANGED"

