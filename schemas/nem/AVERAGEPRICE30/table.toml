# Our schema of AVERAGEPRICE30. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "AVERAGEPRICE30"
description = "New table reflecting the 30-minute average price (i.e. the pre-1 July 2021 Trading Price)."
report_pairs = [["TRADING", "AVERAGEPRICE30"]]
load_mode = "append"
primary_key = ["PERIODDATE", "REGIONID"]
time_column = "LASTCHANGED"
next_column_id = 7

column = [
    { id = 1, name = "PERIODDATE", type = "timestamp_ns", nullable = false },
    { id = 2, name = "REGIONID", type = "string", nullable = false },
    { id = 3, name = "PERIODID", type = "double", nullable = true },
    { id = 4, name = "RRP", type = "double", nullable = true },
    { id = 5, name = "PRICE_CONFIDENCE", type = "string", nullable = true },
    { id = 6, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
]

