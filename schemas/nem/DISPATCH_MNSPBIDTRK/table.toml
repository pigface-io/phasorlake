# Our schema of DISPATCH_MNSPBIDTRK. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "DISPATCH_MNSPBIDTRK"
description = "DISPATCH_MNSPBIDTRK shows the MNSP bid tracking, including the bid version used in each dispatch run for each MNSP Interconnector Link. DISPATCH_MNSPBIDTRK is the audit trail of the bids actually used for each dispatch run."
report_pairs = [["DISPATCH", "MNSPBIDTRK"]]
load_mode = "append"
primary_key = ["SETTLEMENTDATE", "RUNNO", "PARTICIPANTID", "LINKID"]
time_column = "SETTLEMENTDATE"
next_column_id = 9

column = [
    { id = 1, name = "SETTLEMENTDATE", type = "timestamp_ns", nullable = false },
    { id = 2, name = "RUNNO", type = "double", nullable = false },
    { id = 3, name = "PARTICIPANTID", type = "string", nullable = false },
    { id = 4, name = "LINKID", type = "string", nullable = false },
    { id = 5, name = "OFFERSETTLEMENTDATE", type = "timestamp_ns", nullable = true },
    { id = 6, name = "OFFEREFFECTIVEDATE", type = "timestamp_ns", nullable = true },
    { id = 7, name = "OFFERVERSIONNO", type = "double", nullable = true },
    { id = 8, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
]

[temporal]
origin = "derived"
entity = ["PARTICIPANTID", "LINKID"]
valid = { kind = "interval_end", column = "SETTLEMENTDATE" }
order = ["RUNNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"

[[increment]]
n = 1
from = "2015-01"
ctl = "001.ctl"
ctl_sha256 = "e35d47a57d0f6adfdc88205e6542d35c06e68bf56708c12119917282e8a37ba4"
aemo_ctl = "PUBLIC_DVD_DISPATCH_MNSPBIDTRK_201501.ctl"
aemo_versions = []
columns = [
    "SETTLEMENTDATE",
    "RUNNO",
    "PARTICIPANTID",
    "LINKID",
    "OFFERSETTLEMENTDATE",
    "OFFEREFFECTIVEDATE",
    "OFFERVERSIONNO",
    "LASTCHANGED",
]

