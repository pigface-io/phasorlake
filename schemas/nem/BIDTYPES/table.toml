# Our schema of BIDTYPES. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 2
name = "BIDTYPES"
description = """
BIDTYPES, together with the associated tracking data in BIDTYPESTRK, define a set of ancillary services with bidding parameters from a given date.
BIDTYPES is static data describing each type of bid quantity, the number of applicable bands, how many days ahead a price lock down becomes effective and the validation rule that applies."""
report_pairs = [["MARKET_CONFIG", "BIDTYPES"]]
load_mode = "snapshot"
dedupe = "pk_lastchanged"
primary_key = ["BIDTYPE", "EFFECTIVEDATE", "VERSIONNO"]
next_column_id = 10

column = [
    { id = 1, name = "BIDTYPE", type = "string", nullable = false },
    { id = 2, name = "EFFECTIVEDATE", type = "timestamp_ns", nullable = false },
    { id = 3, name = "VERSIONNO", type = "double", nullable = false },
    { id = 4, name = "DESCRIPTION", type = "string", nullable = true },
    { id = 5, name = "NUMBEROFBANDS", type = "double", nullable = true },
    { id = 6, name = "NUMDAYSAHEADPRICELOCKED", type = "double", nullable = true },
    { id = 7, name = "VALIDATIONRULE", type = "string", nullable = true },
    { id = 8, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
    { id = 9, name = "SPDALIAS", type = "string", nullable = true },
]

[[increment]]
n = 1
from = "2015-01"
ctl = "001.ctl"
ctl_sha256 = "c0e55550040ae776d5a4dbc4276c43174b678c8a99a4cb080b7017bd54bdee36"
aemo_ctl = "PUBLIC_DVD_BIDTYPES_201501.ctl"
aemo_versions = [1]
columns = [
    "BIDTYPE",
    "EFFECTIVEDATE",
    "VERSIONNO",
    "DESCRIPTION",
    "NUMBEROFBANDS",
    "NUMDAYSAHEADPRICELOCKED",
    "VALIDATIONRULE",
    "LASTCHANGED",
    "SPDALIAS",
]
