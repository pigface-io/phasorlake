# Our schema of AUCTION_TRANCHE. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "AUCTION_TRANCHE"
description = "AUCTION_TRANCHE supports the Settlement Residue Auction, by holding the default definitions for the percentage number of units allocated and dates applicable to each tranche for a specified auction quarter. This information provides the basis for setting up contracts for individual tranches."
report_pairs = [["IRAUCTION_CONFIG", "AUCTION_TRANCHE"]]
load_mode = "append"
primary_key = ["CONTRACTYEAR", "QUARTER", "VERSIONNO", "TRANCHE"]
time_column = "LASTCHANGED"
next_column_id = 11

column = [
    { id = 1, name = "CONTRACTYEAR", type = "double", nullable = false },
    { id = 2, name = "QUARTER", type = "double", nullable = false },
    { id = 3, name = "VERSIONNO", type = "double", nullable = false },
    { id = 4, name = "TRANCHE", type = "double", nullable = false },
    { id = 5, name = "AUCTIONDATE", type = "timestamp_ns", nullable = true },
    { id = 6, name = "NOTIFYDATE", type = "timestamp_ns", nullable = true },
    { id = 7, name = "UNITALLOCATION", type = "double", nullable = true },
    { id = 8, name = "CHANGEDATE", type = "timestamp_ns", nullable = true },
    { id = 9, name = "CHANGEDBY", type = "string", nullable = true },
    { id = 10, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
]

[temporal]
origin = "derived"
entity = ["CONTRACTYEAR", "QUARTER", "TRANCHE"]
valid = { kind = "timeless" }
order = ["VERSIONNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"

[[increment]]
n = 1
from = "2015-01"
ctl = "001.ctl"
ctl_sha256 = "3399ecb2185e70f6e471ae2e8f916e349d526e97701b7d46bb1246b65eb0ff48"
aemo_ctl = "PUBLIC_DVD_AUCTION_TRANCHE_201501.ctl"
aemo_versions = [1]
columns = [
    "CONTRACTYEAR",
    "QUARTER",
    "VERSIONNO",
    "TRANCHE",
    "AUCTIONDATE",
    "NOTIFYDATE",
    "UNITALLOCATION",
    "CHANGEDATE",
    "CHANGEDBY",
    "LASTCHANGED",
]
