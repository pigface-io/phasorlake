    { id = 2, name = "EFFECTIVEDATE", type = "timestamp", nullable = true },
    { id = 3, name = "VERSIONNO", type = "double", nullable = false },
    { id = 4, name = "PERIODID", type = "double", nullable = false },
    { id = 5, name = "AMOUNT", type = "double", nullable = true },
    { id = 6, name = "AUTHORISEDBY", type = "string", nullable = true },
    { id = 7, name = "AUTHORISEDDATE", type = "timestamp", nullable = true },
    { id = 8, name = "LASTCHANGED", type = "timestamp", nullable = true },
]

