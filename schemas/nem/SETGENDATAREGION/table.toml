    { id = 11, name = "EXCESSENERGYCOST", type = "double", nullable = true },
    { id = 12, name = "EXPENERGY", type = "double", nullable = true },
    { id = 13, name = "EXPENERGYCOST", type = "double", nullable = true },
    { id = 14, name = "LASTCHANGED", type = "timestamp", nullable = true },
]

