    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
    ["FIXEDLOAD", "NUMERIC(12,6)", true, "Inflexibility flag and availability. Fixed unit output MW. A value of zero means no fixed load so the unit is dispatched according to bid and market (rather than zero fixed load)"],
