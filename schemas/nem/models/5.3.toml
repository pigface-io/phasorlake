columns = [
    ["EFFECTIVEDATE", "TIMESTAMP(0)", false, "The effective date for this regulation FCAS usage factor"],
    ["VERSIONNO", "NUMERIC(3,0)", false, "Version of the date with respect to effective date"],
    ["AUTHORISEDDATE", "TIMESTAMP(0)", true, "The date time that this set of usage factors was authorised"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "The last time the data has been changed/updated"],
]

[tables.FORCEMAJEURE]
