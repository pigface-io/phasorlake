primary_key = ["CONTRACTYEAR", "WEEKNO", "BILLRUNNO", "PARTICIPANTID", "INTERCONNECTORID"]
columns = [
    ["CONTRACTYEAR", "NUMERIC(22,0)", false, "AEMO Contract Year number starting in week containing 1st January"],
    ["WEEKNO", "NUMERIC(22,0)", false, "Week no within the contract year. Week no 1 is the week containing 1st January"],
    ["BILLRUNNO", "NUMERIC(22,0)", false, "Unique run no within a given contract year and week no"],
    ["PARTICIPANTID", "VARCHAR(10)", false, "Unique participant identifier"],
    ["NL", "NUMERIC(15,6)", true, "Sum of billing week (RRP * interconnector flow)"],
    ["PARTICIPANTDEMAND", "NUMERIC(15,6)", true, "The sum of all customer purchases in MWh"],
    ["REGIONDEMAND", "NUMERIC(15,6)", true, "Sum of all region purchases in MWh"],
    ["WHITEHOLEPAYMENT", "NUMERIC(15,6)", true, "Payment in $"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "The latest date and time that a file was updated or inserted"],
    ["INTERCONNECTORID", "VARCHAR(10)", false, "Interconnector ID"],
]

[tables.CONNECTIONPOINT]
comment = "CONNECTIONPOINT shows all valid connection points and their type. Transmission loss factors are available for all connection points in TRANSMISSIONLOSSFACTOR."
primary_key = ["CONNECTIONPOINTID"]
columns = [
    ["CONNECTIONPOINTID", "VARCHAR(10)", false, "Connection Point Identifier"],
    ["CONNECTIONPOINTNAME", "VARCHAR(80)", true, "Connection point full description"],
    ["CONNECTIONPOINTTYPE", "VARCHAR(20)", true, "Connection point type. transmission, distribution, station, genunit, or interconnector"],
    ["ADDRESS1", "VARCHAR(80)", true, "Connection point location"],
    ["ADDRESS2", "VARCHAR(80)", true, "Connection point location"],
    ["ADDRESS3", "VARCHAR(80)", true, "Connection point location"],
    ["ADDRESS4", "VARCHAR(80)", true, "Not Used"],
    ["CITY", "VARCHAR(40)", true, "City"],
    ["STATE", "VARCHAR(10)", true, "State of Australia"],
    ["POSTCODE", "VARCHAR(10)", true, "Post Code"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
]

[tables.CONNECTIONPOINTDETAILS]
comment = "CONNECTIONPOINTDETAILS is obsolete, since it was never populated by Participants accessing AEMO's Oracle Interface.\nCONNECTIONPOINTDETAILS was designed to show relevant details for each connection point including the responsible party, loss factor and relevant MDAs."
primary_key = ["EFFECTIVEDATE", "VERSIONNO", "CONNECTIONPOINTID"]
columns = [
    ["EFFECTIVEDATE", "TIMESTAMP(0)", false, "Effective date of record"],
    ["VERSIONNO", "NUMERIC(3,0)", false, "Version no of record for given effective date"],
    ["CONNECTIONPOINTID", "VARCHAR(10)", false, "Connection point identifier"],
    ["REGIONID", "VARCHAR(10)", true, "Region Identifier"],
    ["TRANSMISSIONCPTID", "VARCHAR(10)", true, "Associated transmission connection point id for a distribution connection point"],
    ["METERDATAPROVIDER", "VARCHAR(10)", true, "The MDA providing meter data for this connection point"],
    ["TRANSMISSIONLOSSFACTOR", "NUMERIC(7,5)", true, "The transmission level loss factor for this connection point"],
    ["DISTRIBUTIONLOSSFACTOR", "NUMERIC(7,5)", true, "The distribution level loss factor for a distribution connection point"],
    ["NETWORKSERVICEPROVIDER", "VARCHAR(10)", true, "The Network Service Provider"],
    ["FINRESPORGAN", "VARCHAR(10)", true, "Financially responsible organisation"],
    ["NATIONALMETERINSTALLID", "NUMERIC(7,5)", true, "National Meter Id"],
    ["AUTHORISEDBY", "VARCHAR(15)", true, "User authorising record"],
    ["AUTHORISEDDATE", "TIMESTAMP(0)", true, "Date record authorised"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
    ["INUSE", "VARCHAR(1)", true, "Status flag."],
    ["LNSP", "VARCHAR(10)", true, "Local Electricity Network Service Provider"],
    ["MDA", "VARCHAR(10)", true, "Metering Data Agent for connection point."],
    ["ROLR", "VARCHAR(10)", true, "Retailer of last resort."],
    ["RP", "VARCHAR(10)", true, "Responsible party."],
    ["AGGREGATEDDATA", "VARCHAR(1)", true, "Aggregate flag."],
    ["VALID_TODATE", "TIMESTAMP(0)", true, "Date of validity."],
    ["LR", "VARCHAR(10)", true, "Local Retailer"],
]

[tables.CONNECTIONPOINTOPERATINGSTA]
comment = "CONNECTIONPOINTOPERATINGSTA shows whether a connection point is active or not."
primary_key = ["EFFECTIVEDATE", "VERSIONNO", "CONNECTIONPOINTID"]
columns = [
    ["EFFECTIVEDATE", "TIMESTAMP(0)", false, "Effective date of record"],
    ["VERSIONNO", "NUMERIC(3,0)", false, ""],
    ["CONNECTIONPOINTID", "VARCHAR(10)", false, "Connection point identifier"],
    ["OPERATINGSTATUS", "VARCHAR(16)", true, "Active or inactive indicator"],
    ["AUTHORISEDDATE", "TIMESTAMP(0)", true, "Date record authorised"],
    ["AUTHORISEDBY", "VARCHAR(15)", true, "User authorising record"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
]

[tables.CONSTRAINTRELAXATION_OCD]
comment = "CONSTRAINTRELAXATION_OCD contains details of interconnector constraints and unit ancillary service constraints relaxed in the over-constrained dispatch (OCD) re-run for this interval (if there was one).\nNote: INTERVENTION is not included in CONSTRAINTRELAXATION_OCD, since the relaxation of the same constraint is the same amount in both intervened and non-intervened cases."
primary_key = ["SETTLEMENTDATE", "RUNNO", "CONSTRAINTID", "VERSIONNO"]
columns = [
    ["SETTLEMENTDATE", "TIMESTAMP(0)", false, "End date and time of the dispatch interval"],
    ["RUNNO", "NUMERIC(3,0)", false, "Dispatch run no"],
    ["CONSTRAINTID", "VARCHAR(20)", false, "Constraint identifier"],
    ["RHS", "NUMERIC(16,6)", true, "Relaxed RHS used in attempt to avoid constraint violation"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
    ["VERSIONNO", "NUMERIC(3,0)", false, "Version Number"],
]

[tables.CONTRACTAGC]
comment = "CONTRACTAGC shows Automatic Generation Control (AGC) contract details for each dispatchable unit. There is a separate contract for each unit."
primary_key = ["CONTRACTID", "VERSIONNO"]
columns = [
    ["CONTRACTID", "VARCHAR(10)", false, "Contract Identifier"],
    ["VERSIONNO", "NUMERIC(3,0)", false, "Contract Version No"],
    ["STARTDATE", "TIMESTAMP(0)", true, "Starting Date of Contract"],
    ["ENDDATE", "TIMESTAMP(0)", true, "End date of contract"],
    ["PARTICIPANTID", "VARCHAR(10)", true, "Unique participant identifier"],
    ["DUID", "VARCHAR(10)", true, "Dispatchable Unit ID"],
    ["CRR", "NUMERIC(4,0)", true, "Control Range Raise 5 Min MW"],
    ["CRL", "NUMERIC(4,0)", true, "Control Range Lower 5 Min MW"],
    ["RLPRICE", "NUMERIC(10,2)", true, "Enabling Price in $"],
    ["CCPRICE", "NUMERIC(10,2)", true, "Compensation Cap in $"],
    ["BS", "NUMERIC(10,2)", true, "Block Size"],
    ["AUTHORISEDBY", "VARCHAR(15)", true, "User Name"],
    ["AUTHORISEDDATE", "TIMESTAMP(0)", true, "Date Contract was Authorised"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
]

