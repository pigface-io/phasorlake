    ["OPERATING_STATUS", "VARCHAR(100)", true, "Unstructured code and message from AEMO"],
    ["EST_EXPIRY", "TIMESTAMP(0)", true, "Estimated expiry time of current Instruction set"],
    ["EST_NEXT_INSTRUCTION", "TIMESTAMP(0)", true, "Estimated issue time of next Instruction set"],
]
