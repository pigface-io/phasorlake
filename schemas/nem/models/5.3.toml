columns = [
    ["SETTLEMENTDATE", "TIMESTAMP(0)", false, "Settlement date"],
    ["OFFERDATE", "TIMESTAMP(0)", false, "Date file offered"],
    ["VERSIONNO", "NUMERIC(3,0)", false, "Version no for this offer date"],
    ["PARTICIPANTID", "VARCHAR(10)", false, "Unique participant identifier"],
    ["FILENAME", "VARCHAR(40)", true, "Load file name"],
    ["AUTHORISEDDATE", "TIMESTAMP(0)", true, "Date record authorised"],
    ["AUTHORISEDBY", "VARCHAR(10)", true, "User authorising record"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
]

[tables.OFFERAGCDATA]
comment = "OFFERAGCDATA shows availability reoffers of Automatic Generation Control."
primary_key = ["CONTRACTID", "EFFECTIVEDATE", "VERSIONNO", "PERIODID"]
columns = [
