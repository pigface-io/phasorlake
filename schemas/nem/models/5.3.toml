    ["CAPACITYOBJFUNCTION", "NUMERIC(12,3)", true, "Objective Function from the Capacity Adequacy run"],
    ["CAPACITYOPTION", "NUMERIC(12,3)", true, "Not populated as of 2005 End of Year Release; was the demand forecast used for capacity adequacy assessment: 0 = no assessment, 1 = 10%, 2 = 50%, 3 = 90%"],
    ["MAXSURPLUSRESERVEOPTION", "NUMERIC(12,3)", true, "Not populated as of 2005 End of Year Release; was the demand forecast used for assessment of Maximum surplus Reserve: 0 = no assessment, 1 = 10%, 2 = 50%, 3 = 90%"],
    ["MAXSPARECAPACITYOPTION", "NUMERIC(12,3)", true, "Not populated as of 2005 End of Year Release; was the demand forecast used for assessment of Maximum Spare Capacity: 0 = no assessment, 1 = 10%, 2 = 50%, 3 = 90%"],
    ["INTERCONNECTORFLOWPENALTY", "NUMERIC(12,3)", true, "The penalty for non-zero interconnector flow"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Date and time the record was created or modified"],
    ["RUNTYPE", "VARCHAR(50)", true, "Discontinued in Dec 2005; was description of the constraints included in this run, being either System Normal and Planned Outage Constraints or System Normal Constraints Only"],
    ["RELIABILITYLRCDEMANDOPTION", "NUMERIC(12,3)", true, "Specifies the Probability of Exceedence (POE) demand forecast for Reliability LRC assessment (0 if no assessment, 10 for 10%, 50 for 50%, 90 for 90%)"],
    ["OUTAGELRCDEMANDOPTION", "NUMERIC(12,3)", true, "Specifies the Probability of Exceedence (POE) demand forecast for outage LRC assessment (0 if no assessment, 10 for 10%, 50 for 50%, 90 for 90%)"],
    ["LORDEMANDOPTION", "NUMERIC(12,3)", true, "Specifies the Probability of Exceedence (POE) demand forecast for LOR assessment (0 if no assessment, 10 for 10%, 50 for 50%, 90 for 90%)"],
    ["RELIABILITYLRCCAPACITYOPTION", "VARCHAR(10)", true, "Generation Availability to be used in Reliability LRC run (either PASA or MARKET)"],
    ["OUTAGELRCCAPACITYOPTION", "VARCHAR(10)", true, "Generation Availability to be used in Outage LRC run (either PASA or MARKET)"],
    ["LORCAPACITYOPTION", "VARCHAR(10)", true, "Generation Availability to be used in LOR run (either PASA or MARKET)"],
    ["LORUIGFOPTION", "NUMERIC(3,0)", true, "UIGF POE forecast availability used for this option"],
    ["RELIABILITYLRCUIGFOPTION", "NUMERIC(3,0)", true, "UIGF POE forecast availability used for this option"],
    ["OUTAGELRCUIGFOPTION", "NUMERIC(3,0)", true, "UIGF POE forecast availability used for this option"],
]

[tables.MTPASA_CASE_SET]
comment = "MTPASA_CASE_SET is obsolete from 2005 End of Year Release. The RUNTYPE added to the primary key of the detail tables for MTPASA allows for the different types of runs for each case.\nMTPASA_CASE_SET allows a MT PASA scenario to be linked across runs."
primary_key = ["RUN_DATETIME", "RUN_NO"]
columns = [
    ["RUN_DATETIME", "TIMESTAMP(0)", false, "Date processing of the run begins. Generated from the solution file CASEID."],
    ["RUN_NO", "NUMERIC(3,0)", false, "Unique run id. Generated from the solution file CASEID."],
    ["CASESETID", "NUMERIC(3,0)", true, "Unique id to link a set of cases run from the same inputs"],
    ["RUNTYPEID", "NUMERIC(1,0)", true, "Unique id for type of run, being either"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Date the solution was loaded"],
]

[tables.MTPASA_CONSTRAINTRESULT]
comment = "Constraint results for Binding or Violating Constraints"
primary_key = ["RUN_DATETIME", "RUN_NO", "RUNTYPE", "DEMAND_POE_TYPE", "DAY", "CONSTRAINTID"]
columns = [
    ["RUN_DATETIME", "TIMESTAMP(0)", false, "Date processing of the run begins."],
    ["RUN_NO", "NUMERIC(4)", false, "Unique run id."],
    ["RUNTYPE", "VARCHAR(20)", false, "Type of run. Always RELIABILITY"],
    ["DEMAND_POE_TYPE", "VARCHAR(20)", false, "Demand POE type used. Value is POE10"],
    ["DAY", "TIMESTAMP(0)", false, "Day this result is for"],
    ["CONSTRAINTID", "VARCHAR(20)", false, "The unique identifier for the constraint. Only binding or violating constraints are reported"],
    ["EFFECTIVEDATE", "TIMESTAMP(0)", true, "The effective date of the constraint used"],
    ["VERSIONNO", "NUMERIC(3,0)", true, "The version of the constraint used"],
    ["PERIODID", "NUMERIC(3,0)", true, "Half hourly period reported, selected as period of maximum NEM scheduled demand (calculated as maximum of scheduled demands, averaged across iterations and reference years)"],
    ["PROBABILITYOFBINDING", "NUMERIC(8,5)", true, "Proportion of a constraint binding, across iterations and reference years"],
    ["PROBABILITYOFVIOLATION", "NUMERIC(8,5)", true, "Proportion of a constraint violating, across iterations and reference years"],
    ["CONSTRAINTVIOLATION90", "NUMERIC(12,2)", true, "The 90th percentile violation degree for this constraint, across iterations and reference years (MW)"],
    ["CONSTRAINTVIOLATION50", "NUMERIC(12,2)", true, "The 50th percentile violation degree for this constraint, across iterations and reference years (MW)"],
    ["CONSTRAINTVIOLATION10", "NUMERIC(12,2)", true, "The 10th percentile violation degree for this constraint, across iterations and reference years (MW)"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
]

[tables.MTPASA_CONSTRAINTSOLUTION]
comment = "MTPASA_CONSTRAINTSOLUTION is obsolete from 2017 End of Year DM4.27 Release. \nThe MTPASA_CONSTRAINTSOLUTION table holds the binding and violated constraint results from the capacity evaluation, including the RHS value.\nChange Notice 379 announced the replacement of the MT PASA data model so all MTPASAxxx tables become obsolete, replaced by MTPASA_xxx tables."
primary_key = ["RUN_DATETIME", "RUN_NO", "RUNTYPE", "ENERGYBLOCK", "DAY", "LDCBLOCK", "CONSTRAINTID"]
