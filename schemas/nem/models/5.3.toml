    ["USE_EVENT_MAX", "NUMERIC(12,2)", true, "Maximum unserved energy event size across all half hourly intervals and iterations and reference years that have unserved energy>0 (MW)"],
    ["USE_EVENT_UPPERQUARTILE", "NUMERIC(12,2)", true, "Upper quartile unserved energy event size across all half hourly intervals and iterations and reference years that have unserved energy>0 (MW)"],
    ["USE_EVENT_MEDIAN", "NUMERIC(12,2)", true, "Median unserved energy event size across all half hourly intervals and iterations and reference years that have unserved energy>0 (MW)"],
    ["USE_EVENT_LOWERQUARTILE", "NUMERIC(12,2)", true, "Lower quartile unserved energy event size across all half hourly intervals and iterations and reference years that have unserved energy>0 (MW)"],
    ["USE_EVENT_MIN", "NUMERIC(12,2)", true, "Minimum unserved energy event size across all half hourly intervals and iterations and reference years that have unserved energy>0 (MW)"],
    ["WEIGHT", "NUMERIC(16,6)", true, "Fixed Values of 0.696 for 50 POE and 0.304 for 10 POE."],
    ["USE_WEIGHTED_AVG", "NUMERIC(16,6)", true, "Weighted average USE per region = (USE_AVERAGE_POE10/NATIVE_DEMAND_POE_10*WEIGHT_POE_10 + USE_AVERAGE_POE50/NATIVE_DEMAND_POE_50*WEIGHT_POE_50)*100"],
    ["LRC", "NUMERIC(12,2)", true, "LRC Condition reported (Value=1) if USE_WEIGHTED_AVG >= 0.002% otherwise (Value=0)"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
]

[tables.MTPASA_RESERVELIMIT]
comment = "MT PASA input table defining a MT PASA Reserve Requirement within a single set. An MT PASA Reserve Requirement can span more than one region."
primary_key = ["EFFECTIVEDATE", "VERSION_DATETIME", "RESERVELIMITID"]
columns = [
    ["EFFECTIVEDATE", "TIMESTAMP(0)", false, "Trade date when the set of reserve requirements become effective"],
    ["VERSION_DATETIME", "TIMESTAMP(0)", false, "Timestamp when the set of reserve requirements become effective"],
    ["RESERVELIMITID", "VARCHAR(20)", false, "MT PASA Reserve Requirement identifier"],
    ["DESCRIPTION", "VARCHAR(200)", true, "Description of this Reserve Requirement"],
    ["RHS", "NUMERIC(16,6)", true, "Right hand side value for this Reserve requirement"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Timestamp the record was last modified."],
]

[tables.MTPASA_RESERVELIMITSOLUTION]
comment = "MTPASA_RESERVELIMITSOLUTION is obsolete from 2017 End of Year DM4.27 Release. \nMT PASA Solution table reporting whether a MT PASA Reserve requirement is binding for each day and LDC block of the run."
primary_key = ["RUN_DATETIME", "RUN_NO", "RUNTYPE", "ENERGYBLOCK", "DAY", "LDCBLOCK", "RESERVELIMITID"]
columns = [
    ["RUN_DATETIME", "TIMESTAMP(0)", false, "Date processing of the run begins"],
    ["RUN_NO", "NUMERIC(3,0)", false, "Unique run ID. Generated from the solution file Case ID."],
    ["RUNTYPE", "VARCHAR(20)", false, "Type of run. Values are RELIABILITY_LRC and OUTAGE_LRC"],
    ["ENERGYBLOCK", "TIMESTAMP(0)", false, "Sunday at start of the week for this solutions energy block. Generated from the solution file energy block."],
    ["DAY", "TIMESTAMP(0)", false, "Day this solution is for. Generated from the solution file period id."],
    ["LDCBLOCK", "NUMERIC(3,0)", false, "Load Duration Curve block this solution is for. Generated from the solution file period id."],
    ["RESERVELIMITID", "VARCHAR(20)", false, "The unique identifier of the MT PASA LRC Reserve Requirement."],
    ["MARGINALVALUE", "NUMERIC(16,6)", true, "Marginal Value of the Reserve Requirement Constraint. A non-zero value indicates that the reserve requirement is binding."],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Timestamp the record was last modified."],
]

[tables.MTPASA_RESERVELIMIT_REGION]
comment = "MT PASA input table to define the regions that are part of a single MT PASA Reserve Requirement"
primary_key = ["EFFECTIVEDATE", "VERSION_DATETIME", "RESERVELIMITID", "REGIONID"]
columns = [
    ["EFFECTIVEDATE", "TIMESTAMP(0)", false, "Trade date when the set of reserve requirements become effective"],
    ["VERSION_DATETIME", "TIMESTAMP(0)", false, "Timestamp when the set of reserve requirements become effective"],
    ["RESERVELIMITID", "VARCHAR(20)", false, "MT PASA Reserve requirement identifier"],
    ["REGIONID", "VARCHAR(20)", false, "Region ID - identifier of a NEM region included in this requirement"],
    ["COEF", "NUMERIC(16,6)", true, "Coefficient for the region in this reserve requirement"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Timestamp the record was last modified"],
]

[tables.MTPASA_RESERVELIMIT_SET]
comment = "MT PASA input table defining a set of MT PASA Reserve Requirements. Note only one set can be active on a given date."
primary_key = ["EFFECTIVEDATE", "VERSION_DATETIME"]
columns = [
    ["EFFECTIVEDATE", "TIMESTAMP(0)", false, "Trade date when the set of reserve requirements become effective"],
    ["VERSION_DATETIME", "TIMESTAMP(0)", false, "Timestamp when the set of reserve requirements become effective"],
    ["RESERVELIMIT_SET_ID", "VARCHAR(20)", true, "MT PASA LRC Reserve Requirement Set Identifier"],
    ["DESCRIPTION", "VARCHAR(200)", true, "Description of this set of Reserve Requirements"],
    ["AUTHORISEDDATE", "TIMESTAMP(0)", true, "Date the requirement set was authorised"],
    ["AUTHORISEDBY", "VARCHAR(20)", true, "User authorising this requirement set"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Timestamp the record was last modified"],
]

[tables.NEGATIVE_RESIDUE]
comment = "Shows the inputs provided to the Negative Residue Constraints in the Dispatch horizon"
primary_key = ["SETTLEMENTDATE", "NRM_DATETIME", "DIRECTIONAL_INTERCONNECTORID"]
columns = [
    ["SETTLEMENTDATE", "TIMESTAMP(0)", false, "Dispatch Interval"],
    ["NRM_DATETIME", "TIMESTAMP(0)", false, "The time that residue information is processed"],
    ["DIRECTIONAL_INTERCONNECTORID", "VARCHAR(30)", false, "Negative residue related direction interconnector id"],
    ["NRM_ACTIVATED_FLAG", "NUMERIC(1,0)", true, "Is 1 if negative residue process is on, else is 0"],
    ["CUMUL_NEGRESIDUE_AMOUNT", "NUMERIC(15,5)", true, "Negative residue triggering amount"],
    ["CUMUL_NEGRESIDUE_PREV_TI", "NUMERIC(15,5)", true, "Previous trading interval cumulative negative residue amount"],
    ["NEGRESIDUE_CURRENT_TI", "NUMERIC(15,5)", true, "Current trading interval negative residue amount"],
    ["NEGRESIDUE_PD_NEXT_TI", "NUMERIC(15,5)", true, "The cumulative negative residue for the next trading interval (PD)"],
    ["PRICE_REVISION", "VARCHAR(30)", true, "SubjectToReview, Indeterminate, Accepted or Rejected"],
    ["PREDISPATCHSEQNO", "VARCHAR(20)", true, "Predispatch sequence number"],
    ["EVENT_ACTIVATED_DI", "TIMESTAMP(0)", true, "The starting DI when NRM event is active"],
    ["EVENT_DEACTIVATED_DI", "TIMESTAMP(0)", true, "The finishing DI when NRM event stops being active."],
    ["DI_NOTBINDING_COUNT", "NUMERIC(2,0)", true, "Count of the number of DIs not binding by this constraint"],
    ["DI_VIOLATED_COUNT", "NUMERIC(2,0)", true, "Count of the number of DIs violated by this constraint"],
    ["NRMCONSTRAINT_BLOCKED_FLAG", "NUMERIC(1,0)", true, "1 if constraint is blocked, else 0"],
]

[tables.NETWORK_EQUIPMENTDETAIL]
comment = "NETWORK_EQUIPMENTDETAIL Provides details on equipment that may have outages or ratings. A single piece of equipment may have multiple records if its details change.\nA line will typically have at least two valid records at a time, once for each end of the line."
primary_key = ["ELEMENTID", "SUBSTATIONID", "EQUIPMENTTYPE", "EQUIPMENTID", "VALIDFROM"]
columns = [
    ["SUBSTATIONID", "VARCHAR(30)", false, "ID uniquely identifying the substation this equipment is located at"],
    ["EQUIPMENTTYPE", "VARCHAR(10)", false, "The type of equipment. Valid values are:\nLINE = Line\nTRANS = Transformer\nCB = Circuit breaker\nISOL = Isolator\nCAP = Capacitor\nREAC = Reactor\nUNIT = Unit"],
    ["EQUIPMENTID", "VARCHAR(30)", false, "A unique identifier for this type of equipment at this substation"],
    ["VALIDFROM", "TIMESTAMP(0)", false, "The date that this record is applies from (inclusive)"],
    ["VALIDTO", "TIMESTAMP(0)", true, "The date that this record applies until (exclusive)"],
    ["VOLTAGE", "VARCHAR(20)", true, "The voltage in KV for this equipment.\nTransformers may have multiple voltages defined.\nE.g. 132_110_33"],
    ["DESCRIPTION", "VARCHAR(100)", true, "A short description for this equipment."],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "The time that this record was last changed."],
    ["ELEMENTID", "NUMERIC(15,0)", false, "Equipment element id"],
]

[tables.NETWORK_OUTAGECONSTRAINTSET]
comment = "NETWORK_OUTAGECONSTRAINTSET lists the Constraint Set or Sets that are expected to be invoked for the outage once it is confirmed to proceed."
primary_key = ["OUTAGEID", "GENCONSETID"]
columns = [
    ["OUTAGEID", "NUMERIC(15,0)", false, "ID uniquely identifying the outage"],
    ["GENCONSETID", "VARCHAR(50)", false, "ID for the constraint set"],
    ["STARTINTERVAL", "TIMESTAMP(0)", true, "The dispatch interval that this constraint applies from"],
    ["ENDINTERVAL", "TIMESTAMP(0)", true, "The dispatch interval that this constraint applies until."],
]

[tables.NETWORK_OUTAGEDETAIL]
comment = "Lists asset owners planned outages for transmission equipment. This also includes details for transmission equipment that will not have an outage, but associated secondary equipment has an outage and a related constraint set may be invoked. This scenario is indicated by the ISSECONDARY field in the table"
primary_key = ["OUTAGEID", "ELEMENTID", "SUBSTATIONID", "EQUIPMENTTYPE", "EQUIPMENTID", "STARTTIME"]
columns = [
    ["OUTAGEID", "NUMERIC(15,0)", false, "ID uniquely identifying the outage"],
    ["SUBSTATIONID", "VARCHAR(30)", false, "The substation this equipment is located at"],
    ["EQUIPMENTTYPE", "VARCHAR(10)", false, "The type of equipment. Valid values are:\nLINE = Line\nTRANS = Transformer\nCB = Circuit breaker\nISOL = Isolator\nCAP = Capacitor\nREAC = Reactor\nUNIT = Unit"],
    ["EQUIPMENTID", "VARCHAR(30)", false, "A unique identifier for this equipment at this substation, and based on its type"],
    ["STARTTIME", "TIMESTAMP(0)", false, "The planned starting date and time of the outage"],
    ["ENDTIME", "TIMESTAMP(0)", true, "The planned ending date and time of the outage"],
    ["SUBMITTEDDATE", "TIMESTAMP(0)", true, "The date and time this outage was first submitted"],
    ["OUTAGESTATUSCODE", "VARCHAR(10)", true, "A code representing the status of the outage.\nThe OUTAGESTATUSCODE table will store a detailed description of each code."],
    ["RESUBMITREASON", "VARCHAR(50)", true, "Changes to an outage key details may require the outage to be resubmitted.\nA new outage id will then be allocated and the outage will be reassessed.\nThis field will detail the reason for the change."],
    ["RESUBMITOUTAGEID", "NUMERIC(15,0)", true, "The new outage id created from a resubmit."],
    ["RECALLTIMEDAY", "NUMERIC(10,0)", true, "The recall time in minutes during the day"],
    ["RECALLTIMENIGHT", "NUMERIC(10,0)", true, "The recall time in minutes during the night"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "The time that this record was last changed"],
    ["REASON", "VARCHAR(100)", true, "The reason provided by the asset owner for this outage"],
    ["ISSECONDARY", "NUMERIC(1,0)", true, "1 = The outage is for a secondary piece of equipment that has an associated constraint set. The transmission equipment is still in service. 0 = The outage is for the transmission equipment"],
    ["ACTUAL_STARTTIME", "TIMESTAMP(0)", true, "The actual starting date/time of the outage"],
    ["ACTUAL_ENDTIME", "TIMESTAMP(0)", true, "The actual ending date/time of the outage"],
    ["COMPANYREFCODE", "VARCHAR(20)", true, "The asset owners reference code for this outage"],
    ["ELEMENTID", "NUMERIC(15,0)", false, "Equipment element id"],
]

[tables.NETWORK_OUTAGESTATUSCODE]
comment = "NETWORK_OUTAGESTATUSCODE describes the different outage status codes"
primary_key = ["OUTAGESTATUSCODE"]
columns = [
    ["OUTAGESTATUSCODE", "VARCHAR(10)", false, "A code representing the status of an outage"],
    ["DESCRIPTION", "VARCHAR(100)", true, "A description of the status code"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "The time that this record was last changed"],
]

[tables.NETWORK_RATING]
comment = "NETWORK_RATING defines a list of the equipment ratings that may be used as inputs to market constraints.\nIf the rating is flagged as dynamic then in real-time the rating will be dynamically determined and the static value will be used as a fallback value should the dynamic value fail.\nNote:\nIn some rare cases equipment has ratings provided from more than one TNSP. This is identified by a different SPD Id. The value used in the NEM is normally the more restrictive of the two values."
primary_key = ["SPD_ID", "VALIDFROM"]
columns = [
    ["SPD_ID", "VARCHAR(21)", false, "ID defining this data source for use in constraints"],
    ["VALIDFROM", "TIMESTAMP(0)", false, "The date that this record is applies from (inclusive)"],
    ["VALIDTO", "TIMESTAMP(0)", true, "The date that this record applies until (exclusive)"],
    ["REGIONID", "VARCHAR(10)", true, "The region that this rating is for"],
    ["SUBSTATIONID", "VARCHAR(30)", true, "The substation the equipment is located at"],
    ["EQUIPMENTTYPE", "VARCHAR(10)", true, "The type of equipment. Valid values are:\nLINE = Line\nTRANS = Transformer\nCB = Circuit breaker\nISOL = Isolator\nCAP = Capacitor\nREAC = Reactor\nUNIT = Unit"],
    ["EQUIPMENTID", "VARCHAR(30)", true, "A unique identifier for this equipment at this substation, and based on its type"],
    ["RATINGLEVEL", "VARCHAR(10)", true, "The rating level of the value used, one of:\nNORM = Continuous rating value. Applied under pre-contingent conditions.\nEMER = Continuous rating value. Applied under pre-contingent conditions\nLDSH = Load Shedding"],
    ["ISDYNAMIC", "NUMERIC(1,0)", true, "One of:\n1 = Normally uses dynamic ratings\n0 = No dynamic ratings, static ratings are used"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "The time that this record was last changed"],
]

[tables.NETWORK_REALTIMERATING]
comment = "The NETWORK_REALTIMERATING table shows the equipment rating values in MVA used as inputs to constraints in the dispatch solution. This includes values for both static and dynamic ratings. The NETWORK_RATING table can be used to determine the physical equipment the rating is for based on the SPD_ID value."
primary_key = ["SETTLEMENTDATE", "SPD_ID"]
columns = [
    ["SETTLEMENTDATE", "TIMESTAMP(0)", false, "The dispatch interval the rating applies to"],
    ["SPD_ID", "VARCHAR(21)", false, "ID defining this data source for use in constraints"],
    ["RATINGVALUE", "NUMERIC(16,6)", false, "The defined equipment rating value in MVA"],
]

[tables.NETWORK_STATICRATING]
comment = "NETWORK_STATICRATING lists the static rating values that will apply for a Rating Application ID.\nThis data does not provide information for when the rating actually applies in the NEM. This is dependent on the Rating Application definition.\nFor information on the Rating Applications please refer to the information published on the AEMO website under the topic \"Transmission Equipment Ratings\". The Rating Applications are referred to as Alternate Value Application Ratings.\nRatings that normally use dynamic values will also have static rating values defined. These are used as a fallback if the dynamic rating fails."
primary_key = ["SUBSTATIONID", "EQUIPMENTTYPE", "EQUIPMENTID", "RATINGLEVEL", "APPLICATIONID", "VALIDFROM"]
columns = [
    ["SUBSTATIONID", "VARCHAR(30)", false, "The substation the equipment is located at"],
    ["EQUIPMENTTYPE", "VARCHAR(10)", false, "The type of equipment. Valid values are:\nLINE = Line\nTRANS = Transformer\nCB = Circuit breaker\nISOL = Isolator\nCAP = Capacitor\nREAC = Reactor\nUNIT = Unit"],
    ["EQUIPMENTID", "VARCHAR(30)", false, "A unique identifier for this type of equipment at this substation"],
    ["RATINGLEVEL", "VARCHAR(10)", false, "The rating level of the value used, one of:\nNORM = Continuous rating value. Applied under pre-contingent conditions.\nEMER = Continuous rating value. Applied under pre-contingent conditions\nLDSH = Load Shedding"],
    ["APPLICATIONID", "VARCHAR(20)", false, "The applicationid which defines the application timeframes of this rating."],
    ["VALIDFROM", "TIMESTAMP(0)", false, "The date that this record is applies from (inclusive)"],
    ["VALIDTO", "TIMESTAMP(0)", true, "The date that this record applies until (exclusive)"],
    ["RATINGVALUE", "NUMERIC(16,6)", true, "The rating value in MVA that applies. This may be positive or negative depending on which side of the nominal MW flow direction the rating value applies.\nFlow into a transmission device is positive, flow out of the device is negative."],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "The time that this record was last changed."],
]

[tables.NETWORK_SUBSTATIONDETAIL]
comment = "NETWORK_SUBSTATIONDETAIL sets out the attributes of sub-stations across time"
primary_key = ["SUBSTATIONID", "VALIDFROM"]
columns = [
    ["SUBSTATIONID", "VARCHAR(30)", false, "ID uniquely identifying this substation"],
    ["VALIDFROM", "TIMESTAMP(0)", false, "The record is valid from this date (inclusive)"],
    ["VALIDTO", "TIMESTAMP(0)", true, "The record is valid up until this date (exclusive)"],
    ["DESCRIPTION", "VARCHAR(100)", true, "Description of the substation"],
    ["REGIONID", "VARCHAR(10)", true, "The NEM region the substation is in"],
    ["OWNERID", "VARCHAR(30)", true, "The TNSP who is responsible for this substation"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "The time that this record was last changed."],
]

[tables.OARTRACK]
comment = "OARTRACK shows an audit trail of bids for a particular settlement day. Corrupt bids do not update OARTRACK, but are just in OFFERFILETRK."
