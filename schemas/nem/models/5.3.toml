columns = [
    ["EFFECTIVEDATE", "TIMESTAMP(0)", false, "Effective date of this constraint"],
    ["VERSIONNO", "NUMERIC(3,0)", false, "Version with respect to the effective date"],
    ["GENCONID", "VARCHAR(20)", false, "Unique ID for the constraint"],
    ["CONSTRAINTTYPE", "VARCHAR(2)", true, "The logical operator (=, >=, <=)"],
    ["CONSTRAINTVALUE", "NUMERIC(16,6)", true, "the RHS value used if there is no dynamic RHS defined in GenericConstraintRHS"],
    ["DESCRIPTION", "VARCHAR(256)", true, "Detail of the plant that is not in service"],
    ["STATUS", "VARCHAR(8)", true, "Not used"],
    ["GENERICCONSTRAINTWEIGHT", "NUMERIC(16,6)", true, "The constraint violation penalty factor"],
    ["AUTHORISEDDATE", "TIMESTAMP(0)", true, "Date record authorised"],
    ["AUTHORISEDBY", "VARCHAR(15)", true, "User authorising record"],
    ["DYNAMICRHS", "NUMERIC(15,5)", true, "Not used"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
    ["DISPATCH", "VARCHAR(1)", true, "Flag: constraint RHS used for Dispatch? 1-used, 0-not used"],
    ["PREDISPATCH", "VARCHAR(1)", true, "Flag to indicate if the constraint RHS is to be used for PreDispatch, 1-used, 0-not used"],
    ["STPASA", "VARCHAR(1)", true, "Flag to indicate if the constraint RHS is to be used for ST PASA, 1-used, 0-not used"],
    ["MTPASA", "VARCHAR(1)", true, "Flag to indicate if the constraint RHS is to be used for MT PASA, 1-used, 0-not used"],
    ["IMPACT", "VARCHAR(64)", true, "The device(s) that is affected by the constraint e.g. Interconnector, Generator(s) or Cutset"],
    ["SOURCE", "VARCHAR(128)", true, "The source of the constraint formulation"],
    ["LIMITTYPE", "VARCHAR(64)", true, "The limit type of the constraint e.g. Transient Stability, Voltage Stability"],
    ["REASON", "VARCHAR(256)", true, "The contingency or reason for the constraint"],
    ["MODIFICATIONS", "VARCHAR(256)", true, "Details of the changes made to this version of the constraint"],
    ["ADDITIONALNOTES", "VARCHAR(256)", true, "Extra notes on the constraint"],
    ["P5MIN_SCOPE_OVERRIDE", "VARCHAR(2)", true, "Extra notes on the constraint: NULL = Dispatch RHS applied in 5MPD, PD = PreDispatch RHS applied in 5MPD"],
    ["LRC", "VARCHAR(1)", true, "Flag to indicate if PASA LRC run uses the constraint; 1-used, 0-not used"],
    ["LOR", "VARCHAR(1)", true, "Flag to indicate if PASA LOR run uses the constraint; 1-used, 0-not used"],
    ["FORCE_SCADA", "NUMERIC(1,0)", true, "Flags Constraints for which NEMDE must use \"InitialMW\" values instead of \"WhatOfInitialMW\" for Intervention Pricing runs"],
]

[tables.GENCONSET]
comment = "GENCONSET sets out generic constraint sets that are invoked and revoked, and may contain many generic constraints (GENCONDATA)."
primary_key = ["GENCONSETID", "EFFECTIVEDATE", "VERSIONNO", "GENCONID"]
columns = [
    ["GENCONSETID", "VARCHAR(20)", false, "Unique ID for the Constraint Set"],
    ["EFFECTIVEDATE", "TIMESTAMP(0)", false, "Date this record becomes effective"],
    ["VERSIONNO", "NUMERIC(3,0)", false, "Version no of the record for the given effective date"],
    ["GENCONID", "VARCHAR(20)", false, "Generic Contraint ID"],
    ["GENCONEFFDATE", "TIMESTAMP(0)", true, "Since market start in 1998 these fields have not been used and any data that has been populated in the fields should be ignored"],
    ["GENCONVERSIONNO", "NUMERIC(3,0)", true, "Since market start in 1998 these fields have not been used and any data that has been populated in the fields should be ignored"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
]

[tables.GENCONSETINVOKE]
comment = "GENCONSETINVOKE provides details of invoked and revoked generic constraints. GENCONSETINVOKE is the key table for determining what constraints are active in dispatch, predispatch and PASA.\nGENCONSETINVOKE also indicates whether constraints are for interconnector limits, ancillary services, etc."
primary_key = ["INVOCATION_ID"]
columns = [
    ["INVOCATION_ID", "NUMERIC(9)", false, "Abstract unique identifier for the record. Allows Invocations to be modified without affecting PK values"],
    ["STARTDATE", "TIMESTAMP(0)", false, "Market date of start"],
    ["STARTPERIOD", "NUMERIC(3,0)", false, "The first dispatch interval of the invocation being the dispatch interval number starting from1 at 04:05."],
    ["GENCONSETID", "VARCHAR(20)", false, "Unique generic constraint set identifier"],
    ["ENDDATE", "TIMESTAMP(0)", true, "Market date end"],
    ["ENDPERIOD", "NUMERIC(3,0)", true, "Dispatch interval number end"],
    ["STARTAUTHORISEDBY", "VARCHAR(15)", true, "User authorising invoke, indicating a constraint set invocation is applicable (i.e. non-null). A null value indicates inactive invocation."],
    ["ENDAUTHORISEDBY", "VARCHAR(15)", true, "user authorising revoke."],
    ["INTERVENTION", "VARCHAR(1)", true, "0 is not intervention, 1 is intervention and causes dispatch to solve twice."],
    ["ASCONSTRAINTTYPE", "VARCHAR(10)", true, "Constraint type (e.g. ancillary services). This also flags where a constraint is an interconnector or intra-region network limit."],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
    ["STARTINTERVALDATETIME", "TIMESTAMP(0)", true, "The settlement date and time corresponding to the first interval to which the constraint set is to be applied."],
    ["ENDINTERVALDATETIME", "TIMESTAMP(0)", true, "The settlement date and time corresponding to the last interval to which the constraint set is to be applied."],
    ["SYSTEMNORMAL", "VARCHAR(1)", true, "Flag to indicate if the constraint set is a system normal (1) or an outage set (0)"],
]

[tables.GENCONSETTRK]
comment = "GENCONSETTRK assists in determining the correct version of a generic constraint set that has been invoked in GENCONSETINVOKE."
primary_key = ["GENCONSETID", "EFFECTIVEDATE", "VERSIONNO"]
columns = [
    ["GENCONSETID", "VARCHAR(20)", false, "Unique ID for the Constraint Set"],
    ["EFFECTIVEDATE", "TIMESTAMP(0)", false, "Date this record becomes effective"],
    ["VERSIONNO", "NUMERIC(3,0)", false, "Version no of the record for the given effective date"],
    ["DESCRIPTION", "VARCHAR(256)", true, "Description of the constraint"],
    ["AUTHORISEDBY", "VARCHAR(15)", true, "The person who authorised the constraint set"],
    ["AUTHORISEDDATE", "TIMESTAMP(0)", true, "The date and time of authorising the constraint set"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
    ["COVERAGE", "VARCHAR(64)", true, "The region the constraint set is located in or a special grouping (e.g. CHIMERA)"],
    ["MODIFICATIONS", "VARCHAR(256)", true, "Details of the changes made to this version of the constraint set"],
    ["SYSTEMNORMAL", "VARCHAR(1)", true, "Not used as of 2005 End of Year Release [was Flag to indicate if the constraint set is a system normal (1) or and an outage set (0)]"],
    ["OUTAGE", "VARCHAR(256)", true, "Detail of the plant that is not in service"],
]

[tables.GENERICCONSTRAINTRHS]
comment = "GENERICCONSTRAINTRHS sets out details of generic constraint Right Hand Side (RHS) formulations for dispatch (DS), predispatch (PD) and Short Term PASA (ST). GENERICCONSTRAINTRHS also includes general expressions (EQ) used in the dispatch, predispatch and PASA time frames.\nGENERICCONSTRAINTRHS replaces data previously available via the \"Constraint Library” Excel spreadsheet."
primary_key = ["GENCONID", "EFFECTIVEDATE", "VERSIONNO", "SCOPE", "TERMID"]
columns = [
    ["GENCONID", "VARCHAR(20)", false, "Generic Constraint Identifier"],
    ["EFFECTIVEDATE", "TIMESTAMP(0)", false, "Effective date of this record"],
    ["VERSIONNO", "NUMERIC(22,0)", false, "Version no of this record for the effective date"],
    ["SCOPE", "VARCHAR(2)", false, "Scope of RHS term (DS, PD, ST or EQ)"],
    ["TERMID", "NUMERIC(4,0)", false, "The unique identifier for the a constraint RHS term"],
    ["GROUPID", "NUMERIC(3,0)", true, "ID of super-term, if this is a sub-term"],
    ["SPD_ID", "VARCHAR(21)", true, "ID defining data source"],
    ["SPD_TYPE", "VARCHAR(1)", true, "ID describing type of data source"],
    ["FACTOR", "NUMERIC(16,6)", true, "Multiplier applied to operator result"],
    ["OPERATION", "VARCHAR(10)", true, "Unitary operator to apply to data value"],
    ["DEFAULTVALUE", "NUMERIC(16,6)", true, "Default value if primary source given by SPD_ID and SPD_TYPE not available."],
    ["PARAMETERTERM1", "VARCHAR(12)", true, "The unique identifier for the first term (logic expression) to use in a Branch term"],
    ["PARAMETERTERM2", "VARCHAR(12)", true, "The unique identifier for the second term (logic<=0 result) to use in a Branch term"],
    ["PARAMETERTERM3", "VARCHAR(12)", true, "The unique identifier for the third term (logic>0 result) to use in a Branch term"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
]

[tables.GENERICEQUATIONDESC]
comment = "GENERICEQUATIONDESC defines a generic equation identifier with a description. The formulation of the generic equation is detailed in GENERICEQUATIONRHS."
primary_key = ["EQUATIONID"]
columns = [
    ["EQUATIONID", "VARCHAR(20)", false, "Generic Equation Identifier"],
    ["DESCRIPTION", "VARCHAR(256)", true, "Generic Equation Description"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
    ["IMPACT", "VARCHAR(64)", true, "The device(s) affected by the constraint (e.g. Interconnector, Generator(s) or Cutset)"],
    ["SOURCE", "VARCHAR(128)", true, "The source of the constraint formulation"],
    ["LIMITTYPE", "VARCHAR(64)", true, "The limit type of the constraint e.g. Transient Stability, Voltage Stability"],
    ["REASON", "VARCHAR(256)", true, "The contingency or reason for the constraint"],
    ["MODIFICATIONS", "VARCHAR(256)", true, "Details of the changes made to this version of the generic equation RHS"],
    ["ADDITIONALNOTES", "VARCHAR(256)", true, "Extra notes on the constraint"],
]

[tables.GENERICEQUATIONRHS]
