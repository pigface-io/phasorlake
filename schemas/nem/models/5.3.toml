    ["AVAILABILITY", "VARCHAR(3)", true, "Available load"],
    ["AUTHORISEDDATE", "TIMESTAMP(0)", true, "Authorised date"],
    ["AUTHORISEDBY", "VARCHAR(15)", true, "Authorised by"],
    ["FILENAME", "VARCHAR(40)", true, "Name of reoffer file"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
    ["PERIODID", "NUMERIC(3,0)", false, "Market day trading interval number"],
]

[tables.OFFERRPOWERDATA]
comment = "OFFERRPOWERDATA shows reoffers of reactive power capability and settlement measurements."
