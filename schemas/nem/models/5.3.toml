    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last changed data and time."],
    ["RUN_DATETIME", "TIMESTAMP(0)", true, "The run date and time"],
]

[tables.MTPASAINTERCONNECTORSOLUTION_D]
comment = "MTPASAINTERCONNECTORSOLUTION_D shows interconnector results for MT PASA, shown region by region."
primary_key = ["DATETIME", "INTERCONNECTOR_ID"]
