[tables.PREDISPATCHBIDTRK]
comment = "PREDISPATCHBIDTRK contains an audit trail of bids used in each predispatch run. Where predispatch is over 2 days, two bids are listed."
primary_key = ["PREDISPATCHSEQNO", "DUID", "PERIODID"]
columns = [
    ["PREDISPATCHSEQNO", "VARCHAR(20)", false, "Unique identifier of predispatch run in the form YYYYMMDDPP with 01 at 04:30"],
    ["DUID", "VARCHAR(10)", false, "Dispatchable Unit identifier"],
    ["PERIODID", "VARCHAR(20)", false, "PERIODID is just a period count, starting from 1 for each predispatch run. Use DATETIME to determine half hour period."],
    ["BIDTYPE", "VARCHAR(10)", true, "Bid type (daily, default or rebid)"],
    ["OFFERDATE", "TIMESTAMP(0)", true, "Offer date for bid"],
    ["VERSIONNO", "NUMERIC(3,0)", true, "Version no of offer for the offer date"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
    ["SETTLEMENTDATE", "TIMESTAMP(0)", true, "Market Settlement Date"],
    ["DATETIME", "TIMESTAMP(0)", true, "Period date and time"],
]

[tables.PREDISPATCHBLOCKEDCONSTRAINT]
comment = "PREDISPATCH Blocked Constraints lists any constraints that were blocked in a Predispatch run. If no constraints are blocked, there will be no rows for that predispatch run."
primary_key = ["PREDISPATCHSEQNO", "CONSTRAINTID"]
columns = [
    ["PREDISPATCHSEQNO", "VARCHAR(20)", false, "Unique identifier of predispatch run in the form YYYYMMDDPP with 01 at 04:30"],
    ["CONSTRAINTID", "VARCHAR(20)", false, "Generic Constraint identifier (synonymous with GenConID)"],
]

[tables.PREDISPATCHCASESOLUTION]
comment = "PREDISPATCHCASESOLUTION provides information relating to the complete predispatch run. The fields provide an overview of the dispatch run results allowing immediate identification of conditions such as energy or FCAS deficiencies."
primary_key = ["PREDISPATCHSEQNO", "RUNNO"]
columns = [
    ["PREDISPATCHSEQNO", "VARCHAR(20)", false, "Unique identifier of predispatch run in the form YYYYMMDDPP with 01 at 04:30"],
    ["RUNNO", "NUMERIC(3,0)", false, "Predispatch run no, normally 1."],
    ["SOLUTIONSTATUS", "NUMERIC(2,0)", true, "If non-zero indicated one of the following conditions: 1 = Supply Scarcity, Excess generation or constraint violations, -X = Model failure"],
    ["SPDVERSION", "VARCHAR(20)", true, "Current version of SPD"],
    ["NONPHYSICALLOSSES", "NUMERIC(1,0)", true, "Non-Physical Losses algorithm invoked during this run"],
    ["TOTALOBJECTIVE", "NUMERIC(27,10)", true, "The Objective function from the LP"],
    ["TOTALAREAGENVIOLATION", "NUMERIC(15,5)", true, "Total Region Demand violations"],
    ["TOTALINTERCONNECTORVIOLATION", "NUMERIC(15,5)", true, "Total interconnector violations"],
    ["TOTALGENERICVIOLATION", "NUMERIC(15,5)", true, "Total generic constraint violations"],
    ["TOTALRAMPRATEVIOLATION", "NUMERIC(15,5)", true, "Total ramp rate violations"],
    ["TOTALUNITMWCAPACITYVIOLATION", "NUMERIC(15,5)", true, "Total unit capacity violations"],
    ["TOTAL5MINVIOLATION", "NUMERIC(15,5)", true, "Total of 5 minute ancillary service region violations"],
    ["TOTALREGVIOLATION", "NUMERIC(15,5)", true, "Total of Regulation ancillary service region violations"],
    ["TOTAL6SECVIOLATION", "NUMERIC(15,5)", true, "Total of 6 second ancillary service region violations"],
    ["TOTAL60SECVIOLATION", "NUMERIC(15,5)", true, "Total of 60 second ancillary service region violations"],
    ["TOTALASPROFILEVIOLATION", "NUMERIC(15,5)", true, "Total of ancillary service trader profile violations"],
    ["TOTALENERGYCONSTRVIOLATION", "NUMERIC(15,5)", true, "Total of Energy Constrained unit offer violations."],
    ["TOTALENERGYOFFERVIOLATION", "NUMERIC(15,5)", true, "Total of unit summated offer band violations"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
    ["INTERVENTION", "NUMERIC(2,0)", true, "Flag to indicate if this Pre-Dispatch case includes an intervention pricing run: 0 = case does not include an intervention pricing run, 1 = case does include an intervention pricing run. This field has a default value of 0 and is not nullable"],
]

[tables.PREDISPATCHCONSTRAINT]
comment = "PREDISPATCHCONSTRAINT sets out constraints that are binding in each predispatch run and interconnector constraints (whether binding or not). Only binding and interconnector constraints are reported. Binding contracts have marginal value greater than $0. Interconnector constraints are listed so RHS values can be reported for ST PASA.\nConstraint solutions only report fixed loading /MR constraints on the next day."
primary_key = ["DATETIME", "CONSTRAINTID"]
columns = [
    ["PREDISPATCHSEQNO", "VARCHAR(20)", true, "Unique identifier of predispatch run in the form YYYYMMDDPP with 01 at 04:30"],
    ["RUNNO", "NUMERIC(3,0)", true, "SPD Predispatch run no, typically 1. It increments if the case is re-run."],
    ["CONSTRAINTID", "VARCHAR(20)", false, "Generic constraint identifier"],
    ["PERIODID", "VARCHAR(20)", true, "Unique period identifier, in the format yyyymmddpp. The period (pp) is 01 to 48, with 01 corresponding to the half-hour ending at 04:30am."],
    ["INTERVENTION", "NUMERIC(2,0)", true, "Flag to indicate if this result set was sourced from the pricing run (INTERVENTION=0) or the physical run (INTERVENTION=1). In the event that there is not intervention in the market, both pricing and physical runs correspond to INTERVENTION=0"],
    ["RHS", "NUMERIC(15,5)", true, "RHS value used."],
    ["MARGINALVALUE", "NUMERIC(15,5)", true, "Marginal value of violated constraint"],
    ["VIOLATIONDEGREE", "NUMERIC(15,5)", true, "Degree of constraint violation"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
    ["DATETIME", "TIMESTAMP(0)", false, "Period date and time"],
    ["DUID", "VARCHAR(20)", true, "DUID to which the Constraint is confidential. Null denotes non-confidential"],
    ["GENCONID_EFFECTIVEDATE", "TIMESTAMP(0)", true, "Effective date of the Generic Constraint (ConstraintID). This field is used to track the version of this generic constraint applied in this dispatch interval"],
    ["GENCONID_VERSIONNO", "NUMERIC(22,0)", true, "Version number of the Generic Constraint (ConstraintID). This field is used to track the version of this generic constraint applied in this dispatch interval"],
    ["LHS", "NUMERIC(15,5)", true, "Aggregation of the constraints LHS term solution values"],
]

[tables.PREDISPATCHINTERCONNECTORRES]
comment = "PREDISPATCHINTERCONNECTORRES records Interconnector flows and losses for the periods calculated in each predispatch run. Only binding and interconnector constraints are reported.\nSome fields are for the Frequency Controlled Ancillary Services export and import limits and extra reporting of the generic constraint setting the energy import and export limits."
primary_key = ["DATETIME", "INTERCONNECTORID"]
columns = [
    ["PREDISPATCHSEQNO", "VARCHAR(20)", true, "Unique identifier of predispatch run in the form YYYYMMDDPP with 01 at 04:30"],
    ["RUNNO", "NUMERIC(3,0)", true, "SPD Predispatch run no, typically 1. It increments if the case is re-run."],
    ["INTERCONNECTORID", "VARCHAR(10)", false, "Interconnector identifier"],
    ["PERIODID", "VARCHAR(20)", true, "PERIODID is just a period count, starting from 1 for each predispatch run. Use DATETIME to determine half hour period."],
    ["INTERVENTION", "NUMERIC(2,0)", true, "Flag to indicate if this result set was sourced from the pricing run (INTERVENTION=0) or the physical run (INTERVENTION=1). In the event that there is not intervention in the market, both pricing and physical runs correspond to INTERVENTION=0"],
    ["METEREDMWFLOW", "NUMERIC(15,5)", true, "Metered MW Flow from EMS. For periods subsequent to the first period of a Pre-Dispatch run, this value represents the cleared target for the previous period of that Pre-Dispatch run."],
    ["MWFLOW", "NUMERIC(15,5)", true, "Calculated MW Flow"],
    ["MWLOSSES", "NUMERIC(15,5)", true, "Calculated MW Losses"],
    ["MARGINALVALUE", "NUMERIC(15,5)", true, "$ Marginal value of interconnector constraint from SPD"],
    ["VIOLATIONDEGREE", "NUMERIC(15,5)", true, "Degree of violation of interconnector constraint in MW"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last changed."],
    ["DATETIME", "TIMESTAMP(0)", false, "Period date and time"],
    ["EXPORTLIMIT", "NUMERIC(15,5)", true, "Calculated export limit."],
    ["IMPORTLIMIT", "NUMERIC(15,5)", true, "Calculated import limit."],
    ["MARGINALLOSS", "NUMERIC(15,5)", true, "Marginal loss factor. Use this to adjust bids between reports."],
    ["EXPORTGENCONID", "VARCHAR(20)", true, "Generic Constraint setting the export limit"],
    ["IMPORTGENCONID", "VARCHAR(20)", true, "Generic Constraint setting the import limit"],
    ["FCASEXPORTLIMIT", "NUMERIC(15,5)", true, "Calculated export limit applying to energy + FCAS."],
    ["FCASIMPORTLIMIT", "NUMERIC(15,5)", true, "Calculated import limit applying to energy + FCAS."],
    ["LOCAL_PRICE_ADJUSTMENT_EXPORT", "NUMERIC(10,2)", true, "Aggregate Constraint contribution cost of this Interconnector: Sum(MarginalValue x Factor) for all relevant Constraints, for Export (Factor >= 0)"],
    ["LOCALLY_CONSTRAINED_EXPORT", "NUMERIC(1,0)", true, "Key for Local_Price_Adjustment_Export: 2 = at least one Outage Constraint; 1 = at least 1 System Normal Constraint (and no Outage Constraint); 0 = No System Normal or Outage Constraints"],
    ["LOCAL_PRICE_ADJUSTMENT_IMPORT", "NUMERIC(10,2)", true, "Aggregate Constraint contribution cost of this Interconnector: Sum(MarginalValue x Factor) for all relevant Constraints, for Import (Factor >= 0)"],
    ["LOCALLY_CONSTRAINED_IMPORT", "NUMERIC(1,0)", true, "Key for Local_Price_Adjustment_Import: 2 = at least one Outage Constraint; 1 = at least 1 System Normal Constraint (and no Outage Constraint); 0 = No System Normal or Outage Constraints"],
]

