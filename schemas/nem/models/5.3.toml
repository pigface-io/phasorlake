    ["INSTRUCTION_SEQUENCE", "NUMERIC(4,0)", true, "Order for execution of Instruction"],
    ["ADDITIONAL_NOTES", "VARCHAR(60)", true, "Additional information pertaining to a particular instruction, e.g. Previously issued instruction revoked"],
]

[tables.VOLTAGE_INSTRUCTION_TRK]
comment = "Parent record for Voltage Instructions (MVAr Dispatch). 'SIGNAL' records will have no children; 'INSTRUCTION' records will have children"
primary_key = ["RUN_DATETIME", "VERSION_DATETIME"]
columns = [
    ["RUN_DATETIME", "TIMESTAMP(0)", false, "MVAr Interval - a timestamp of when instructions issued"],
