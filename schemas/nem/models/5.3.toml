    ["POSITIVE_BINDING", "VARCHAR(10)", true, "Indication of a binding limit in the out direction"],
    ["NEGATIVE_INTERCONNECTOR_FLOW", "NUMERIC(16,6)", true, "The MW flow in"],
    ["NEGATIVE_TRANSFER_LIMITS", "NUMERIC(16,6)", true, "the MW transfer limits in"],
    ["NEGATIVE_BINDING", "VARCHAR(10)", true, "Indication of a binding limit in the in direction"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last change date and time"],
    ["RUN_DATETIME", "TIMESTAMP(0)", true, "The run date and time"],
]

[tables.MTPASAREGIONSOLUTION_D]
