    ["SS_WIND_CAPACITY", "NUMERIC(12,2)", true, "Constrained generation forecast for wind for the region. For RELIABILITY_LRC run wind generation is constrained only by System Normal constraints. For OUTAGE_LRC run and LOR run wind generation is constrained by both System Normal and Outage constraints. All three run types (RELIABILITY_LRC, OUTAGE_LRC, LOR) incorporate MAXAVAIL limits."],
    ["SS_SOLAR_CLEARED", "NUMERIC(12,2)", true, "Constrained generation forecast for solar for the region. For RELIABILITY_LRC run solar generation is constrained only by System Normal constraints. For OUTAGE_LRC run and LOR run solar generation is constrained by both System Normal and Outage constraints. All three run types (RELIABILITY_LRC, OUTAGE_LRC, LOR) incorporate MAXAVAIL limits."],
    ["SS_WIND_CLEARED", "NUMERIC(12,2)", true, "Constrained generation forecast for wind for the region. For RELIABILITY_LRC run wind generation is constrained only by System Normal constraints. For OUTAGE_LRC run and LOR run wind generation is constrained by both System Normal and Outage constraints. All three run types (RELIABILITY_LRC, OUTAGE_LRC, LOR) incorporate MAXAVAIL limits."],
    ["WDR_AVAILABLE", "NUMERIC(12,2)", true, "Regional aggregated Wholesale Demand Response (WDR) availability in MW."],
    ["WDR_PASAAVAILABLE", "NUMERIC(12,2)", true, "Regional aggregated Wholesale Demand Response (WDR) PASA availability in MW."],
    ["WDR_CAPACITY", "NUMERIC(12,2)", true, "Regional aggregated Wholesale Demand Response (WDR) capacity in MW."],
]

