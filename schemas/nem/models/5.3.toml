    ["REGIONID", "VARCHAR(10)", true, "Region Identifier"],
    ["ID", "NUMERIC(22,0)", false, "Instruction ID (sequential number)"],
    ["INSTRUCTIONTYPEID", "VARCHAR(10)", true, "Instruction type"],
    ["INSTRUCTIONSUBTYPEID", "VARCHAR(10)", true, "Instruction sub type"],
    ["INSTRUCTIONCLASSID", "VARCHAR(10)", true, "Instruction class"],
    ["REASON", "VARCHAR(64)", true, "Reason"],
    ["INSTLEVEL", "NUMERIC(6,0)", true, "Instruction target level"],
    ["AUTHORISEDDATE", "TIMESTAMP(0)", true, "Authorised date"],
    ["AUTHORISEDBY", "VARCHAR(15)", true, "User authorised by"],
    ["PARTICIPANTID", "VARCHAR(10)", true, "Unique participant identifier"],
    ["ISSUEDTIME", "TIMESTAMP(0)", true, "Date / time issued"],
    ["TARGETTIME", "TIMESTAMP(0)", true, "Date / time instruction to apply"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
]

[tables.GENCONDATA]
