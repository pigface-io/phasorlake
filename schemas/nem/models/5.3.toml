    ["PASAAVAILABILITY", "NUMERIC(12,0)", true, "Allows for future use for energy bids, being the physical plant capability including any capability potentially available within 24 hours"],
    ["MR_CAPACITY", "NUMERIC(6,0)", true, "Mandatory Restriction Offer amount"],
]

[tables.MR_DAYOFFER_STACK]
comment = "MR_DAYOFFER_STACK defines the Stack order for each version of the Acceptance Schedule, including all units submitting MR offers for that event. MR_DAYOFFER_STACK is the child to MR_EVENT_SCHEDULE, and parent to MR_PEROFFER_STACK."
primary_key = ["MR_DATE", "REGIONID", "VERSION_DATETIME", "STACK_POSITION"]
columns = [
    ["MR_DATE", "TIMESTAMP(0)", false, "Mandatory Restriction imposition date"],
    ["REGIONID", "VARCHAR(10)", false, "Unique RegionID"],
    ["VERSION_DATETIME", "TIMESTAMP(0)", false, "Allows many Stack versions"],
    ["STACK_POSITION", "NUMERIC(3,0)", false, "Loss Adjusted Offer Factor Stack order starting at 1"],
    ["DUID", "VARCHAR(10)", true, "Dispatchable Unit ID or LinkID"],
    ["AUTHORISED", "NUMERIC(1,0)", true, "Confirms the unit is allowed to Contribute MR Capacity"],
    ["OFFER_SETTLEMENTDATE", "TIMESTAMP(0)", true, "Foreign key reference to XXXX_DayOffer.SettlementDate"],
    ["OFFER_OFFERDATE", "TIMESTAMP(0)", true, "Foreign key reference to XXXX_DayOffer.OfferDate"],
    ["OFFER_VERSIONNO", "NUMERIC(3,0)", true, "Foreign key reference to XXXX_DayOffer.VersionNo"],
    ["OFFER_TYPE", "VARCHAR(20)", true, "Source tables - ENERGY or MNSP"],
    ["LAOF", "NUMERIC(16,6)", true, "Loss Adjusted Offer Factor = TLF times MR_Factor"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Date and time the record was last inserted/modified"],
]

[tables.MR_EVENT]
comment = "MR_EVENT defines an MR Event for a given region on a specific trading date."
primary_key = ["MR_DATE", "REGIONID"]
columns = [
    ["MR_DATE", "TIMESTAMP(0)", false, "Mandatory Restriction imposition date"],
    ["REGIONID", "VARCHAR(10)", false, "Unique RegionID"],
    ["DESCRIPTION", "VARCHAR(200)", true, "Description of MR"],
    ["AUTHORISEDDATE", "TIMESTAMP(0)", true, "Required for MR_Event to take effect"],
    ["AUTHORISEDBY", "VARCHAR(20)", true, "Ignored - Tracking purpose only"],
    ["OFFER_CUT_OFF_TIME", "TIMESTAMP(0)", true, "Cut off after when new Offers and Scaling Factor changes are disallowed"],
    ["SETTLEMENT_COMPLETE", "NUMERIC(1,0)", true, "Flag:1 = MR settlement figures locked. Do not recalculate, ·\t0 = MR settlements to be recalculated"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Date/Time record inserted/modified"],
]

[tables.MR_EVENT_SCHEDULE]
comment = "MR_EVENT_SCHEDULE defines the Stack version of the Acceptance Schedule and is the parent table to MR_DayOffer_Stack and MR_PerOffer_Stack."
primary_key = ["MR_DATE", "REGIONID", "VERSION_DATETIME"]
columns = [
    ["MR_DATE", "TIMESTAMP(0)", false, "Mandatory Restriction imposition date"],
    ["REGIONID", "VARCHAR(10)", false, "Unique RegionID"],
    ["VERSION_DATETIME", "TIMESTAMP(0)", false, "Effective Date/Time of Schedule; Allows many Stack versions"],
    ["DEMAND_EFFECTIVEDATE", "TIMESTAMP(0)", true, "Foreign key reference to ResDemandTrk.EffectiveDate"],
    ["DEMAND_OFFERDATE", "TIMESTAMP(0)", true, "Foreign key reference to ResDemandTrk.OfferDate"],
    ["DEMAND_VERSIONNO", "NUMERIC(3,0)", true, "Foreign key reference to ResDemandTrk.VersionNo"],
    ["AUTHORISEDBY", "VARCHAR(20)", true, "Authorised person confirming Offer Stack (AKA Acceptance)"],
    ["AUTHORISEDDATE", "TIMESTAMP(0)", true, "Date and time the Offer Stack confirmed"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Date and time the record was inserted/modified"],
]

[tables.MR_PEROFFER_STACK]
comment = "MR_PEROFFER_STACK defines the accepted capacity on a period basis for the Acceptance Schedule, is a child table to MR_DayOffer_Stack and only includes records or units with accepted_capacity > 0 for the specific period."
primary_key = ["MR_DATE", "REGIONID", "VERSION_DATETIME", "STACK_POSITION", "PERIODID"]
columns = [
    ["MR_DATE", "TIMESTAMP(0)", false, "Mandatory Restriction imposition date"],
    ["REGIONID", "VARCHAR(10)", false, "Unique RegionID"],
    ["VERSION_DATETIME", "TIMESTAMP(0)", false, "Allows many Period Stack versions for the one Scaling Factor stack"],
    ["STACK_POSITION", "NUMERIC(3,0)", false, "LAOF Stack order"],
    ["PERIODID", "NUMERIC(3,0)", false, "Trade Period for the MR Offer"],
    ["DUID", "VARCHAR(10)", true, "Dispatchable Unit ID or LinkID. Only required here for CSV reports"],
    ["ACCEPTED_CAPACITY", "NUMERIC(6,0)", true, "MR Capacity to be Dispatched"],
    ["DEDUCTED_CAPACITY", "NUMERIC(6,0)", true, "Requested capacity reduction amount"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Date and time the record was last  inserted/modified"],
]

[tables.MTPASACONSTRAINTSOLUTION_D]
