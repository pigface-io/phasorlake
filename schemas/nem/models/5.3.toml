    ["UNAVAILABLE", "NUMERIC(1,0)", true, "Indicates whether the NMI is unavailable for use. (TRUE = 1/FALSE = 0)"],
    ["APPROVEDDATE", "TIMESTAMP(0)", true, "Date which this record was approved"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Date time which record was last changed"],
]

[tables.PMS_GROUPSERVICE]
comment = "Describe the services a group provides and its relation to a market"
primary_key = ["GROUPSERVICEID"]
