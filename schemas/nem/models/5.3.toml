    ["MAXAVAIL", "NUMERIC(6,0)", true, "Maximum planned availability MW"],
    ["BANDAVAIL1", "NUMERIC(6,0)", true, "Band Availability for current Period"],
    ["BANDAVAIL2", "NUMERIC(6,0)", true, "Band Availability for current Period"],
    ["BANDAVAIL3", "NUMERIC(6,0)", true, "Band Availability for current Period"],
    ["BANDAVAIL4", "NUMERIC(6,0)", true, "Band Availability for current Period"],
    ["BANDAVAIL5", "NUMERIC(6,0)", true, "Band Availability for current Period"],
    ["BANDAVAIL6", "NUMERIC(6,0)", true, "Band Availability for current Period"],
    ["BANDAVAIL7", "NUMERIC(6,0)", true, "Band Availability for current Period"],
    ["BANDAVAIL8", "NUMERIC(6,0)", true, "Band Availability for current Period"],
    ["BANDAVAIL9", "NUMERIC(6,0)", true, "Band Availability for current Period"],
