    ["VERSIONNO", "NUMERIC(3,0)", false, "Version no of record"],
    ["AVAILABILITY", "NUMERIC(4,0)", true, "Availability flag (0 or 1)"],
    ["UPPERLIMIT", "NUMERIC(4,0)", true, "Upper control limit. This is used by SPD."],
    ["LOWERLIMIT", "NUMERIC(4,0)", true, "Lower control limit MW. This is used by SPD."],
    ["AUTHORISEDDATE", "TIMESTAMP(0)", true, "Authorised date"],
    ["AUTHORISEDBY", "VARCHAR(15)", true, "Authorised by"],
    ["FILENAME", "VARCHAR(40)", true, "Name of reoffer file"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
    ["PERIODID", "NUMERIC(3,0)", false, "Market day trading interval number"],
    ["AGCUP", "NUMERIC(3,0)", true, "AGC Ramp Rate Up. This is used by SPD."],
    ["AGCDOWN", "NUMERIC(3,0)", true, "AGC Ramp Rate Down. This is used by SPD."],
]

[tables.OFFERASTRK]
comment = "OFFERASTRK tracks successfully acknowledged ancillary service reoffers."
primary_key = ["EFFECTIVEDATE", "VERSIONNO", "PARTICIPANTID"]
