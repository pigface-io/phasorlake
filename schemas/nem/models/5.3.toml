[tables.PMS_GROUPNMI]
comment = "Describe the NMIs that a group uses to provide its service"
primary_key = ["GROUPNMIID"]
columns = [
    ["GROUPNMIID", "NUMERIC(20,0)", false, "Record Identifier of the NMI within a Group. When data is updated, existing record identifier is terminated, and new record identifier(s) are allocated."],
