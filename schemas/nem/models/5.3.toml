[tables.DISPATCHTRK]
comment = "DISPATCHTRK is no longer used. DISPATCHTRK was  the cross-reference between each dispatch run and SPD case run. DISPATCHTRK may be available on the InfoServer but not replicated to participant databases as it contains data duplicated in other tables."
primary_key = ["SETTLEMENTDATE", "RUNNO"]
columns = [
    ["SETTLEMENTDATE", "TIMESTAMP(0)", false, "Market date and time starting at 04:05"],
    ["RUNNO", "NUMERIC(3,0)", false, "Dispatch run no, normally 1."],
    ["REASON", "VARCHAR(64)", true, "Reason code (if rerun)"],
    ["SPDRUNNO", "NUMERIC(3,0)", true, "Case identifier for LP Solver"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
]

[tables.DISPATCH_CONSTRAINT_FCAS_OCD]
comment = "FCAS constraint solution from OCD re-run."
primary_key = ["SETTLEMENTDATE", "RUNNO", "INTERVENTION", "CONSTRAINTID", "VERSIONNO"]
columns = [
    ["SETTLEMENTDATE", "TIMESTAMP(0)", false, "Dispatch interval that the prices were loaded to"],
    ["RUNNO", "NUMERIC(3)", false, "Dispatch run no; always 1"],
    ["INTERVENTION", "NUMERIC(2)", false, "Intervention 0/1"],
    ["CONSTRAINTID", "VARCHAR(20)", false, "ConstraintID/GenconID"],
    ["VERSIONNO", "NUMERIC(3)", false, "VersionNo"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "The datetime that the record was last changed"],
    ["RHS", "NUMERIC(15,5)", true, "RHS from OCD re-run"],
    ["MARGINALVALUE", "NUMERIC(15,5)", true, "marginalvalue from OCD re-run"],
    ["VIOLATIONDEGREE", "NUMERIC(15,5)", true, "The violation degree of this constraint in the solution result"],
]

[tables.DISPATCH_FCAS_REQ]
comment = "DISPATCH_FCAS_REQ shows Dispatch Constraint tracking for Regional FCAS recovery."
primary_key = ["SETTLEMENTDATE", "RUNNO", "INTERVENTION", "GENCONID", "REGIONID", "BIDTYPE"]
columns = [
    ["SETTLEMENTDATE", "TIMESTAMP(0)", false, "Settlement date and time of Dispatch Interval"],
    ["RUNNO", "NUMERIC(3,0)", false, "Dispatch run no; always 1"],
    ["INTERVENTION", "NUMERIC(2,0)", false, "Intervention Flag"],
    ["GENCONID", "VARCHAR(20)", false, "Generic Constraint ID - Join to table GenConData"],
    ["REGIONID", "VARCHAR(10)", false, ""],
    ["BIDTYPE", "VARCHAR(10)", false, "DUID offered type"],
    ["GENCONEFFECTIVEDATE", "TIMESTAMP(0)", true, "Generic Constraint EffectiveDate - Join to table GenConData"],
    ["GENCONVERSIONNO", "NUMERIC(3,0)", true, "Generic Constraint Version number - Join to table GenConData"],
    ["MARGINALVALUE", "NUMERIC(16,6)", true, ""],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Date record is changed"],
    ["BASE_COST", "NUMERIC(18,8)", true, "The base cost of the constraint for this service, before the regulation/contingency split"],
    ["ADJUSTED_COST", "NUMERIC(18,8)", true, "The adjusted cost of the constraint for this service, before the regulation/contingency split"],
    ["ESTIMATED_CMPF", "NUMERIC(18,8)", true, "An estimated value for the constraint CMPF, based on dispatched data"],
    ["ESTIMATED_CRMPF", "NUMERIC(18,8)", true, "An estimated value for the constraint CRMPF, based on dispatched data"],
    ["RECOVERY_FACTOR_CMPF", "NUMERIC(18,8)", true, "Estimated recovery factor for CMPF based recovery"],
    ["RECOVERY_FACTOR_CRMPF", "NUMERIC(18,8)", true, "Estimated recovery factor for CRMPF based recovery"],
]

[tables.DISPATCH_INTERCONNECTION]
comment = "Inter-regional flow information common to or aggregated for regulated (i.e. not MNSP) Interconnectors spanning the From-Region and To-Region - NB only the physical run is calculated'"
primary_key = ["SETTLEMENTDATE", "RUNNO", "FROM_REGIONID", "TO_REGIONID", "INTERVENTION"]
columns = [
    ["SETTLEMENTDATE", "TIMESTAMP(0)", false, "Market date starting at 04:05"],
    ["RUNNO", "NUMERIC(3,0)", false, "Dispatch run no; always 1"],
    ["INTERVENTION", "NUMERIC(2,0)", false, "Intervention case or not"],
    ["FROM_REGIONID", "VARCHAR(20)", false, "Nominated RegionID from which the energy flows"],
    ["TO_REGIONID", "VARCHAR(20)", false, "Nominated RegionID to which the energy flows"],
    ["DISPATCHINTERVAL", "NUMERIC(22,0)", true, "Dispatch period identifier, from 001 to 288 in format YYYYMMDDPPP"],
    ["IRLF", "NUMERIC(15,5)", true, "Inter-Regional Loss Factor. Calculated based on the MWFLOW and the nominal From and To Region losses."],
    ["MWFLOW", "NUMERIC(16,6)", true, "Summed MW flow of the parallel regulated Interconnectors"],
    ["METEREDMWFLOW", "NUMERIC(16,6)", true, "Summed Metered MW flow of the parallel regulated Interconnectors"],
    ["FROM_REGION_MW_LOSSES", "NUMERIC(16,6)", true, "Losses across the Interconnection attributable to the nominal From Region"],
    ["TO_REGION_MW_LOSSES", "NUMERIC(16,6)", true, "Losses across the Interconnection attributable to the nominal To Region"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "The datetime that the record was last changed"],
]

[tables.DISPATCH_LOCAL_PRICE]
comment = "Sets out local pricing offsets associated with each DUID connection point for each dispatch period. Note that from 2014 Mid year release only records with non-zero Local_Price_Adjustment values are issued"
primary_key = ["SETTLEMENTDATE", "DUID"]
columns = [
    ["SETTLEMENTDATE", "TIMESTAMP(0)", false, "Market date time starting at 04:05"],
    ["DUID", "VARCHAR(20)", false, "Dispatchable unit identifier"],
    ["LOCAL_PRICE_ADJUSTMENT", "NUMERIC(10,2)", true, "Aggregate Constraint contribution cost of this unit: Sum(MarginalValue x Factor) for all relevant Constraints"],
    ["LOCALLY_CONSTRAINED", "NUMERIC(1,0)", true, "Key for Local_Price_Adjustment: 2 = at least one Outage Constraint; 1 = at least 1 System Normal Constraint (and no Outage Constraint); 0 = No System Normal or Outage Constraints"],
]

[tables.DISPATCH_MNSPBIDTRK]
comment = "DISPATCH_MNSPBIDTRK shows the MNSP bid tracking, including the bid version used in each dispatch run for each MNSP Interconnector Link. The table identifies which bids from MNSP_DAYOFFER and MNSP_BIDOFFERPERIOD were applied."
primary_key = ["SETTLEMENTDATE", "RUNNO", "PARTICIPANTID", "LINKID"]
columns = [
    ["SETTLEMENTDATE", "TIMESTAMP(0)", false, "Market date starting at 04:05"],
    ["RUNNO", "NUMERIC(3,0)", false, "Dispatch run no; always 1"],
    ["PARTICIPANTID", "VARCHAR(10)", false, "Participant that owns unit during effective record period"],
    ["LINKID", "VARCHAR(10)", false, "Identifier for each of the two MNSP Interconnector Links. Each link pertains to the direction from and to."],
    ["OFFERSETTLEMENTDATE", "TIMESTAMP(0)", true, "Offer date for bid"],
    ["OFFEREFFECTIVEDATE", "TIMESTAMP(0)", true, "Time this bid was processed and loaded"],
    ["OFFERVERSIONNO", "NUMERIC(3,0)", true, "VersionNo of the bid/offer used"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Record creation timestamp"],
]

[tables.DISPATCH_MR_SCHEDULE_TRK]
comment = "DISPATCH_MR_SCHEDULE_TRK records the Mandatory Restrictions Acceptance Schedule applied to this dispatch interval for this region.\nDISPATCH_MR_SCHEDULE_TRK is populated by the Dispatch process and records the MR Offer Stack applied in each dispatch interval. DISPATCH_MR_SCHEDULE_TRK is used by Settlements to calculate payments according to the correct MR offer stack."
primary_key = ["SETTLEMENTDATE", "REGIONID"]
columns = [
    ["SETTLEMENTDATE", "TIMESTAMP(0)", false, "Date Time of the Dispatch Interval"],
    ["REGIONID", "VARCHAR(10)", false, "Unique RegionID; Key reference to MR_Event_Schedule"],
    ["MR_DATE", "TIMESTAMP(0)", true, "Mandatory Restriction date; Key reference to MR_Event_Schedule table"],
    ["VERSION_DATETIME", "TIMESTAMP(0)", true, "Date Time the MR  acceptance stack was created; Key reference to MR_Event_Schedule table"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Date and  time the record was last inserted/modified"],
]

[tables.DISPATCH_PRICE_REVISION]
comment = "An audit trail of price changes on the DISPATCHPRICE table (i.e. for 5 minute dispatch prices for energy and FCAS)."
primary_key = ["SETTLEMENTDATE", "RUNNO", "INTERVENTION", "REGIONID", "BIDTYPE", "VERSIONNO"]
columns = [
    ["SETTLEMENTDATE", "TIMESTAMP(0)", false, "Market date and time starting at 04:05"],
    ["RUNNO", "NUMERIC(3,0)", false, "Dispatch run no; always 1"],
    ["INTERVENTION", "NUMERIC(2,0)", false, "Manual intervention flag; always 0"],
    ["REGIONID", "VARCHAR(10)", false, "Affected Region Identifier"],
    ["BIDTYPE", "VARCHAR(10)", false, "Affected Bid Type Identifier"],
    ["VERSIONNO", "NUMERIC(3)", false, "Version No of price revision for this settlement date"],
    ["RRP_NEW", "NUMERIC(15,5)", true, "New RRP in DISPATCHPRICE table"],
    ["RRP_OLD", "NUMERIC(15,5)", true, "Old RRP from DISPATCHPRICE table"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "The datetime the record was last changed"],
]

[tables.DISPATCH_UNIT_CONFORMANCE]
comment = "DISPATCH_UNIT_CONFORMANCE details the conformance of a scheduled units operation with respect to a cleared target on dispatch interval basis.\nData is confidential"
primary_key = ["INTERVAL_DATETIME", "DUID"]
columns = [
    ["INTERVAL_DATETIME", "TIMESTAMP(0)", false, "Dispatch Interval that the conformance data applies to"],
    ["DUID", "VARCHAR(20)", false, "Dispatchable Unit Identifier, or Aggregate Dispatch Group identifier"],
    ["TOTALCLEARED", "NUMERIC(16,6)", true, "Dispatch Target - MW"],
    ["ACTUALMW", "NUMERIC(16,6)", true, "Unit output measured at the conclusion of the dispatch interval - MW (MWB)"],
    ["ROC", "NUMERIC(16,6)", true, "Rate of change in direction of error MW per minute"],
    ["AVAILABILITY", "NUMERIC(16,6)", true, "Offered unit capacity - MW (MWO)"],
    ["LOWERREG", "NUMERIC(16,6)", true, "Lower Regulation FCAS enabled - MW (FCL)"],
    ["RAISEREG", "NUMERIC(16,6)", true, "Raise Regulation FCAS enabled - MW (FCR)"],
    ["STRIGLM", "NUMERIC(16,6)", true, "Calculated small trigger error limit in MW"],
    ["LTRIGLM", "NUMERIC(16,6)", true, "Calculated large trigger error limit in MW"],
    ["MWERROR", "NUMERIC(16,6)", true, "Calculated actual error"],
    ["MAX_MWERROR", "NUMERIC(16,6)", true, "Max of mwerror while that unit was not in a normal state"],
    ["LECOUNT", "NUMERIC(6)", true, "Large trigger error count. Reset when mwerror changes sign"],
    ["SECOUNT", "NUMERIC(6)", true, "Small trigger error count.  Reset when mwerror changes sign"],
    ["STATUS", "VARCHAR(20)", true, "Unit conformance status.\nNORMAL\nOFF-TARGET\nNOT-RESPONDING\nNC-PENDING\nNON-CONFORMING\nSUSPENDED"],
    ["PARTICIPANT_STATUS_ACTION", "VARCHAR(100)", true, "Participant action required in response to current STATUS"],
    ["OPERATING_MODE", "VARCHAR(20)", true, "conformance operating mode\nMANUAL\nAUTO"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
    ["ADG_ID", "VARCHAR(20)", true, "Aggregate Dispatch Group to which this dispatch unit belongs"],
    ["SEMIDISPATCHCAP", "NUMERIC(3,0)", true, "Boolean representation flagging if the Target is capped"],
    ["CONFORMANCE_MODE", "NUMERIC(6,0)", true, "For an individual unit in an aggregate dispatch group (where DUID <> ADG_ID), Mode specific to that unit. 0 - no monitoring, 1 - aggregate monitoring, 2 - individual monitoring due to constraint. For the aggregate dispatch group (where DUID = ADG_ID), 0 - no aggregate monitoring, 1 - aggregate monitoring"],
]

[tables.DISPATCH_UNIT_SCADA]
comment = "Dispatchable unit MW from SCADA at the start of the dispatch interval. The table includes all scheduled and semi-scheduled (and non-scheduled units where SCADA is available)"
