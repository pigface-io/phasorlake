[tables.TRADINGPRICE]
comment = "TRADINGPRICE sets out 5 minutes spot market price, including fields to handle the Ancillary Services functionality. If prices are adjusted, the final price is recorded in the regional reference price (RRP) field with price before adjustment recorded in the regional original price (ROP) field.\nPrior to 5 Minute Settlements, this was half-hourly spot market values, which was calculated as the average of the six 5 minute dispatch intervals within the 30 minute period."
primary_key = ["SETTLEMENTDATE", "RUNNO", "REGIONID", "PERIODID"]
columns = [
    ["SETTLEMENTDATE", "TIMESTAMP(0)", false, "Date that this data applies to"],
    ["RUNNO", "NUMERIC(3,0)", false, "Run No"],
    ["REGIONID", "VARCHAR(10)", false, "Region Identifier"],
    ["PERIODID", "NUMERIC(3,0)", false, "Period number where 1 represents the trading interval ending at 00:05 AEST"],
