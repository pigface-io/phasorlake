    ["INTERVENTION", "NUMERIC(2,0)", false, "Manual Intervention flag, which, if set (1), causes predispatch to solve twice."],
    ["RHS", "NUMERIC(15,5)", true, "Right hand Side value as used in dispatch."],
    ["MARGINALVALUE", "NUMERIC(15,5)", true, "$ Value of binding constraint"],
