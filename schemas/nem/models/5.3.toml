    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
    ["ROP", "NUMERIC(15,5)", true, "Regional Original Price. The price before any adjustments were made"],
    ["RAISE6SECRRP", "NUMERIC(15,5)", true, "Regional reference price for this dispatch period"],
    ["RAISE6SECROP", "NUMERIC(15,5)", true, "Original regional price - prior to APC or VoLL overrides applied"],
    ["RAISE60SECRRP", "NUMERIC(15,5)", true, "Regional reference price for this dispatch period"],
    ["RAISE60SECROP", "NUMERIC(15,5)", true, "Original regional price - prior to APC or VoLL overrides applied"],
    ["RAISE5MINRRP", "NUMERIC(15,5)", true, "Regional reference price for this dispatch period"],
    ["RAISE5MINROP", "NUMERIC(15,5)", true, "Original regional price - prior to APC or VoLL overrides applied"],
