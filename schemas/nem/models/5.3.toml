    ["DESCRIPTION", "VARCHAR(80)", true, "Full name of estimator"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Timestamp of record creation or modification"],
]

[tables.VOLTAGE_INSTRUCTION]
comment = "Child record for Voltage Instructions (MVAr Dispatch)"
primary_key = ["RUN_DATETIME", "VERSION_DATETIME", "EMS_ID"]
columns = [
    ["RUN_DATETIME", "TIMESTAMP(0)", false, "MVAr Interval – a timestamp of when instructions issued"],
    ["EMS_ID", "VARCHAR(60)", false, "The unique identifier for reference within AEMO –matches equipment names between NOS and EMS"],
    ["PARTICIPANTID", "VARCHAR(20)", true, "The NEM id of the participant who owns the equipment"],
    ["STATION_ID", "VARCHAR(60)", true, "The id of the station where the control equipment resides"],
    ["DEVICE_ID", "VARCHAR(60)", true, "The company/participant preferred name of an equipment"],
    ["DEVICE_TYPE", "VARCHAR(20)", true, "One of REACTOR, CAPACITOR, GEN, SVC, TRANS or GRPGEN but may be extended to other types"],
    ["CONTROL_TYPE", "VARCHAR(20)", true, "One of VOLTAGE, TAP, MVAR, SWITCH or COMMIT but may be extended to other types"],
    ["TARGET", "NUMERIC(20,5)", true, "Instruction for the device, for this interval null denotes no instruction"],
    ["CONFORMING", "NUMERIC(1,0)", true, "[0,1] Denotes if the Device is currently conforming"],
    ["INSTRUCTION_SUMMARY", "VARCHAR(400)", true, "Verbose summary of instruction"],
