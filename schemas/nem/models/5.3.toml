    ["RUN_DATETIME", "TIMESTAMP(0)", false, "Date processing of the run begins"],
    ["RUN_NO", "NUMERIC(3,0)", false, "Unique run id.  Generated from the solution file caseid"],
    ["ENERGYBLOCK", "TIMESTAMP(0)", false, "Sunday at start of the week for this solutions energy block.  Generated from the solution file energy block"],
    ["DAY", "TIMESTAMP(0)", false, "Day this solution is for.  Generated from the solution file periodid"],
    ["LDCBLOCK", "NUMERIC(3,0)", false, "LDC block this solution is for.  Generated from the solution file periodid"],
    ["CONSTRAINTID", "VARCHAR(20)", false, "The unique identifier for the constraint"],
    ["CAPACITYRHS", "NUMERIC(12,2)", true, "The RHS value in the capacity evaluation"],
    ["CAPACITYMARGINALVALUE", "NUMERIC(12,2)", true, "Capacity adequacy assessment marginal value; 0 if not binding"],
    ["CAPACITYVIOLATIONDEGREE", "NUMERIC(12,2)", true, "Capacity adequacy assessment violation degree; 0 if not violating"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Date the solution was loaded"],
    ["RUNTYPE", "VARCHAR(20)", false, "Type of run.  Values are RELIABILITY_LRC and OUTAGE_LRC"],
]

[tables.MTPASA_CONSTRAINTSUMMARY]
comment = "Constraint Summary results over aggregation periods"
primary_key = ["RUN_DATETIME", "RUN_NO", "RUNTYPE", "DEMAND_POE_TYPE", "DAY", "CONSTRAINTID", "AGGREGATION_PERIOD"]
columns = [
    ["RUN_DATETIME", "TIMESTAMP(0)", false, "Date processing of the run begins."],
