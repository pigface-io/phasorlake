    ["VERSIONNO", "NUMERIC(3,0)", false, "Version No of reoffer"],
    ["AVAILABLELOAD", "NUMERIC(4,0)", true, "Available load"],
    ["AUTHORISEDDATE", "TIMESTAMP(0)", true, "Authorised date"],
    ["AUTHORISEDBY", "VARCHAR(15)", true, "Authorised by"],
    ["FILENAME", "VARCHAR(40)", true, "Name of reoffer file"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
    ["PERIODID", "NUMERIC(3,0)", false, "Market day trading interval number"],
]

[tables.OFFERRESTARTDATA]
comment = "OFFERRESTARTDATA sets out reoffers of system restart availability."
primary_key = ["CONTRACTID", "OFFERDATE", "VERSIONNO", "PERIODID"]
columns = [
    ["CONTRACTID", "VARCHAR(10)", false, "Contract identifier"],
    ["OFFERDATE", "TIMESTAMP(0)", false, "Effective date of contract"],
