[tables.TRANSMISSIONLOSSFACTOR]
comment = "TRANSMISSIONLOSSFACTOR shows the Transmission Loss factors applied at each connection point."
primary_key = ["CONNECTIONPOINTID", "EFFECTIVEDATE", "VERSIONNO"]
columns = [
    ["TRANSMISSIONLOSSFACTOR", "NUMERIC(15,5)", false, "Used in Bidding, Dispatch and Settlements. For Bidding and Dispatch, where the DUID is a BDU with DISPATCHTYPE of BIDIRECTIONAL, the TLF for the load component of the BDU. For Settlements, where dual TLFs apply, the primary TLF is applied to all energy (load and generation) when the Net Energy Flow of the ConnectionPointID in the interval is negative (net load)."],
    ["EFFECTIVEDATE", "TIMESTAMP(0)", false, "Effective date of record"],
    ["VERSIONNO", "NUMERIC(22,0)", false, "Version no of record for given effective date"],
    ["CONNECTIONPOINTID", "VARCHAR(10)", false, "Connection Point ID"],
    ["REGIONID", "VARCHAR(10)", true, "Region Identifier"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Record creation timestamp"],
    ["SECONDARY_TLF", "NUMERIC(18,8)", true, "Used in Bidding, Dispatch and Settlements, only populated where Dual TLFs apply. For Bidding and Dispatch, the TLF for the generation component of a BDU, when null the TRANSMISSIONLOSSFACTOR is used for both the load and generation components. For Settlements, the secondary TLF is applied to all energy (load and generation) when the Net Energy Flow of the ConnectionPointID in the interval is positive (net generation)."],
]

[tables.VALUATIONID]
comment = "VALUATIONID shows the identifiers and descriptions of the valuers submitting estimates of upcoming settlement residues. VALUATIONID supports the Settlement Residue Auction."
primary_key = ["VALUATIONID"]
columns = [
