    ["PARTICIPANTID", "VARCHAR(10)", false, "Participant ID"],
    ["FILENAME", "VARCHAR(40)", true, "Submitted file name."],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last changed date and time."],
]

[tables.OFFERFILETRK]
comment = "OFFERFILETRK shows an audit trail of all bid files submitted containing energy bids, including corrupt bids/rebids."
primary_key = ["OFFERDATE", "FILENAME", "PARTICIPANTID"]
columns = [
    ["OFFERDATE", "TIMESTAMP(0)", false, "Date file offered"],
    ["PARTICIPANTID", "VARCHAR(10)", false, "Unique participant identifier"],
    ["STATUS", "VARCHAR(10)", true, "Load status [SUCCESSFUL/CORRUPT]"],
    ["ACKFILENAME", "VARCHAR(40)", true, "Acknowledge file name"],
    ["ENDDATE", "TIMESTAMP(0)", true, "Not used"],
    ["FILENAME", "VARCHAR(40)", false, "Load file name"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
]

[tables.OFFERGOVDATA]
comment = "OFFERGOVDATA sets out reoffers of governor (6 and 60 second FCAS) availability."
