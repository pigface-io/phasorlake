[tables.PREDISPATCHSCENARIODEMAND]
comment = "PREDISPATCHSCENARIODEMAND defines the demand offsets that are applied for each of the predispatch sensitivity scenarios."
primary_key = ["EFFECTIVEDATE", "VERSIONNO", "SCENARIO", "REGIONID"]
columns = [
    ["EFFECTIVEDATE", "TIMESTAMP(0)", false, "The effective date of this set of scenarios"],
    ["VERSIONNO", "NUMERIC(3)", false, "The version of this set of scenarios"],
    ["SCENARIO", "NUMERIC(2)", false, "The scenario identifier."],
    ["REGIONID", "VARCHAR(20)", false, "The region to which to apply the deltaMW for this SCENARIO."],
    ["DELTAMW", "NUMERIC(4)", true, "The MW offset that is applied for this scenario"],
]

[tables.PREDISPATCHSCENARIODEMANDTRK]
