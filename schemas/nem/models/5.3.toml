    ["APCSTARTDATE", "TIMESTAMP(0)", true, "APC Start Date"],
    ["STARTAUTHORISEDBY", "VARCHAR(15)", true, "User authorising start"],
    ["ENDAUTHORISEDBY", "VARCHAR(15)", true, "User authorising end of event"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
]

[tables.FORCEMAJEUREREGION]
comment = "FORCEMAJEUREREGION used to set out regions impacted by a force majeure event. This table is not used."
