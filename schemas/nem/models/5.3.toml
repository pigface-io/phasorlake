[tables.OFFERULOADINGDATA]
comment = "OFFERULOADINGDATA shows reoffers of rapid unit loading capability."
primary_key = ["CONTRACTID", "EFFECTIVEDATE", "VERSIONNO", "PERIODID"]
columns = [
    ["CONTRACTID", "VARCHAR(10)", false, "Contract identifier"],
    ["EFFECTIVEDATE", "TIMESTAMP(0)", false, "Effective date of contract"],
    ["VERSIONNO", "NUMERIC(3,0)", false, "Version No of contract"],
