columns = [
    ["EQUATIONID", "VARCHAR(20)", false, "Generic Equation Identifier"],
    ["EFFECTIVEDATE", "TIMESTAMP(0)", false, "Effective date of this record"],
    ["VERSIONNO", "NUMERIC(3,0)", false, "Version no of this record for the effective date"],
    ["TERMID", "NUMERIC(3,0)", false, "The unique identifier for the a equation RHS term"],
    ["GROUPID", "NUMERIC(3,0)", true, "ID of super-term, if this is a sub-term"],
    ["SPD_ID", "VARCHAR(21)", true, "ID defining data source"],
    ["SPD_TYPE", "VARCHAR(1)", true, "ID describing type of data source"],
    ["FACTOR", "NUMERIC(16,6)", true, "Multiplier applied to operator result"],
    ["OPERATION", "VARCHAR(10)", true, "Unitary operator to apply to data value"],
    ["DEFAULTVALUE", "NUMERIC(16,6)", true, "Default value if primary source given by SPD_ID and SPD_TYPE not available."],
    ["PARAMETERTERM1", "VARCHAR(12)", true, "The unique identifier for the first term (logic expression) to use in a Branch term"],
    ["PARAMETERTERM2", "VARCHAR(12)", true, "The unique identifier for the second term (logic<=0 result) to use in a Branch term"],
    ["PARAMETERTERM3", "VARCHAR(12)", true, "The unique identifier for the third term (logic>0 result) to use in a Branch term"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
]

[tables.GENMETER]
comment = "GENMETER shows details of generator meter sets."
primary_key = ["METERID", "APPLYDATE", "VERSIONNO"]
columns = [
    ["METERID", "VARCHAR(12)", false, "Meter Id"],
