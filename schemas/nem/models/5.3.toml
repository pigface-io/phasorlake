    ["MAXIMUM_ENERGY_PRICE", "NUMERIC(9,2)", true, "Capped Offer/Bid Energy Price adjusted for TLF, DLF and VoLL"],
    ["SCHEDULE_TYPE", "VARCHAR(20)", true, "Scheduled status of the unit:\n    'SCHEDULED'\n    'NON-SCHEDULED'\n    'SEMI-SCHEDULED'"],
    ["MIN_RAMP_RATE_UP", "NUMERIC(6,0)", true, "MW/Min. Calculated Minimum Ramp Rate Up value accepted for Energy Offers or Bids with explanation"],
    ["MIN_RAMP_RATE_DOWN", "NUMERIC(6,0)", true, "MW/Min. Calculated Minimum Ramp Rate Down value accepted for Energy Offers or Bids with explanation"],
    ["MAX_RAMP_RATE_UP", "NUMERIC(6,0)", true, "Maximum ramp up rate for Unit (Mw/min) - from DUDetail table"],
    ["MAX_RAMP_RATE_DOWN", "NUMERIC(6,0)", true, "Maximum ramp down rate for Unit (Mw/min) - from DUDetail table"],
    ["IS_AGGREGATED", "NUMERIC(1,0)", true, "Whether the DUID is classified as an \"Aggregated Unit\" under the rules. This impacts the Minimum Ramp Rate calculation"],
    ["DISPATCHSUBTYPE", "VARCHAR(20)", true, "Additional information for DISPATCHTYPE. For DISPATCHTYPE = LOAD, subtype value is WDR for wholesale demand response units For DISPATCHTYPE = LOAD, subtype value is NULL for Scheduled Loads. For DISPATCHTYPE = GENERATOR type, subtype value is NULL."],
    ["ADG_ID", "VARCHAR(20)", true, "Aggregate Dispatch Group. Group into which the DUID is aggregated for Conformance. Null if DUID not aggregated for Conformance"],
    ["LOAD_MINIMUM_ENERGY_PRICE", "NUMERIC(9,2)", true, "BDU only. Floored Offer/Bid Energy Price adjusted for TLF, DLF and MPF for energy imports"],
    ["LOAD_MAXIMUM_ENERGY_PRICE", "NUMERIC(9,2)", true, "BDU only. Capped Offer/Bid Energy Price adjusted for TLF, DLF and VoLL for energy imports"],
    ["LOAD_MIN_RAMP_RATE_UP", "NUMERIC(6,0)", true, "BDU only. MW/Min. Calculated Minimum Ramp Rate Up value accepted for Energy Offers or Bids with explanation for energy imports"],
    ["LOAD_MIN_RAMP_RATE_DOWN", "NUMERIC(6,0)", true, "BDU only. MW/Min. Calculated Minimum Ramp Rate Down value accepted for Energy Offers or Bids with explanation for energy imports"],
    ["LOAD_MAX_RAMP_RATE_UP", "NUMERIC(6,0)", true, "BDU only. MW/Min. Registered Maximum Ramp Rate Up value accepted for Energy Offers or Bids for energy imports"],
    ["LOAD_MAX_RAMP_RATE_DOWN", "NUMERIC(6,0)", true, "BDU only. MW/Min. Registered Maximum Ramp Rate Down value accepted for Energy Offers or Bids for energy imports"],
    ["SECONDARY_TLF", "NUMERIC(18,8)", true, "Used in Bidding, Dispatch and Settlements, only populated where Dual TLFs apply. For Bidding and Dispatch, the TLF for the generation component of a BDU, when null the TRANSMISSIONLOSSFACTOR is used for both the load and generation components. For Settlements, the secondary TLF is applied to all energy (load and generation) when the Net Energy Flow of the ConnectionPointID in the interval is positive (net generation)."],
]

[tables.EMSMASTER]
comment = "EMSMASTER provides a description of the SCADA measurements that are associated with the SPD_ID points utilised in generic equation RHS terms"
primary_key = ["SPD_ID", "SPD_TYPE"]
columns = [
    ["SPD_ID", "VARCHAR(21)", false, "ID defining data source"],
    ["SPD_TYPE", "VARCHAR(1)", false, "ID describing type of data source"],
    ["DESCRIPTION", "VARCHAR(255)", true, "The detailed description of the SCADA point associated with the SPD_ID"],
    ["GROUPING_ID", "VARCHAR(20)", true, "The Grouping associated with the SPD ID - most often a RegionID"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
]

[tables.FCAS_REGU_USAGE_FACTORS]
comment = "Stores the proportion of enabled regulation FCAS dispatch that is typically consumed for frequency regulation. Used to calculate the projected state of charge for energy storage systems."
primary_key = ["EFFECTIVEDATE", "VERSIONNO", "REGIONID", "BIDTYPE", "PERIODID"]
columns = [
    ["EFFECTIVEDATE", "TIMESTAMP(0)", false, "The effective date for this regulation FCAS usage factor"],
    ["VERSIONNO", "NUMERIC(3,0)", false, "Version with respect to effective date"],
    ["REGIONID", "VARCHAR(20)", false, "Unique RegionID"],
    ["BIDTYPE", "VARCHAR(20)", false, "The type of regulation FCAS service [RAISEREG,LOWERREG]"],
    ["PERIODID", "NUMERIC(3,0)", false, "The Period ID (1 - 48) within the calendar day to which this usage factor applies"],
    ["USAGE_FACTOR", "NUMERIC(8,3)", true, "The proportion of cleared regulation FCAS that is assumed to be used within a dispatch interval. Expressed as a fractional amount between 0 and 1"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "The last time the data has been changed/updated"],
]

[tables.FCAS_REGU_USAGE_FACTORS_TRK]
comment = "Stores the proportion of enabled regulation FCAS dispatch that is typically consumed for frequency regulation. Used to calculate the projected state of charge for energy storage systems."
