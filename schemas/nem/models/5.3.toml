    ["VERSIONFROM", "TIMESTAMP(0)", true, "Date for which this version is effective from"],
    ["VERSIONTO", "TIMESTAMP(0)", true, "Date for which this version is effective to. Will be set to current day plus one if it is the current active record or past date if the record has been superseded/ended."],
    ["STARTDATE", "TIMESTAMP(0)", true, "Effective date of when this service started operation"],
    ["ENDDATE", "TIMESTAMP(0)", true, "Date for which this version is effective to. Will be set to current day plus one if it is the current active record or past date if the record has been superseded/ended."],
    ["NMI", "VARCHAR(20)", true, "National Meter Identifier linked to the group."],
    ["SITENAME", "VARCHAR(50)", true, "Site name"],
    ["NERRGROUPPREMISES", "NUMERIC(1,0)", true, "Specifies whether NMI is in a NERR aggregated premises (TRUE = 1/FALSE = 0)"],
