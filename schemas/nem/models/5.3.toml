    ["LOWER6SECRRP", "NUMERIC(15,5)", true, "Regional reference price for this dispatch period"],
    ["LOWER6SECROP", "NUMERIC(15,5)", true, "Original regional price - prior to APC or VoLL overrides applied"],
    ["LOWER60SECRRP", "NUMERIC(15,5)", true, "Regional reference price for this dispatch period"],
    ["LOWER60SECROP", "NUMERIC(15,5)", true, "Original regional price - prior to APC or VoLL overrides applied"],
