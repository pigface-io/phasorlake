    ["DEMAND_MINUS_SCHEDULED_LOAD", "NUMERIC(16,6)", true, "Regional demand minus the scheduled load value"],
    ["CONSTRAINED_CAPACITY", "NUMERIC(16,6)", true, "The total regional capacity due to energy and network constraints"],
    ["UNCONSTRAINED_CAPACITY", "NUMERIC(16,6)", true, "The total regional capacity, subject to network constraints."],
    ["NET_INTERCHANGE", "NUMERIC(16,6)", true, "Regional net MW import via interconnectors"],
    ["ENERGY_REQUIREMENT_10POE", "NUMERIC(16,6)", true, "Regional energy required to meet demand"],
    ["REPORTED_BLOCK_ID", "NUMERIC(16,6)", true, "The load duration curve block that is recorded in the report."],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last change date and time."],
]

[tables.MTPASA_CASERESULT]
comment = "MTPASA solution header table"
primary_key = ["RUN_DATETIME", "RUN_NO"]
columns = [
    ["RUN_DATETIME", "TIMESTAMP(0)", false, "Date processing of the run begins."],
    ["RUN_NO", "NUMERIC(4)", false, "Unique run id."],
    ["PLEXOS_VERSION", "VARCHAR(20)", true, "Version of PLEXOS used"],
    ["LASTCHANGED", "TIMESTAMP(0)", true, "Last date and time record changed"],
]

[tables.MTPASA_CASESOLUTION]
comment = "MTPASA_CASESOLUTION is obsolete from 2017 End of Year DM4.27 Release. \nMTPASA_CASESOLUTION holds one record for each entire solution.\nChange Notice 379 announced the replacement of the MT PASA data model so all MTPASAxxx tables become obsolete, replaced by MTPASA_xxx tables."
