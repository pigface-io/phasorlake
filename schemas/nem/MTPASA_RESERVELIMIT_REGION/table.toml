# Our schema of MTPASA_RESERVELIMIT_REGION. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "MTPASA_RESERVELIMIT_REGION"
description = "MT PASA input table to define the regions that are part of a single MT PASA Reserve Requirement"
report_pairs = [["MTPASA", "RESERVELIMIT_REGION"]]
load_mode = "append"
primary_key = ["EFFECTIVEDATE", "VERSION_DATETIME", "RESERVELIMITID", "REGIONID"]
time_column = "EFFECTIVEDATE"
next_column_id = 7

column = [
    { id = 1, name = "EFFECTIVEDATE", type = "timestamp", nullable = false },
    { id = 2, name = "VERSION_DATETIME", type = "timestamp", nullable = false },
    { id = 3, name = "RESERVELIMITID", type = "string", nullable = false },
    { id = 4, name = "REGIONID", type = "string", nullable = false },
    { id = 5, name = "COEF", type = "double", nullable = true },
    { id = 6, name = "LASTCHANGED", type = "timestamp", nullable = true },
]

[temporal]
origin = "derived"
entity = ["RESERVELIMITID", "REGIONID"]
valid = { kind = "from", column = "EFFECTIVEDATE" }
order = ["VERSION_DATETIME", "LASTCHANGED"]
cutoff = "VERSION_DATETIME"

[[increment]]
n = 1
from = "2015-01"
ctl = "001.ctl"
ctl_sha256 = "7d071e714609bab132bcee0b9d59a883e872c1587c62e1d09777a0499f3b8645"
aemo_ctl = "PUBLIC_DVD_MTPASA_RESERVELIMIT_REGION_201501.ctl"
aemo_versions = [1]
columns = [
    "EFFECTIVEDATE",
    "VERSION_DATETIME",
    "RESERVELIMITID",
    "REGIONID",
    "COEF",
    "LASTCHANGED",
]
