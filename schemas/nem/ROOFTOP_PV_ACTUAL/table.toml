# Our schema of ROOFTOP_PV_ACTUAL. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "ROOFTOP_PV_ACTUAL"
description = "Estimate of regional Rooftop Solar actual generation for each half-hour interval in a day"
report_pairs = [["ROOFTOP", "ACTUAL"]]
load_mode = "append"
primary_key = ["INTERVAL_DATETIME", "REGIONID", "TYPE"]
time_column = "INTERVAL_DATETIME"
next_column_id = 7

column = [
    { id = 1, name = "INTERVAL_DATETIME", type = "timestamp_ns", nullable = false },
    { id = 2, name = "REGIONID", type = "string", nullable = false },
    { id = 3, name = "POWER", type = "double", nullable = true },
    { id = 6, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
    { id = 5, name = "TYPE", type = "string", nullable = false },
    { id = 4, name = "QI", type = "double", nullable = true },
]

[temporal]
origin = "derived"
entity = ["REGIONID", "TYPE"]
valid = { kind = "interval_end", column = "INTERVAL_DATETIME" }
order = ["LASTCHANGED"]
cutoff = "LASTCHANGED"

