# Our schema of DISPATCH_UNIT_SCADA. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "DISPATCH_UNIT_SCADA"
description = "Dispatchable unit MW from SCADA at the start of the dispatch interval. The table includes all scheduled and semi-scheduled (and non-scheduled units where SCADA is available)"
report_pairs = [["DISPATCH", "UNIT_SCADA"]]
load_mode = "append"
primary_key = ["SETTLEMENTDATE", "DUID"]
time_column = "SETTLEMENTDATE"
next_column_id = 5

column = [
    { id = 1, name = "SETTLEMENTDATE", type = "timestamp_ns", nullable = false },
    { id = 2, name = "DUID", type = "string", nullable = false },
    { id = 3, name = "SCADAVALUE", type = "double", nullable = true },
    { id = 4, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
]

[temporal]
origin = "derived"
entity = ["DUID"]
valid = { kind = "interval_end", column = "SETTLEMENTDATE" }
order = ["LASTCHANGED"]
cutoff = "LASTCHANGED"

[[increment]]
n = 1
from = "2015-01"
ctl = "001.ctl"
ctl_sha256 = "02ec66d8a4d3e0ba18f7c3fedc48d42e142f34f50e3f323b9eac9361c00d30ed"
aemo_ctl = "PUBLIC_DVD_DISPATCH_UNIT_SCADA_201501.ctl"
aemo_versions = []
columns = [
    "SETTLEMENTDATE",
    "DUID",
    "SCADAVALUE",
]

