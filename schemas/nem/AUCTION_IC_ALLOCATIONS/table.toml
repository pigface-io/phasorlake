# Our schema of AUCTION_IC_ALLOCATIONS. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "AUCTION_IC_ALLOCATIONS"
description = "AUCTION_IC_ALLOCATIONS supports the Settlement Residue Auction by providing the basis for setting up contracts for individual tranches. AUCTION_IC_ALLOCATIONS shows the default definitions for the total number of units and proportion applicable to each directional interconnector for a specified auction quarter."
report_pairs = [["IRAUCTION_CONFIG", "AUCTION_IC_ALLOCATIONS"]]
load_mode = "append"
primary_key = ["CONTRACTYEAR", "QUARTER", "VERSIONNO", "INTERCONNECTORID", "FROMREGIONID"]
time_column = "LASTCHANGED"
next_column_id = 13

column = [
    { id = 1, name = "CONTRACTYEAR", type = "double", nullable = false },
    { id = 2, name = "QUARTER", type = "double", nullable = false },
    { id = 3, name = "VERSIONNO", type = "double", nullable = false },
    { id = 4, name = "INTERCONNECTORID", type = "string", nullable = false },
    { id = 5, name = "FROMREGIONID", type = "string", nullable = false },
    { id = 6, name = "MAXIMUMUNITS", type = "double", nullable = true },
    { id = 7, name = "PROPORTION", type = "double", nullable = true },
    { id = 8, name = "AUCTIONFEE", type = "double", nullable = true },
    { id = 9, name = "CHANGEDATE", type = "timestamp", nullable = true },
    { id = 10, name = "CHANGEDBY", type = "string", nullable = true },
    { id = 11, name = "LASTCHANGED", type = "timestamp", nullable = true },
    { id = 12, name = "AUCTIONFEE_SALES", type = "double", nullable = true },
]

