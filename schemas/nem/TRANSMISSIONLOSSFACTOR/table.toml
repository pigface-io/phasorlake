# Our schema of TRANSMISSIONLOSSFACTOR. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "TRANSMISSIONLOSSFACTOR"
description = "TRANSMISSIONLOSSFACTOR shows the Transmission Loss factors applied at each connection point."
report_pairs = [["MARKET_CONFIG", "TRANSMISSIONLOSSFACTOR"]]
load_mode = "append"
primary_key = ["EFFECTIVEDATE", "VERSIONNO", "CONNECTIONPOINTID"]
time_column = "EFFECTIVEDATE"
next_column_id = 8

column = [
    { id = 1, name = "TRANSMISSIONLOSSFACTOR", type = "double", nullable = true },
    { id = 2, name = "EFFECTIVEDATE", type = "timestamp_ns", nullable = false },
    { id = 3, name = "VERSIONNO", type = "double", nullable = false },
    { id = 4, name = "CONNECTIONPOINTID", type = "string", nullable = false },
    { id = 5, name = "REGIONID", type = "string", nullable = true },
    { id = 6, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
    { id = 7, name = "SECONDARY_TLF", type = "double", nullable = true },
]

[temporal]
origin = "derived"
entity = ["CONNECTIONPOINTID"]
valid = { kind = "from", column = "EFFECTIVEDATE" }
order = ["VERSIONNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"

[[increment]]
n = 1
from = "2015-01"
ctl = "001.ctl"
ctl_sha256 = "006df0148efeb5dec0e4869abe9fcf0397510b43157424bbace223275415ef47"
aemo_ctl = "PUBLIC_DVD_TRANSMISSIONLOSSFACTOR_201501.ctl"
aemo_versions = [2]
columns = [
    "TRANSMISSIONLOSSFACTOR",
    "EFFECTIVEDATE",
    "VERSIONNO",
    "CONNECTIONPOINTID",
    "REGIONID",
    "LASTCHANGED",
    "SECONDARY_TLF",
]
