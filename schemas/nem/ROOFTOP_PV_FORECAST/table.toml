# Our schema of ROOFTOP_PV_FORECAST. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "ROOFTOP_PV_FORECAST"
description = "Regional forecasts of Rooftop Solar generation across the half-hour intervals over 8 days"
report_pairs = [["ROOFTOP", "FORECAST"]]
load_mode = "append"
primary_key = ["VERSION_DATETIME", "REGIONID", "INTERVAL_DATETIME"]
time_column = "INTERVAL_DATETIME"
next_column_id = 9

column = [
    { id = 1, name = "VERSION_DATETIME", type = "timestamp", nullable = false },
    { id = 2, name = "REGIONID", type = "string", nullable = false },
    { id = 3, name = "INTERVAL_DATETIME", type = "timestamp", nullable = false },
    { id = 4, name = "POWERMEAN", type = "double", nullable = true },
    { id = 5, name = "POWERPOE50", type = "double", nullable = true },
    { id = 6, name = "POWERPOELOW", type = "double", nullable = true },
    { id = 7, name = "POWERPOEHIGH", type = "double", nullable = true },
    { id = 8, name = "LASTCHANGED", type = "timestamp", nullable = true },
]

[temporal]
origin = "derived"
entity = ["REGIONID"]
valid = { kind = "interval_end", column = "INTERVAL_DATETIME" }
order = ["VERSION_DATETIME", "LASTCHANGED"]
cutoff = "VERSION_DATETIME"

[[increment]]
n = 1
from = "2019-10"
ctl = "001.ctl"
ctl_sha256 = "de27ec4b918e0688271da3d6e8084018040bf1310f87aef77cdc4f55271255b7"
aemo_ctl = "PUBLIC_DVD_ROOFTOP_PV_FORECAST_201910.ctl"
aemo_versions = [1]
columns = [
    "VERSION_DATETIME",
    "REGIONID",
    "INTERVAL_DATETIME",
    "POWERMEAN",
    "POWERPOE50",
    "POWERPOELOW",
    "POWERPOEHIGH",
    "LASTCHANGED",
]
