# Our schema of MTPASA_REGIONAVAILABILITY. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 2
name = "MTPASA_REGIONAVAILABILITY"
description = "Stores the Region-aggregate offered PASA Availability of scheduled generators for each day over the Medium Term PASA period. The data in this table is an aggregate of input data to the MT PASA process it is not part of the MTPASA solution. The aggregate availability does not reflect any energy limitations in the MT PASA offers."
report_pairs = [["MTPASA", "REGIONAVAILABILITY"]]
load_mode = "append"
dedupe = "pk_lastchanged"
primary_key = ["PUBLISH_DATETIME", "DAY", "REGIONID"]
time_column = "DAY"
next_column_id = 19

column = [
    { id = 1, name = "PUBLISH_DATETIME", type = "timestamp_ns", nullable = false },
    { id = 2, name = "DAY", type = "timestamp_ns", nullable = false },
    { id = 3, name = "REGIONID", type = "string", nullable = false },
    { id = 4, name = "PASAAVAILABILITY_SCHEDULED", type = "double", nullable = true },
    { id = 5, name = "LATEST_OFFER_DATETIME", type = "timestamp_ns", nullable = true },
    { id = 6, name = "ENERGYUNCONSTRAINEDCAPACITY", type = "double", nullable = true },
    { id = 7, name = "ENERGYCONSTRAINEDCAPACITY", type = "double", nullable = true },
    { id = 8, name = "NONSCHEDULEDGENERATION", type = "double", nullable = true },
    { id = 9, name = "DEMAND10", type = "double", nullable = true },
    { id = 10, name = "DEMAND50", type = "double", nullable = true },
    { id = 11, name = "ENERGYREQDEMAND10", type = "double", nullable = true },
    { id = 12, name = "ENERGYREQDEMAND50", type = "double", nullable = true },
    { id = 13, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
    { id = 14, name = "DEMAND10MIN", type = "double", nullable = true },
    { id = 15, name = "DEMAND10MAX", type = "double", nullable = true },
    { id = 16, name = "DEMAND50MIN", type = "double", nullable = true },
    { id = 17, name = "DEMAND50MAX", type = "double", nullable = true },
    { id = 18, name = "CARRYOVERCAPACITY", type = "double", nullable = true },
]

