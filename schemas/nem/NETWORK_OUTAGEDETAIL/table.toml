# Our schema of NETWORK_OUTAGEDETAIL. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "NETWORK_OUTAGEDETAIL"
description = "Lists asset owners planned outages for transmission equipment. This also includes details for transmission equipment that will not have an outage, but associated secondary equipment has an outage and a related constraint set may be invoked. This scenario is indicated by the ISSECONDARY field in the table"
report_pairs = [["NETWORK", "OUTAGEDETAIL"]]
load_mode = "append"
primary_key = ["OUTAGEID", "SUBSTATIONID", "EQUIPMENTTYPE", "EQUIPMENTID", "STARTTIME"]
time_column = "LASTCHANGED"
next_column_id = 20

column = [
    { id = 1, name = "OUTAGEID", type = "double", nullable = false },
    { id = 2, name = "SUBSTATIONID", type = "string", nullable = false },
    { id = 3, name = "EQUIPMENTTYPE", type = "string", nullable = false },
    { id = 4, name = "EQUIPMENTID", type = "string", nullable = false },
    { id = 5, name = "STARTTIME", type = "timestamp", nullable = false },
    { id = 6, name = "ENDTIME", type = "timestamp", nullable = true },
    { id = 7, name = "SUBMITTEDDATE", type = "timestamp", nullable = true },
    { id = 8, name = "OUTAGESTATUSCODE", type = "string", nullable = true },
    { id = 9, name = "RESUBMITREASON", type = "string", nullable = true },
    { id = 10, name = "RESUBMITOUTAGEID", type = "double", nullable = true },
    { id = 11, name = "RECALLTIMEDAY", type = "double", nullable = true },
    { id = 12, name = "RECALLTIMENIGHT", type = "double", nullable = true },
    { id = 13, name = "LASTCHANGED", type = "timestamp", nullable = true },
    { id = 14, name = "REASON", type = "string", nullable = true },
    { id = 15, name = "ISSECONDARY", type = "double", nullable = true },
    { id = 16, name = "ACTUAL_STARTTIME", type = "timestamp", nullable = true },
    { id = 17, name = "ACTUAL_ENDTIME", type = "timestamp", nullable = true },
    { id = 18, name = "COMPANYREFCODE", type = "string", nullable = true },
    { id = 19, name = "ELEMENTID", type = "double", nullable = true },
]

