# Our schema of LOSSMODEL. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "LOSSMODEL"
description = "LOSSMODEL sets out segment breakpoints in loss model for each interconnector, used by LP Solver modelling of interconnector flows."
report_pairs = [["MARKET_CONFIG", "LOSSMODEL"]]
load_mode = "snapshot"
primary_key = ["EFFECTIVEDATE", "VERSIONNO", "INTERCONNECTORID", "LOSSSEGMENT"]
next_column_id = 9

column = [
    { id = 1, name = "EFFECTIVEDATE", type = "timestamp_ns", nullable = false },
    { id = 2, name = "VERSIONNO", type = "double", nullable = false },
    { id = 3, name = "INTERCONNECTORID", type = "string", nullable = false },
    { id = 4, name = "PERIODID", type = "string", nullable = true },
    { id = 5, name = "LOSSSEGMENT", type = "double", nullable = false },
    { id = 6, name = "MWBREAKPOINT", type = "double", nullable = true },
    { id = 7, name = "LOSSFACTOR", type = "double", nullable = true },
    { id = 8, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
]

[temporal]
origin = "derived"
entity = ["INTERCONNECTORID", "LOSSSEGMENT"]
valid = { kind = "from", column = "EFFECTIVEDATE" }
order = ["VERSIONNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"

[[increment]]
n = 1
from = "2015-01"
ctl = "001.ctl"
ctl_sha256 = "78bc0f6860bea716a441ca788eed4ce1662184a51c8235ba3d5cc8c85b8a0354"
aemo_ctl = "PUBLIC_DVD_LOSSMODEL_201501.ctl"
aemo_versions = [1]
columns = [
    "EFFECTIVEDATE",
    "VERSIONNO",
    "INTERCONNECTORID",
    "PERIODID",
    "LOSSSEGMENT",
    "MWBREAKPOINT",
    "LOSSFACTOR",
    "LASTCHANGED",
]
