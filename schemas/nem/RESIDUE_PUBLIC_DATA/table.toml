# Our schema of RESIDUE_PUBLIC_DATA. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 2
name = "RESIDUE_PUBLIC_DATA"
description = """
RESIDUE_PUBLIC_DATA shows the public auction results.
RESIDUE_PUBLIC_DATA supports the Settlement Residue Auction, by holding the public details of the auction for a given contract. RESIDUE_PUBLIC_DATA joins to RESIDUE_CON_DATA and RESIDUE."""
report_pairs = [["IRAUCTION", "RESIDUE_PUBLIC_DATA"]]
load_mode = "append"
dedupe = "pk_lastchanged"
primary_key = ["CONTRACTID", "VERSIONNO", "INTERCONNECTORID", "FROMREGIONID"]
time_column = "LASTCHANGED"
next_column_id = 10

column = [
    { id = 1, name = "CONTRACTID", type = "string", nullable = false },
    { id = 2, name = "VERSIONNO", type = "double", nullable = false },
    { id = 3, name = "INTERCONNECTORID", type = "string", nullable = false },
    { id = 4, name = "FROMREGIONID", type = "string", nullable = false },
    { id = 5, name = "UNITSOFFERED", type = "double", nullable = true },
    { id = 6, name = "UNITSSOLD", type = "double", nullable = true },
    { id = 7, name = "CLEARINGPRICE", type = "double", nullable = true },
    { id = 8, name = "RESERVEPRICE", type = "double", nullable = true },
    { id = 9, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
]

[[increment]]
n = 1
from = "2026-08"
ctl = "001.ctl"
ctl_sha256 = "825b83e3c640d65a84533d9c195771754c2d0873719ad29de1f3b38af0b4be6f"
aemo_ctl = "PUBLIC_ARCHIVE#RESIDUE_PUBLIC_DATA#FILE01#202608.ctl"
