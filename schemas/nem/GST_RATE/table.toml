# Our schema of GST_RATE. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "GST_RATE"
description = "GST_RATE maintains the GST rates on a BAS (Business Activity Statement) class basis."
report_pairs = [["BILLING_CONFIG", "GST_RATE"]]
load_mode = "snapshot"
primary_key = ["EFFECTIVEDATE", "VERSIONNO", "BAS_CLASS"]
next_column_id = 6

column = [
    { id = 1, name = "EFFECTIVEDATE", type = "timestamp", nullable = false },
    { id = 2, name = "VERSIONNO", type = "double", nullable = false },
    { id = 3, name = "BAS_CLASS", type = "string", nullable = false },
    { id = 4, name = "GST_RATE", type = "double", nullable = true },
    { id = 5, name = "LASTCHANGED", type = "timestamp", nullable = true },
]

[temporal]
origin = "derived"
entity = ["BAS_CLASS"]
valid = { kind = "from", column = "EFFECTIVEDATE" }
order = ["VERSIONNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"

[[increment]]
n = 1
from = "2015-01"
ctl = "001.ctl"
ctl_sha256 = "2f52cb96f8fd30e42a7dfb7951e78c5ae0092d5b9dde6eb4d4d7f855ede6d837"
aemo_ctl = "PUBLIC_DVD_GST_RATE_201501.ctl"
aemo_versions = [1]
columns = [
    "EFFECTIVEDATE",
    "VERSIONNO",
    "BAS_CLASS",
    "GST_RATE",
    "LASTCHANGED",
]
