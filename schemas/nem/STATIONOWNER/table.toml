# Our schema of STATIONOWNER. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "STATIONOWNER"
description = "STATIONOWNER sets out the owner details of each station."
report_pairs = [["PARTICIPANT_REGISTRATION", "STATIONOWNER"]]
load_mode = "snapshot"
primary_key = ["EFFECTIVEDATE", "PARTICIPANTID", "STATIONID", "VERSIONNO"]
next_column_id = 6

column = [
    { id = 1, name = "EFFECTIVEDATE", type = "timestamp", nullable = false },
    { id = 2, name = "PARTICIPANTID", type = "string", nullable = false },
    { id = 3, name = "STATIONID", type = "string", nullable = false },
    { id = 4, name = "VERSIONNO", type = "double", nullable = false },
    { id = 5, name = "LASTCHANGED", type = "timestamp", nullable = true },
]

