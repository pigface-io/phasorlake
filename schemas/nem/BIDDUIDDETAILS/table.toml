# Our schema of BIDDUIDDETAILS. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "BIDDUIDDETAILS"
description = "BIDDUIDDETAILS and the associated tracking object BIDDUIDDETAILSTRK define the registration data for each ancillary service a dispatchable unit is registered to provide. The registration data is required to validate a dispatchable unit bid submitted for that ancillary service."
report_pairs = [["PARTICIPANT_REGISTRATION", "BIDDUIDDETAILS"]]
load_mode = "snapshot"
primary_key = ["DUID", "EFFECTIVEDATE", "VERSIONNO", "BIDTYPE"]
next_column_id = 11

column = [
    { id = 1, name = "DUID", type = "string", nullable = false },
    { id = 2, name = "EFFECTIVEDATE", type = "timestamp_ns", nullable = false },
    { id = 3, name = "VERSIONNO", type = "double", nullable = false },
    { id = 4, name = "BIDTYPE", type = "string", nullable = false },
    { id = 5, name = "MAXCAPACITY", type = "double", nullable = true },
    { id = 6, name = "MINENABLEMENTLEVEL", type = "double", nullable = true },
    { id = 7, name = "MAXENABLEMENTLEVEL", type = "double", nullable = true },
    { id = 8, name = "MAXLOWERANGLE", type = "double", nullable = true },
    { id = 9, name = "MAXUPPERANGLE", type = "double", nullable = true },
    { id = 10, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
]

[temporal]
origin = "derived"
entity = ["DUID", "BIDTYPE"]
valid = { kind = "from", column = "EFFECTIVEDATE" }
order = ["VERSIONNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"

[[increment]]
n = 1
from = "2015-01"
ctl = "001.ctl"
ctl_sha256 = "9e318fe7654481443f3e0d317c7ec513e1fb7735871e2701131894e8e29c4026"
aemo_ctl = "PUBLIC_DVD_BIDDUIDDETAILS_201501.ctl"
aemo_versions = [1]
columns = [
    "DUID",
    "EFFECTIVEDATE",
    "VERSIONNO",
    "BIDTYPE",
    "MAXCAPACITY",
    "MINENABLEMENTLEVEL",
    "MAXENABLEMENTLEVEL",
    "MAXLOWERANGLE",
    "MAXUPPERANGLE",
    "LASTCHANGED",
]
