    { id = 3, name = "VERSIONNO", type = "double", nullable = false },
    { id = 4, name = "BIDTYPE", type = "string", nullable = false },
    { id = 5, name = "MAXCAPACITY", type = "double", nullable = true },
    { id = 6, name = "MINENABLEMENTLEVEL", type = "double", nullable = true },
