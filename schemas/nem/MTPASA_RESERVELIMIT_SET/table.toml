# Our schema of MTPASA_RESERVELIMIT_SET. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "MTPASA_RESERVELIMIT_SET"
description = "MT PASA input table defining a set of MT PASA Reserve Requirements. Note only one set can be active on a given date."
report_pairs = [["MTPASA", "RESERVELIMIT_SET"]]
load_mode = "snapshot"
primary_key = ["EFFECTIVEDATE", "VERSION_DATETIME"]
next_column_id = 8

column = [
    { id = 1, name = "EFFECTIVEDATE", type = "timestamp", nullable = false },
    { id = 2, name = "VERSION_DATETIME", type = "timestamp", nullable = false },
    { id = 3, name = "RESERVELIMIT_SET_ID", type = "string", nullable = true },
    { id = 4, name = "DESCRIPTION", type = "string", nullable = true },
    { id = 5, name = "AUTHORISEDDATE", type = "timestamp", nullable = true },
    { id = 6, name = "AUTHORISEDBY", type = "string", nullable = true },
    { id = 7, name = "LASTCHANGED", type = "timestamp", nullable = true },
]

[temporal]
origin = "derived"
entity = []
valid = { kind = "from", column = "EFFECTIVEDATE" }
order = ["VERSION_DATETIME", "LASTCHANGED"]
cutoff = "VERSION_DATETIME"

[[increment]]
n = 1
from = "2015-01"
ctl = "001.ctl"
ctl_sha256 = "50c0aec266f66642dbca3602ea8563d9d48631d705a56fd0479808fec5f15da7"
aemo_ctl = "PUBLIC_DVD_MTPASA_RESERVELIMIT_SET_201501.ctl"
aemo_versions = [1]
columns = [
    "EFFECTIVEDATE",
    "VERSION_DATETIME",
    "RESERVELIMIT_SET_ID",
    "DESCRIPTION",
    "AUTHORISEDDATE",
    "AUTHORISEDBY",
    "LASTCHANGED",
]
