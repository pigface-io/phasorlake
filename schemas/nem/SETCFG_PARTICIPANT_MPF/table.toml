# Our schema of SETCFG_PARTICIPANT_MPF. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "SETCFG_PARTICIPANT_MPF"
description = "SETCFG_PARTICIPANT_MPF shows the Market Participation Factors (MPF) for each participant for each connection point. The MPF values are used to determine recovery amounts for regulation FCAS."
report_pairs = [["SETTLEMENT_CONFIG", "SETCFG_PARTICIPANT_MPF"]]
load_mode = "append"
primary_key = ["PARTICIPANTID", "EFFECTIVEDATE", "VERSIONNO", "PARTICIPANTCATEGORYID", "CONNECTIONPOINTID"]
time_column = "EFFECTIVEDATE"
next_column_id = 8

column = [
    { id = 1, name = "PARTICIPANTID", type = "string", nullable = false },
    { id = 2, name = "EFFECTIVEDATE", type = "timestamp", nullable = false },
    { id = 3, name = "VERSIONNO", type = "double", nullable = false },
    { id = 4, name = "PARTICIPANTCATEGORYID", type = "string", nullable = false },
    { id = 5, name = "CONNECTIONPOINTID", type = "string", nullable = false },
    { id = 6, name = "MPF", type = "double", nullable = true },
    { id = 7, name = "LASTCHANGED", type = "timestamp", nullable = true },
]

[temporal]
origin = "derived"
entity = ["PARTICIPANTID", "PARTICIPANTCATEGORYID", "CONNECTIONPOINTID"]
valid = { kind = "from", column = "EFFECTIVEDATE" }
order = ["VERSIONNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"

[[increment]]
n = 1
from = "2015-01"
ctl = "001.ctl"
ctl_sha256 = "4b2746598ade7a686f2bf7c343b197b5463061315d91c96c07d05e5bb678b7ab"
aemo_ctl = "PUBLIC_DVD_SETCFG_PARTICIPANT_MPF_201501.ctl"
aemo_versions = [1]
columns = [
    "PARTICIPANTID",
    "EFFECTIVEDATE",
    "VERSIONNO",
    "PARTICIPANTCATEGORYID",
    "CONNECTIONPOINTID",
    "MPF",
    "LASTCHANGED",
]
