# Our schema of GENCONDATA. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 2
name = "GENCONDATA"
description = """
GENCONDATA sets out the generic constraints contained within a generic constraint set invoked in PASA, predispatch and dispatch.
Fields enable selective application of invoked constraints in the Dispatch, Predispatch, ST PASA or MT PASA processes."""
report_pairs = [["GENCONDATA", ""], ["GENCONDATA", "NULL"]]
load_mode = "append"
dedupe = "pk_lastchanged"
primary_key = ["EFFECTIVEDATE", "VERSIONNO", "GENCONID"]
time_column = "EFFECTIVEDATE"
next_column_id = 30

