# Our schema of GENCONDATA. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 2
name = "GENCONDATA"
description = """
GENCONDATA sets out the generic constraints contained within a generic constraint set invoked in PASA, predispatch and dispatch.
Fields enable selective application of invoked constraints in the Dispatch, Predispatch, ST PASA or MT PASA processes."""
report_pairs = [["GENCONDATA", ""], ["GENCONDATA", "NULL"]]
load_mode = "append"
dedupe = "pk_lastchanged"
primary_key = ["EFFECTIVEDATE", "VERSIONNO", "GENCONID"]
time_column = "EFFECTIVEDATE"
next_column_id = 30

column = [
    { id = 1, name = "EFFECTIVEDATE", type = "timestamp_ns", nullable = false },
    { id = 2, name = "VERSIONNO", type = "double", nullable = false },
    { id = 3, name = "GENCONID", type = "string", nullable = false },
    { id = 4, name = "CONSTRAINTTYPE", type = "string", nullable = true },
    { id = 5, name = "CONSTRAINTVALUE", type = "double", nullable = true },
    { id = 6, name = "DESCRIPTION", type = "string", nullable = true },
    { id = 7, name = "STATUS", type = "string", nullable = true },
    { id = 8, name = "GENERICCONSTRAINTWEIGHT", type = "double", nullable = true },
    { id = 9, name = "AUTHORISEDDATE", type = "timestamp_ns", nullable = true },
    { id = 10, name = "AUTHORISEDBY", type = "string", nullable = true },
    { id = 11, name = "DYNAMICRHS", type = "double", nullable = true },
    { id = 12, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
    { id = 13, name = "DISPATCH", type = "string", nullable = true },
    { id = 14, name = "PREDISPATCH", type = "string", nullable = true },
    { id = 15, name = "STPASA", type = "string", nullable = true },
    { id = 16, name = "MTPASA", type = "string", nullable = true },
    { id = 17, name = "IMPACT", type = "string", nullable = true },
    { id = 18, name = "SOURCE", type = "string", nullable = true },
    { id = 19, name = "LIMITTYPE", type = "string", nullable = true },
    { id = 20, name = "REASON", type = "string", nullable = true },
    { id = 21, name = "MODIFICATIONS", type = "string", nullable = true },
    { id = 22, name = "ADDITIONALNOTES", type = "string", nullable = true },
    { id = 23, name = "P5MIN_SCOPE_OVERRIDE", type = "string", nullable = true },
    { id = 24, name = "LRC", type = "string", nullable = true },
    { id = 25, name = "LOR", type = "string", nullable = true },
    { id = 26, name = "FORCE_SCADA", type = "double", nullable = true },
    { id = 27, name = "SYSTEMSECURITY", type = "string", nullable = true },
    { id = 28, name = "SSM_REGIONID", type = "string", nullable = true },
    { id = 29, name = "SSM_GROUPID", type = "string", nullable = true },
]

