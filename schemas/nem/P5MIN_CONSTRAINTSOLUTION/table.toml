# Our schema of P5MIN_CONSTRAINTSOLUTION. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "P5MIN_CONSTRAINTSOLUTION"
description = """
The Five-Minute Pre-Dispatch (P5Min) is a MMS system providing projected dispatch for 12 Dispatch cycles (one hour). The Five-Minute Pre-dispatch cycle runs every 5-minutes to produce a dispatch and pricing schedule to a 5-minute resolution covering the next hour, a total of twelve periods.
P5MIN_CONSTRAINTSOLUTION shows binding and violated constraint results from the capacity evaluation, including the RHS value."""
report_pairs = [["P5MIN", "CONSTRAINTSOLUTION"]]
load_mode = "append"
primary_key = ["RUN_DATETIME", "INTERVAL_DATETIME", "CONSTRAINTID"]
time_column = "INTERVAL_DATETIME"
next_column_id = 14

column = [
    { id = 1, name = "RUN_DATETIME", type = "timestamp_ns", nullable = false },
    { id = 3, name = "INTERVAL_DATETIME", type = "timestamp_ns", nullable = false },
    { id = 4, name = "CONSTRAINTID", type = "string", nullable = false },
    { id = 5, name = "RHS", type = "double", nullable = true },
    { id = 6, name = "MARGINALVALUE", type = "double", nullable = true },
    { id = 7, name = "VIOLATIONDEGREE", type = "double", nullable = true },
    { id = 8, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
    { id = 9, name = "DUID", type = "string", nullable = true },
    { id = 10, name = "GENCONID_EFFECTIVEDATE", type = "timestamp_ns", nullable = true },
    { id = 11, name = "GENCONID_VERSIONNO", type = "double", nullable = true },
    { id = 12, name = "LHS", type = "double", nullable = true },
    { id = 2, name = "INTERVENTION", type = "double", nullable = true },
    { id = 13, name = "CONFIDENTIAL_TO", type = "string", nullable = true },
]

[temporal]
origin = "derived"
entity = ["CONSTRAINTID", "INTERVENTION"]
valid = { kind = "interval_end", column = "INTERVAL_DATETIME" }
order = ["RUN_DATETIME", "LASTCHANGED"]
cutoff = "RUN_DATETIME"

