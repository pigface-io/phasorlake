    { id = 1, name = "EFFECTIVEDATE", type = "timestamp_ns", nullable = false },
    { id = 2, name = "VERSION_DATETIME", type = "timestamp_ns", nullable = false },
    { id = 3, name = "RESERVELIMITID", type = "string", nullable = false },
    { id = 4, name = "DESCRIPTION", type = "string", nullable = true },
    { id = 5, name = "RHS", type = "double", nullable = true },
    { id = 6, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
]

