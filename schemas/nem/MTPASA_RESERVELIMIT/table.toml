# Our schema of MTPASA_RESERVELIMIT. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "MTPASA_RESERVELIMIT"
description = "MT PASA input table defining a MT PASA Reserve Requirement within a single set. An MT PASA Reserve Requirement can span more than one region."
report_pairs = [["MTPASA", "RESERVELIMIT"]]
load_mode = "append"
primary_key = ["EFFECTIVEDATE", "VERSION_DATETIME", "RESERVELIMITID"]
time_column = "EFFECTIVEDATE"
next_column_id = 7

column = [
    { id = 1, name = "EFFECTIVEDATE", type = "timestamp", nullable = false },
    { id = 2, name = "VERSION_DATETIME", type = "timestamp", nullable = false },
    { id = 3, name = "RESERVELIMITID", type = "string", nullable = false },
    { id = 4, name = "DESCRIPTION", type = "string", nullable = true },
    { id = 5, name = "RHS", type = "double", nullable = true },
    { id = 6, name = "LASTCHANGED", type = "timestamp", nullable = true },
]

[temporal]
origin = "derived"
entity = ["RESERVELIMITID"]
valid = { kind = "from", column = "EFFECTIVEDATE" }
order = ["VERSION_DATETIME", "LASTCHANGED"]
cutoff = "VERSION_DATETIME"

[[increment]]
n = 1
from = "2015-01"
ctl = "001.ctl"
ctl_sha256 = "cd6c49d9fe6d08c0e48baf71f90c94c7541c08790f97b482f8c71d11f7a54900"
aemo_ctl = "PUBLIC_DVD_MTPASA_RESERVELIMIT_201501.ctl"
aemo_versions = [1]
columns = [
    "EFFECTIVEDATE",
    "VERSION_DATETIME",
    "RESERVELIMITID",
    "DESCRIPTION",
    "RHS",
    "LASTCHANGED",
]
