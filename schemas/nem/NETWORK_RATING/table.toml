# Our schema of NETWORK_RATING. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "NETWORK_RATING"
description = """
NETWORK_RATING defines a list of the equipment ratings that may be used as inputs to market constraints.
If the rating is flagged as dynamic then in real-time the rating will be dynamically determined and the static value will be used as a fallback value should the dynamic value fail.
Note:
In some rare cases equipment has ratings provided from more than one TNSP. This is identified by a different SPD Id. The value used in the NEM is normally the more restrictive of the two values."""
report_pairs = [["NETWORK", "RATING"]]
load_mode = "append"
primary_key = ["SPD_ID", "VALIDFROM"]
time_column = "LASTCHANGED"
next_column_id = 11

column = [
    { id = 1, name = "SPD_ID", type = "string", nullable = false },
    { id = 2, name = "VALIDFROM", type = "timestamp", nullable = false },
    { id = 3, name = "VALIDTO", type = "timestamp", nullable = true },
    { id = 4, name = "REGIONID", type = "string", nullable = true },
    { id = 5, name = "SUBSTATIONID", type = "string", nullable = true },
    { id = 6, name = "EQUIPMENTTYPE", type = "string", nullable = true },
    { id = 7, name = "EQUIPMENTID", type = "string", nullable = true },
    { id = 8, name = "RATINGLEVEL", type = "string", nullable = true },
    { id = 9, name = "ISDYNAMIC", type = "double", nullable = true },
    { id = 10, name = "LASTCHANGED", type = "timestamp", nullable = true },
]

[temporal]
origin = "derived"
entity = ["SPD_ID"]
valid = { kind = "from", column = "VALIDFROM" }
order = ["LASTCHANGED"]
cutoff = "LASTCHANGED"

[[increment]]
n = 1
from = "2024-08"
ctl = "001.ctl"
ctl_sha256 = "1849f88fc172b0905740d290fc207ea935b4e2cd92c55835c7a8fae6f5668a8d"
aemo_ctl = "PUBLIC_ARCHIVE#NETWORK_RATING#FILE01#202408.ctl"
aemo_versions = [1]
columns = [
    "SPD_ID",
    "VALIDFROM",
    "VALIDTO",
    "REGIONID",
    "SUBSTATIONID",
    "EQUIPMENTTYPE",
    "EQUIPMENTID",
    "RATINGLEVEL",
    "ISDYNAMIC",
    "LASTCHANGED",
]
