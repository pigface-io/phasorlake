# Our schema of DUALLOC. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "DUALLOC"
description = "DUALLOC cross references dispatch unit identifier to genset ID for each participant."
report_pairs = [["PARTICIPANT_REGISTRATION", "DUALLOC"]]
load_mode = "snapshot"
primary_key = ["EFFECTIVEDATE", "VERSIONNO", "DUID", "GENSETID"]
next_column_id = 6

column = [
    { id = 1, name = "EFFECTIVEDATE", type = "timestamp_ns", nullable = false },
    { id = 2, name = "VERSIONNO", type = "double", nullable = false },
    { id = 3, name = "DUID", type = "string", nullable = false },
    { id = 4, name = "GENSETID", type = "string", nullable = false },
    { id = 5, name = "LASTCHANGED", type = "timestamp_ns", nullable = true },
]

[temporal]
origin = "derived"
entity = ["DUID", "GENSETID"]
valid = { kind = "from", column = "EFFECTIVEDATE" }
order = ["VERSIONNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"

[[increment]]
n = 1
from = "2020-10"
ctl = "001.ctl"
ctl_sha256 = "70bf995d4d5bd948c7c59e41b03fde103195689644a6cbf19509378febcee603"
aemo_ctl = "PUBLIC_DVD_DUALLOC_202010.ctl"
aemo_versions = [1]
columns = [
    "EFFECTIVEDATE",
    "VERSIONNO",
    "DUID",
    "GENSETID",
    "LASTCHANGED",
]
