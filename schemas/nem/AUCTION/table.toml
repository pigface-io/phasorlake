ctl = "001.ctl"
ctl_sha256 = "d3f179786d878b9cc493275da51898473f511973f50007a0b24d17813e64b5f2"
aemo_ctl = "PUBLIC_DVD_AUCTION_201503.ctl"
aemo_versions = [1]
