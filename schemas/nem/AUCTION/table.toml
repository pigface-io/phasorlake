# Our schema of AUCTION. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "AUCTION"
description = "AUCTION holds auction details. AUCTION is new in March 2003 to support SRA Inter-Temporal Linking."
report_pairs = [["IRAUCTION_CONFIG", "AUCTION"]]
load_mode = "append"
primary_key = ["AUCTIONID"]
time_column = "LASTCHANGED"
next_column_id = 10

column = [
    { id = 1, name = "AUCTIONID", type = "string", nullable = false },
    { id = 2, name = "AUCTIONDATE", type = "timestamp", nullable = true },
    { id = 3, name = "NOTIFYDATE", type = "timestamp", nullable = true },
    { id = 4, name = "STARTDATE", type = "timestamp", nullable = true },
    { id = 5, name = "ENDDATE", type = "timestamp", nullable = true },
    { id = 6, name = "DESCRIPTION", type = "string", nullable = true },
    { id = 7, name = "AUTHORISEDDATE", type = "timestamp", nullable = true },
    { id = 8, name = "AUTHORISEDBY", type = "string", nullable = true },
    { id = 9, name = "LASTCHANGED", type = "timestamp", nullable = true },
]

[temporal]
origin = "derived"
entity = ["AUCTIONID"]
valid = { kind = "timeless" }
order = ["LASTCHANGED"]
cutoff = "LASTCHANGED"

[[increment]]
