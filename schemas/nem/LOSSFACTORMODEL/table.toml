# Our schema of LOSSFACTORMODEL. Hand edits are welcome; `nemlake-census sync` only appends increments and columns.
schema_format = 3
name = "LOSSFACTORMODEL"
description = "LOSSFACTORMODEL sets out the demand coefficients for each interconnector, used by LP Solver modelling of interconnector flows."
report_pairs = [["MARKET_CONFIG", "LOSSFACTORMODEL"]]
load_mode = "snapshot"
primary_key = ["EFFECTIVEDATE", "VERSIONNO", "INTERCONNECTORID", "REGIONID"]
next_column_id = 7

column = [
    { id = 1, name = "EFFECTIVEDATE", type = "timestamp", nullable = false },
    { id = 2, name = "VERSIONNO", type = "double", nullable = false },
    { id = 3, name = "INTERCONNECTORID", type = "string", nullable = false },
    { id = 4, name = "REGIONID", type = "string", nullable = false },
    { id = 5, name = "DEMANDCOEFFICIENT", type = "double", nullable = true },
    { id = 6, name = "LASTCHANGED", type = "timestamp", nullable = true },
]

[temporal]
origin = "derived"
entity = ["INTERCONNECTORID", "REGIONID"]
valid = { kind = "from", column = "EFFECTIVEDATE" }
order = ["VERSIONNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"

[[increment]]
n = 1
from = "2015-01"
ctl = "001.ctl"
ctl_sha256 = "1174033f687f62a5785786233b0be9e4f792e11d88545c3d8b95760ee251e05a"
aemo_ctl = "PUBLIC_DVD_LOSSFACTORMODEL_201501.ctl"
aemo_versions = [1]
columns = [
    "EFFECTIVEDATE",
    "VERSIONNO",
    "INTERCONNECTORID",
    "REGIONID",
    "DEMANDCOEFFICIENT",
    "LASTCHANGED",
]
