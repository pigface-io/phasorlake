# CI runs what a developer's hooks run, through the same `just` recipes, plus
# the tiers that are too slow or too environment-bound for a hook: the full
# benchmark set on the machine class the budgets were taken on, the known
# vulnerabilities of the dependencies, and the real nemweb once a week.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A dependency becomes vulnerable, or nemweb changes, without a commit here: look weekly.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The versions the hooks were written against, each download checked against its SHA-256.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256_LINUX: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256_LINUX: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  PREK_VERSION: "0.5.4"
  # The read tests run their SQL through the DuckDB CLI; the justfile's setup pins the same.
  DUCKDB_VERSION: "1.5.6"
  DUCKDB_SHA256_LINUX: 6e89deac1ebbc36eed0291caf8b567b030c7b86ac35998f71854e22b3c5d5e2f
  CARGO_LLVM_COV_VERSION: "0.9.1"
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  # Every git hook of both stages on every file: style, lint, tests, coverage
  # floors, the schema regeneration check, the error catalogue, the agent index,
  # secrets, and the fast benchmark set.
  hooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The whole history: gitleaks scans every commit and the ratchet diffs against main.
          fetch-depth: 0
          # No job pushes: the token does not stay on disk for a tool to find.
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          schemas-key: ${{ secrets.PHASOR_SCHEMAS_KEY }}
      - name: Install gitleaks, shellcheck, duckdb, prek and cargo-llvm-cov
        run: |
          scripts/fetch-tool.sh \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "$GITLEAKS_SHA256_LINUX" \
            "gitleaks" \
            "$HOME/.local/bin"
          scripts/fetch-tool.sh \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            "$SHELLCHECK_SHA256_LINUX" \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            "$HOME/.local/bin"
          scripts/fetch-tool.sh \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip" \
            "$DUCKDB_SHA256_LINUX" \
            "duckdb" \
            "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/duckdb" -c "INSTALL iceberg"
          pipx install "prek==${PREK_VERSION}"
          cargo install --locked cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION"
      # The budgets are taken on Apple silicon; the Linux runner only checks that the
      # benchmarks still run, so the fast set is skipped here and run in the bench job.
      - run: SKIP=bench-fast,budget-ratchet just check
      - run: just budget-check origin/main
        if: github.event_name == 'pull_request'
      - name: Scan the whole history for secrets
        run: just secrets

  # The benchmarks on the machine class the budgets were taken on.
  bench:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          schemas-key: ${{ secrets.PHASOR_SCHEMAS_KEY }}
      - run: just bench
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: criterion
          path: target/criterion
          retention-days: 90

  # Known vulnerabilities in the Rust crates, against the lock file.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          schemas-key: ${{ secrets.PHASOR_SCHEMAS_KEY }}
      - run: cargo install --locked cargo-audit --version "$CARGO_AUDIT_VERSION"
      - run: just audit

  # The real nemweb: a listing and the smallest zip. Weekly and on demand only.
  net:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          schemas-key: ${{ secrets.PHASOR_SCHEMAS_KEY }}
      - run: sudo apt-get install -y zsh
      - run: just net-test
