[package]
name = "phasor-net"
description = "Moving AEMO's files over HTTP into the archive: one transport, paced and retried fetches, the fetch errors, and the archive store's helpers, for the lake and the mirror alike."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["http", "fetch"]
# Paced, retried requests and bodies streamed to disk, on tokio.
fetch = ["dep:tokio", "dep:serde", "dep:serde_json", "dep:crc32fast"]
# The reqwest transport: what reaches a real server.
http = ["dep:reqwest"]
# A local HTTP server and archive records for other crates' tests.
test-support = []

[dependencies]
phasor-core.workspace = true
phasor-provenance.workspace = true
async-trait.workspace = true
bytes.workspace = true
crc32fast = { workspace = true, optional = true }
futures.workspace = true
reqwest = { workspace = true, optional = true }
rustix.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["sync", "time", "rt"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
