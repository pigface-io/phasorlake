[package]
name = "utilake-writer"
description = "Writing the lake: Parquet files, partitions, the SQLite manifest."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
zonetrace = { workspace = true, optional = true }
utilake-core.workspace = true
utilake-iceberg.workspace = true
utilake-iceberg-store.workspace = true
utilake-kit.workspace = true
arrow.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
parquet.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[[bench]]
name = "write"
harness = false

[features]
# Times the work in zones of zonetrace.
zones = ["dep:zonetrace"]
