[package]
name = "utilake-bench"
description = "End-to-end benchmark harness measuring wall time, peak heap and allocations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "utilake-bench"
path = "src/main.rs"

[dependencies]
utilake-core.workspace = true
utilake-nem.workspace = true
utilake-mms-conform.workspace = true
utilake-kit.workspace = true
utilake-acquire.workspace = true
utilake-pipeline.workspace = true
utilake-registry.workspace = true
utilake-writer.workspace = true
peak_alloc.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros"] }
tokio-util.workspace = true
zip.workspace = true
zonetrace = { workspace = true, optional = true }
# Named only to turn on their zones.
utilake-mms-decode = { workspace = true, optional = true }
utilake-zip = { workspace = true, optional = true }

[features]
# Prints where the ingest's time went, in zones.
zones = [
    "dep:zonetrace",
    "utilake-pipeline/zones",
    "utilake-mms-conform/zones",
    "utilake-mms-decode/zones",
    "utilake-zip/zones",
]
