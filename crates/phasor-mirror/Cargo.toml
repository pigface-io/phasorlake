[package]
name = "phasor-mirror"
description = "phasor-mirror: a copy of every file under nemweb's archive folders, and the catalog of it: every folder, file and zip entry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "phasor-mirror"
path = "src/main.rs"

[dependencies]
phasor-core.workspace = true
phasor-net = { workspace = true, features = ["http", "fetch"] }
phasor-plain-decode.workspace = true
phasor-zip.workspace = true
phasor-provenance.workspace = true
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
clap.workspace = true
crc32fast.workspace = true
futures.workspace = true
memchr.workspace = true
reqwest.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true
zip.workspace = true

[dev-dependencies]
phasor-net = { workspace = true, features = ["http", "fetch", "test-support"] }
criterion.workspace = true

[[bench]]
name = "mirror"
harness = false

[[bench]]
name = "fetch"
harness = false
