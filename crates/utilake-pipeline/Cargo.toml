[package]
name = "utilake-pipeline"
description = "Orchestration of list, fetch, ingest and commit as tokio streams."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
zonetrace = { workspace = true, optional = true }
arrow-array.workspace = true
arrow-schema.workspace = true
utilake-core.workspace = true
utilake-kit.workspace = true
utilake-zip.workspace = true
utilake-acquire.workspace = true
utilake-provenance.workspace = true
utilake-writer.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-util.workspace = true
url.workspace = true

[dev-dependencies]
utilake-mms-conform.workspace = true
utilake-nem.workspace = true
utilake-gas.workspace = true
utilake-wem.workspace = true
utilake-mms-decode.workspace = true
utilake-registry.workspace = true
arrow-select.workspace = true
async-trait.workspace = true
parquet.workspace = true
tempfile.workspace = true
zip.workspace = true

[features]
# Times the work in zones of zonetrace.
zones = ["dep:zonetrace", "utilake-writer/zones"]
