[package]
name = "utilake-net"
description = "Moving AEMO's files over HTTP into the archive: one transport, paced and retried fetches, the fetch errors, and the archive store's helpers, for the lake and the mirror alike."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["http"]
# The reqwest transport: what reaches a real server.
http = ["dep:reqwest"]
# A local HTTP server and archive records for other crates' tests.
test-support = []

[dependencies]
utilake-core.workspace = true
utilake-provenance.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
reqwest = { workspace = true, optional = true }
rustix.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
